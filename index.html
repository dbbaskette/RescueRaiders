<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e1c">
<link rel="stylesheet" href="mobile.css">
<title>RESCUE RAIDERS — Armor Alley Tribute</title>
<style>
  html,body{margin:0;padding:0;background:#05060d;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,monospace}
  body{display:flex;align-items:center;justify-content:center}
  canvas{
    width:min(100vw,calc(100vh*16/9));
    height:min(calc(100vw*9/16),100vh);
    image-rendering:pixelated;
    box-shadow:0 0 80px rgba(90,130,255,.18);
    background:#000;
    user-select:none;
    -webkit-user-select:none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
'use strict';
// ============================================================ CONSTANTS
const cv=document.getElementById('game'),cx=cv.getContext('2d');
const W=1280,H=720,WORLD=9000,GROUND=622,BALLOON_Y=235;
const PLAYER_X=150,ENEMY_X=WORLD-150;
const BUNKER_XS=[1850,3550,5250,6950];
const CAPTURE_N=3;
const GUN_CD=.11, FUEL_BURN=.28, LOW_FUEL=20;
const BOMB_GRAVITY=480,BOMB_DRAG=.4,FORWARD_HP=.75,RESERVE_SECONDS=20;
const DIFFICULTIES={
  recruit:{name:'Recruit',funds:450,damage:.7,interval:6,income:18,vanTime:100},
  normal:{name:'Normal',funds:300,damage:1,interval:4,income:22,vanTime:70},
  veteran:{name:'Veteran',funds:220,damage:1.2,interval:3,income:27,vanTime:50}
};
const SETTINGS={difficulty:'normal'};

const UT={
  INF :{hp:22, spd:44, rng:250, dmg:6,  cd:.55, w:10,h:16, cost:20 },
  TANK:{hp:130,spd:30, rng:430, dmg:32, cd:2.3, w:40,h:15, cost:120},
  AA  :{hp:64, spd:26, rng:900, dmg:46, cd:3.6, w:36,h:13, cost:160},
  VAN :{hp:70, spd:76, rng:0,   dmg:0,  cd:0,   w:42,h:17, cost:250},
};

// ============================================================ UTILS
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);};

// ============================================================ ASSETS
const SPR={},UNIT_SPR={INF:'soldier',TANK:'tank',AA:'aa',VAN:'van'};
const SPR_CFG={
  heli:{w:130,face:-1},tank:{w:95,face:1},aa:{w:110,face:-1},van:{w:100,face:1},
  soldier:{w:30,face:1},balloon:{w:120,face:1},bunker:{w:110,face:1},hq:{w:300,face:1}
};
let ASSETS_OK=false,ASSET_FAIL=[],ASSET_GOT=0,ASSET_NEED=0;
(function loadAssets(){
  let need=1,got=0;
  const done=()=>{ASSET_GOT=++got;if(got>=need)ASSETS_OK=true;};
  const watch=(img,name)=>{
    ASSET_NEED++;
    img.onload=done;
    img.onerror=()=>{ASSET_FAIL.push(name);done();};
  };
  for(const n in SPR_CFG){
    SPR[n]={img:new Image(),red:new Image()};need+=2;
    watch(SPR[n].img,n);watch(SPR[n].red,n+'_r');
    SPR[n].img.src='assets/'+n+'.png';
    SPR[n].red.src='assets/'+n+'_r.png';
  }
  SPR.backdrop=new Image();watch(SPR.backdrop,'backdrop');
  SPR.backdrop.src='assets/backdrop.jpg';
})();
function sprImg(name,side){
  const s=SPR[name];
  if(!s)return null;
  if(side<0&&s.red&&s.red.complete&&s.red.naturalWidth>0)return s.red;
  if(s.img&&s.img.complete&&s.img.naturalWidth>0)return s.img;
  return (side<0&&s.red)?s.red:s.img;
}
function drawSprite(name,side,px,py,w,flip,rot,bottom){
  const img=sprImg(name,side);
  if(!img||!img.complete||!img.width)return;
  const h=w*img.height/img.width;
  cx.save();cx.translate(px,py);
  if(rot)cx.rotate(rot);
  if(flip)cx.scale(-1,1);
  cx.drawImage(img,-w/2,bottom?-h:-h/2,w,h);
  cx.restore();
}

// ============================================================ AUDIO
let AC=null,NOISE=null,AUDIO_MUTED=false;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    NOISE=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);
    const d=NOISE.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  return AC;
}
function toggleAudio(){
  AUDIO_MUTED=!AUDIO_MUTED;
  if(!AUDIO_MUTED)SFX.blip();
}
function tone(f0,f1,dur,type,vol){
  if(AUDIO_MUTED)return;
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type;o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}
function noise(dur,f,vol){
  if(AUDIO_MUTED)return;
  try{
    const a=ac(),s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter(),t=a.currentTime;
    s.buffer=NOISE;s.loop=true;fl.type='lowpass';fl.frequency.value=f;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(fl).connect(g).connect(a.destination);s.start(t);s.stop(t+dur);
  }catch(e){}
}
const SFX={
  gun(){noise(.07,4000,.05);tone(300,120,.06,'square',.04);},
  boom(big){noise(big?.7:.35,big?900:1400,big?.3:.18);tone(120,30,big?.6:.3,'triangle',big?.22:.12);},
  missile(){tone(700,180,.5,'sawtooth',.09);noise(.4,2500,.05);},
  blip(){tone(600,900,.09,'square',.08);},
  cash(){tone(900,1400,.07,'square',.06);setTimeout(()=>tone(1200,1600,.07,'square',.06),70);},
  deny(){tone(200,90,.15,'square',.09);},
  cable(){noise(.5,3000,.25);tone(800,100,.4,'sawtooth',.15);},
  alarm(){for(let i=0;i<3;i++){setTimeout(()=>tone(750,750,.14,'square',.12),i*300);setTimeout(()=>tone(520,520,.14,'square',.12),i*300+150);}},
  caution(){tone(920,540,.09,'sawtooth',.08);setTimeout(()=>tone(920,540,.09,'sawtooth',.08),120);},
  cap(){[440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,f,.1,'square',.08),i*90));},
};

// ============================================================ STATE
let G=null;
function newGame(){
  if(typeof TOUCH!=='undefined'&&TOUCH.reset)TOUCH.reset();
  G={
    state:'menu',paused:false,time:0,anim:0,
    funds:DIFFICULTIES[SETTINGS.difficulty].funds,eFunds:300,ecoT:0,aiT:4,
    difficulty:SETTINGS.difficulty,aiAccum:0,tutorial:null,damageEdges:{left:0,right:0,top:0,bottom:0},vanAlertLevel:0,
    lives:3,score:0,kills:0,
    helis:[mkHeli(1),mkHeli(-1)],
    units:[],bullets:[],shells:[],bombs:[],missiles:[],flares:[],decals:[],
    parts:[],msgs:[],wrecks:[],bombAiming:false,
    bunkers:BUNKER_XS.map(x=>({
      x,owner:-1,capPulse:0,
      balloonHp:40,balloonMax:40,balloonDead:false,balloonRespawn:0,
      cableHp:30,cableBroken:false
    })),
    camX:0,shake:0,flash:0,endMsg:'',
    stats:{deployed:{INF:0,TANK:0,AA:0,VAN:0},kills:0,bunkersCap:0,helisLost:0,cablesSevered:0},
    cableWarning:0,
    cautionTimer:0,scanTimer:0,
    bannerAlert:null,
    spawnPings:[],
    buttons:[]
  };
}
function mkHeli(side){
  return{side,x:side>0?PLAYER_X+140:ENEMY_X-140,y:300,vx:0,vy:0,dir:side,
    hp:100,maxhp:100,dead:false,respawn:0,
    cdGun:0,cdBomb:0,cdMis:0,cableCd:0,
    bombs:8,mis:4,flares:3,cargo:0,seed:Math.random()*10,
    aiT:0,fuel:100,reserve:RESERVE_SECONDS,washTimer:0};
}

function enginePowered(h){return h.fuel>0||h.reserve>0;}
function difficulty(){return DIFFICULTIES[G.difficulty];}
function vanThreat(){
  let best=null;
  for(const van of G.units)if(van.side<0&&van.type==='VAN'){
    const seconds=Math.max(0,(van.x-(PLAYER_X+70))/UT.VAN.spd);
    if(!best||seconds<best.seconds)best={van,seconds,level:seconds<=15?2:seconds<=30?1:0};
  }
  return best;
}
function formatETA(seconds){const t=Math.ceil(seconds);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function startTutorial(){
  newGame();G.state='play';G.tutorial={step:0,bombed:false};G.difficulty='recruit';
  G.helis[1].dead=true;G.helis[1].respawn=1e9;
  G.bunkers=[{x:1100,owner:0,capPulse:0,balloonHp:40,balloonMax:40,balloonDead:true,
    balloonRespawn:1e9,cableHp:30,cableBroken:true}];
}
function restartMission(){if(G.tutorial)startTutorial();else{newGame();G.state='play';}}
function tutorialHint(){
  if(!G.tutorial)return '';
  return [
    TOUCH.active?'1/4 · Fly right to the training marker':'1/4 · Fly right past 500m using WASD / arrows',
    TOUCH.active?'2/4 · Hold BOMB, release to hit the ground':'2/4 · Hold B to aim, release to hit the ground',
    TOUCH.active?'3/4 · Hover low near troops; tap Board':'3/4 · Hover low near troops; press E to board',
    TOUCH.active?'4/4 · Drop troops at the marked bunker':'4/4 · Fly to the marked bunker; hover low and press E'
  ][G.tutorial.step];
}
function updateTutorial(){
  const t=G.tutorial,p=G.helis[0];if(!t||p.dead)return;
  if(t.step===0&&p.x>=500){t.step=1;t.bombed=false;SFX.blip();}
  else if(t.step===1&&t.bombed){
    t.step=2;
    for(let i=0;i<3;i++){const u=spawnUnit(1,'INF');u.x=clamp(p.x+(i-1)*20,60,WORLD-60);}
    SFX.blip();
  }else if(t.step===2&&p.cargo>=3){t.step=3;SFX.blip();}
  else if(t.step===3&&G.bunkers[0].owner===1)endGame(true,'TRAINING COMPLETE — READY FOR A COMBAT SORTIE');
}
function cableIsUrgent(b){
  const p=G.helis[0];return b.owner!==1&&!p.dead&&Math.abs(p.x-b.x)<200&&p.y>BALLOON_Y-30;
}

// ============================================================ INPUT & MOUSE
const TOUCH={active:false,x:0,y:0,fire:false,render:null,reset:null};
const keys={};
const mouse={x:-1,y:-1,down:false};
function getCanvasPos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('mousemove',e=>{const p=getCanvasPos(e);mouse.x=p.x;mouse.y=p.y;});
cv.addEventListener('mouseleave',()=>{mouse.x=-1;mouse.y=-1;mouse.down=false;});
cv.addEventListener('mousedown',e=>{ac();mouse.down=true;});
cv.addEventListener('mouseup',e=>{mouse.down=false;});
cv.addEventListener('click',e=>{ac();const p=getCanvasPos(e);handleCanvasClick(p.x,p.y);});

addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code])onKey(e.code);
  keys[e.code]=true;
});
addEventListener('keyup',e=>onKeyUp(e.code));
addEventListener('blur',()=>{
  for(const key in keys)keys[key]=false;
  mouse.down=false;
  if(TOUCH.reset)TOUCH.reset();
  if(G){G.bombAiming=false;if(G.state==='play')G.paused=true;}
});

function onKey(code){
  ac();
  if(G.state==='menu'&&code==='KeyT'){startTutorial();return;}
  if(G.state==='menu'&&['Digit1','Digit2','Digit3'].includes(code)){SETTINGS.difficulty=['recruit','normal','veteran'][Number(code.slice(-1))-1];return;}
  if(code==='Enter'){
    if(G.state==='menu'||G.state==='over'||G.state==='win'){newGame();G.state='play';SFX.blip();}
    return;
  }
  if(code==='KeyP'&&G.state==='play'){if(TOUCH.reset)TOUCH.reset();G.paused=!G.paused;G.bombAiming=false;return;}
  if(G.state!=='play'||G.paused)return;
  const p=G.helis[0];
  if(code==='Digit1')buy(1,'INF');
  if(code==='Digit2')buy(1,'TANK');
  if(code==='Digit3')buy(1,'AA');
  if(code==='Digit4')buy(1,'VAN');
  if(p&&!p.dead&&code==='KeyE')troopTransfer(p);
  if(p&&!p.dead&&code==='KeyC'){
    if(p.flares>=1){
      p.flares--;
      for(let i=0;i<3;i++)
        G.flares.push({x:p.x,y:p.y+8,vx:-p.dir*rnd(130,230)+rnd(-40,40),vy:rnd(30,110),life:2.2});
      noise(.5,3000,.12);tone(1400,400,.3,'sawtooth',.05);
      msg('FLARES DEPLOYED!','#ffd97a','routine');
    }else SFX.deny();
  }
  if(code==='Escape'){G.bombAiming=false;return;}
  if(p&&!p.dead&&code==='KeyB'){
    G.bombAiming=p.bombs>=1;
    if(!G.bombAiming)SFX.deny();
  }
  if(p&&!p.dead&&code==='KeyM'&&p.cdMis<=0){
    const t=nearestAirTarget(p.x,p.y,1,1600)||nearestGroundTarget(p.x,p.y,1,1600);
    if(p.mis>=1&&t){p.mis--;p.cdMis=1.1;
      G.missiles.push(mkMissile(p.x+p.dir*20,p.y,t,1));SFX.missile();
    }else SFX.deny();
  }
}

function onKeyUp(code){
  keys[code]=false;
  if(code!=='KeyB')return;
  const armed=G.bombAiming;G.bombAiming=false;
  const p=G.helis[0];
  if(!armed||G.state!=='play'||G.paused||!p||p.dead)return;
  if(p.cdBomb>0||p.bombs<1){SFX.deny();return;}
  p.bombs--;p.cdBomb=.7;G.bombs.push(bombFromHeli(p));SFX.blip();
}
function bombFromHeli(h){
  return {x:h.x,y:h.y+12,vx:h.vx*.85+h.dir*40,vy:h.vy+40,side:h.side};
}
// Closed-form ballistic motion is shared by live bombs and the ground estimate.
function bombGroundTime(b){
  const height=Math.max(0,GROUND-6-b.y);
  return height===0?0:(-b.vy+Math.sqrt(b.vy*b.vy+2*BOMB_GRAVITY*height))/BOMB_GRAVITY;
}
function bombPosition(b,t){
  return {x:b.x+b.vx*(1-Math.exp(-BOMB_DRAG*t))/BOMB_DRAG,
    y:b.y+b.vy*t+.5*BOMB_GRAVITY*t*t};
}
function stepBomb(b,dt){
  const t=Math.min(dt,bombGroundTime(b)),pos=bombPosition(b,t);
  b.x=pos.x;b.y=pos.y;b.vy+=BOMB_GRAVITY*t;b.vx*=Math.exp(-BOMB_DRAG*t);
  return t<dt||b.y>=GROUND-6-.001;
}
function forwardPadX(b){return b.x+110;}
function serviceAt(h){
  if(h.dead||h.y<=GROUND-72)return null;
  const bx=h.side>0?PLAYER_X:ENEMY_X;
  if(Math.abs(h.x-bx)<230)return {kind:'hq',x:bx};
  if(Math.abs(h.vx)>60||Math.abs(h.vy)>45)return null;
  const b=G.bunkers.find(b=>b.owner===h.side&&Math.abs(h.x-forwardPadX(b))<65);
  return b?{kind:'forward',x:forwardPadX(b)}:null;
}
function terrainAt(x){
  // Explicit world-anchored patches drive both ground rendering and effects.
  return hash(Math.floor(clamp(x,0,WORLD)/320)+71)>.48?'grass':'dirt';
}
function windAt(time){return 16+Math.sin(time*.17)*9;}
function emitGroundWash(x,strength){
  const grass=terrainAt(x)==='grass';
  for(const dir of [-1,1])G.parts.push({x:x+dir*rnd(12,38),y:GROUND-rnd(2,9),
    vx:dir*rnd(50,120)*strength,vy:rnd(-24,-8),life:rnd(.35,.65),
    c:grass?'#8a9160':'#998975',s:grass?rnd(1,2):rnd(2,5),g:grass?.2:-.03,
    grow:grass?0:8,wind:grass?.8:.6,streak:grass});
}

// ============================================================ SPAWNING / ECONOMY
function buy(side,type){
  if(G.tutorial){if(side===1)msg('TRAINING: USE THE PROVIDED TROOPS','#ffd97a');return;}
  const st=UT[type],f=side>0?'funds':'eFunds';
  if(type==='VAN'&&G.units.some(u=>u.side===side&&u.type==='VAN')){
    if(side>0){SFX.deny();msg('DEMO VAN ALREADY ACTIVE (1 MAX)','#ffb84d');}
    return;
  }
  if(G[f]<st.cost){
    if(side>0){SFX.deny();msg('INSUFFICIENT FUNDS ($'+(st.cost-G[f])+' NEEDED)','#ffb84d');}
    return;
  }
  G[f]-=st.cost;
  if(side>0){
    SFX.cash();
    G.stats.deployed[type]++;
    G.spawnPings.push({type,time:2.5,x:PLAYER_X+40});
    msg(type+' DEPLOYED FROM HQ','#8dff8d','routine');
  }
  spawnUnit(side,type);
}
function spawnUnit(side,type){
  const st=UT[type];
  let x=side>0?PLAYER_X+40:ENEMY_X-40,dir=side;
  let guard=0;
  while(guard++<80&&G.units.some(u=>u.side===side&&Math.abs(u.x-x)<st.w+18))x+=side*(st.w+18);
  x=clamp(x,70,WORLD-70);
  const u={type,side,x,dir,hp:st.hp,maxhp:st.hp,cd:rnd(.2,.8),phase:Math.random()*6,flash:0};
  G.units.push(u);
  return u;
}
function troopTransfer(p){
  if(p.y<GROUND-130){SFX.deny();msg('HOVER LOWER TO LOAD/DROP TROOPS','#ffb84d');return;}
  if(p.cargo>0){
    for(let i=0;i<p.cargo;i++){
      const st=UT.INF;
      G.units.push({type:'INF',side:1,x:p.x+(i-1.5)*14,dir:1,hp:st.hp,maxhp:st.hp,cd:1,phase:0,flash:0});
    }
    msg(p.cargo+' TROOPS DEPLOYED TO GROUND','#4db2ff','routine');p.cargo=0;SFX.blip();
  }else{
    const near=G.units.filter(u=>u.type==='INF'&&u.side===1&&Math.abs(u.x-p.x)<115)
                      .sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x)).slice(0,4);
    if(!near.length){SFX.deny();msg('NO FRIENDLY INFANTRY NEARBY','#ffb84d');return;}
    near.forEach(u=>{G.units.splice(G.units.indexOf(u),1);});
    p.cargo=near.length;msg('TROOPS ABOARD ('+near.length+'/4)','#4db2ff','routine');SFX.blip();
  }
}
function msg(text,color,kind='event'){G.msgs.unshift({text,color:color||'#fff',age:0,kind});if(G.msgs.length>4)G.msgs.pop();}

// ============================================================ COMBAT HELPERS
function mkMissile(x,y,target,side){
  return{x,y,vx:(side>0?1:-1)*160,vy:-60,side,target,life:6,trail:0};
}
function balloonY(b){return BALLOON_Y+Math.sin(G.anim*1.3+b.x)*5;}
function hitBalloon(x,y,side,dmg){
  for(const b of G.bunkers){
    if(b.balloonDead||b.owner===side)continue;
    const by=balloonY(b);
    if(Math.abs(x-b.x)<48&&Math.abs(y-by)<26){
      b.balloonHp-=dmg;
      G.parts.push({x,y,vx:rnd(-50,50),vy:rnd(-50,50),life:.3,c:'#ffb347',s:3,add:true});
      if(b.balloonHp<=0){
        b.balloonDead=true;b.balloonRespawn=35;b.cableBroken=true;
        explode(b.x,by,58,0,side);
        if(side>0){msg('ENEMY BALLOON DESTROYED!','#8dff8d');G.score+=75;}
        else msg('YOUR BALLOON WAS DESTROYED','#ff5548');
      }
      return true;
    }
  }
  return false;
}
function hitCable(x,y,side,dmg){
  for(const b of G.bunkers){
    if(b.balloonDead||b.cableBroken||b.owner===side)continue;
    const by=balloonY(b);
    if(Math.abs(x-b.x)<16&&y>by+20&&y<GROUND-40){
      b.cableHp-=dmg;
      G.parts.push({x,y,vx:rnd(-40,40),vy:rnd(-40,40),life:.25,c:'#ffe9a0',s:2,add:true,streak:true});
      if(b.cableHp<=0){
        b.cableBroken=true;
        explodeQuiet(b.x,y,22);
        SFX.cable();
        if(side>0){
          msg('ENEMY BARRAGE CABLE SEVERED!','#8dff8d');
          G.score+=40;
          if(G.stats)G.stats.cablesSevered=(G.stats.cablesSevered||0)+1;
        }else{
          msg('YOUR BARRAGE CABLE WAS SEVERED!','#ff5548');
        }
      }
      return true;
    }
  }
  return false;
}
function hitBalloonOrCable(x,y,side,dmg){
  return hitBalloon(x,y,side,dmg)||hitCable(x,y,side,dmg);
}
function nearestGroundTarget(x,y,side,maxD){
  let best=null,bd=maxD;
  for(const u of G.units)if(u.side!==side){
    const d=Math.hypot(u.x-x,(GROUND-UT[u.type].h/2)-y);if(d<bd){bd=d;best=u;}
  }
  return best;
}
function nearestAirTarget(x,y,side,maxD){
  let best=null,bd=maxD;
  for(const h of G.helis)if(!h.dead&&h.side!==side){
    const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}
  }
  return best;
}
function fireBullet(x,y,dir,side,dmg,spread){
  G.bullets.push({x,y,vx:dir*760+rnd(-spread,spread),vy:rnd(-14,14),life:1.2,side,dmg});
}
function explode(x,y,r,dmg,side){
  const big=r>60;
  if(dmg>0){SFX.boom(big);G.shake=Math.min(G.shake+(big?10:5),16);}
  G.flash=Math.max(G.flash,big?.2:.08);
  // white core flash
  G.parts.push({x,y,vx:0,vy:0,life:.16,c:'#fff',s:big?40:22,g:0,add:true,grow:big?260:150});
  // fireball blobs
  const nb=big?9:5;
  for(let i=0;i<nb;i++){
    G.parts.push({x:x+rnd(-r*.3,r*.3),y:y+rnd(-r*.25,r*.25),
      vx:rnd(-40,40),vy:rnd(-60,-10),life:rnd(.35,.6),c:i%2?'#ff8c2a':'#ffb347',
      s:rnd(6,13),g:-.1,add:true,grow:big?34:22});
  }
  // sparks
  for(let i=0;i<(big?14:8);i++){
    G.parts.push({x,y,vx:rnd(-1,1)*r*6,vy:rnd(-1.1,-.1)*r*5,life:rnd(.3,.6),
      c:'#ffe9a0',s:2,g:1.6,add:true,streak:true});
  }
  // rising smoke
  for(let i=0;i<(big?10:5);i++){
    G.parts.push({x:x+rnd(-r/2,r/2),y:y+rnd(-6,6),vx:rnd(-25,25),vy:rnd(-75,-25),
      life:rnd(1,1.9),c:i%2?'#4a4a4a':'#5c5c5c',s:rnd(7,13),g:-.16,grow:13,wind:1});
  }
  // shockwave
  G.parts.push({x,y,ring:true,r:8,vr:big?460:280,life:.34,c:'#ffd8a0'});
  // ground scorch
  if(y>GROUND-70){
    G.decals.push({x,y:GROUND-1,r:r*1.15,life:60});
    if(G.decals.length>30)G.decals.shift();
  }
  if(dmg<=0)return;
  for(const u of [...G.units]){
    if(u.side===side)continue;
    if(Math.abs(u.x-x)<r+UT[u.type].w/2&&Math.abs((GROUND-UT[u.type].h)-y)<r+30)
      hurtUnit(u,dmg);
  }
  for(const h of G.helis){
    if(h.dead||h.side===side)continue;
    if(Math.hypot(h.x-x,h.y-y)<r+22)hurtHeli(h,dmg*.8,{x,y});
  }
}
function hurtUnit(u,d){
  u.hp-=d;u.flash=.12;
  if(u.hp<=0){
    killUnit(u);
  }
}
function killUnit(u){
  const i=G.units.indexOf(u);if(i>=0)G.units.splice(i,1);
  if(u.side<0){G.kills++;if(G.stats)G.stats.kills++;G.score+=UT[u.type].cost;}
  explodeQuiet(u.x,GROUND-10,u.type==='INF'?26:44);
  if(u.type!=='INF'){
    G.wrecks.push({x:u.x,type:u.type,side:u.side,life:75,smokeT:0});
    if(G.wrecks.length>24)G.wrecks.shift();
  }
}
function explodeQuiet(x,y,r){
  for(let i=0;i<12;i++)
    G.parts.push({x,y,vx:rnd(-r*3,r*3),vy:rnd(-r*3,0),life:rnd(.25,.6),
      c:i%2?'#ffb347':'#ff5533',s:rnd(2,5),g:.6,add:i%2===0});
  for(let i=0;i<5;i++)
    G.parts.push({x:x+rnd(-8,8),y,vx:rnd(-25,25),vy:rnd(-60,-15),life:rnd(.6,1.1),c:'#555',s:rnd(4,8),g:-.12,wind:1});
  G.parts.push({x,y,ring:true,r:6,vr:240,life:.26,c:'#ffd8a0'});
}
function hurtHeli(h,d,source){
  if(h.dead)return;
  if(h.side===1&&source){
    d*=difficulty().damage;
    const dx=source.x-h.x,dy=source.y-h.y;
    const edge=Math.abs(dx)>=Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'top':'bottom');
    G.damageEdges[edge]=.65;
  }
  h.hp-=d;
  G.parts.push({x:h.x+rnd(-10,10),y:h.y,vx:rnd(-60,60),vy:rnd(-60,60),life:.3,c:'#ffd070',s:3,g:0});
  if(h.hp<=0){
    h.dead=true;h.respawn=h.side>0?3.5:7;
    if(h.side===1)G.bombAiming=false;
    SFX.boom(true);G.shake=14;
    for(let i=0;i<34;i++)
      G.parts.push({x:h.x,y:h.y,vx:rnd(-260,260),vy:rnd(-260,200),life:rnd(.4,1.1),
        c:['#ff5533','#ffb347','#ffd070'][i%3],s:rnd(2,6),g:.6,add:true});
    for(let i=0;i<12;i++)
      G.parts.push({x:h.x+rnd(-20,20),y:h.y,vx:rnd(-60,60),vy:rnd(-90,-20),life:rnd(.8,1.5),c:'#555',s:rnd(6,11),g:-.12});
    G.parts.push({x:h.x,y:h.y,vx:0,vy:0,life:.4,c:'#fff',s:48,g:0,add:true});
    G.parts.push({x:h.x,y:h.y,ring:true,r:10,vr:460,life:.35,c:'#ffd8a0'});
    if(h.side>0){
      G.lives--;
      if(G.stats)G.stats.helisLost++;
      if(G.lives>0)msg('HELICOPTER DOWN — '+G.lives+' REMAINING','#ff5548');
    }
  }
}

// ============================================================ UPDATE
function update(dt){
  G.time+=dt;
  for(const edge in G.damageEdges)G.damageEdges[edge]=Math.max(0,G.damageEdges[edge]-dt);
  // economy
  G.ecoT+=dt;
  if(G.ecoT>=3){
    G.ecoT-=3;
    G.funds+=25;
    G.eFunds+=Math.round(difficulty().income*(1+G.time/300));
    G.score+=2;
  }
  // shake decay
  G.shake*=Math.pow(.02,dt);

  // banner alert timer
  if(G.bannerAlert){
    G.bannerAlert.timer-=dt;
    if(G.bannerAlert.timer<=0)G.bannerAlert=null;
  }
  // spawn pings
  for(let i=G.spawnPings.length-1;i>=0;i--){
    G.spawnPings[i].time-=dt;
    if(G.spawnPings[i].time<=0)G.spawnPings.splice(i,1);
  }

  // helis
  for(const h of G.helis){
    h.cdGun-=dt;h.cdBomb-=dt;h.cdMis-=dt;h.cableCd-=dt;
    if(h.dead){
      h.respawn-=dt;
      if(h.respawn<=0){
        if(h.side>0&&G.lives<=0)continue;
        if(h.side===1&&G.tutorial){startTutorial();return;}
        Object.assign(h,{dead:false,hp:h.maxhp,x:h.side>0?PLAYER_X+140:ENEMY_X-140,
          y:300,vx:0,vy:0,bombs:8,mis:4,flares:3,cargo:0,fuel:100,reserve:RESERVE_SECONDS,rearming:false,service:null,cdGun:0,cdBomb:0,cdMis:0});
      }
      continue;
    }
    if(h.side>0)updatePlayerHeli(h,dt);
    else updateEnemyHeli(h,dt);
    // physics common
    h.vy+=60*dt;
    h.vx*=Math.exp(-2.1*dt);h.vy*=Math.exp(-1.6*dt);
    h.x=clamp(h.x+h.vx*dt,30,G.tutorial&&h.side===1?1500:WORLD-30);
    h.y+=h.vy*dt;
    if(h.y>GROUND-16){h.y=GROUND-16;h.vy=0;h.vx*=.6;}
    if(h.y<54){h.y=54;h.vy=Math.max(h.vy,0);}
    // Friendly captured pads trade slower service and a hull cap for forward access.
    const service=serviceAt(h);
    h.service=service?service.kind:null;h.rearming=!!service;
    if(service){
      const forward=service.kind==='forward';
      h.fuel=Math.min(100,h.fuel+(forward?5:12)*dt);
      if(h.fuel>=20)h.reserve=RESERVE_SECONDS;
      const limit=h.maxhp*(forward?FORWARD_HP:1);
      if(h.hp<limit)h.hp=Math.min(limit,h.hp+(forward?4:14)*dt);
      if(!forward){
        h.bombs=Math.min(8,h.bombs+2.5*dt);
        h.mis=Math.min(4,h.mis+1.2*dt);
        h.flares=Math.min(3,h.flares+dt);
      }
    }else if(h.side===1){
      h.fuel=Math.max(0,h.fuel-FUEL_BURN*(1+Math.abs(h.vx)/430)*dt);
      if(h.fuel<=0)h.reserve=Math.max(0,h.reserve-dt);
    }
    h.washTimer-=dt;
    if(h.y>GROUND-110&&enginePowered(h)&&h.washTimer<=0){
      h.washTimer=.065;emitGroundWash(h.x,1-(GROUND-h.y)/130);
    }
    // Damage smoke is emitted by simulation, so pause does not accumulate particles.
    if(h.hp<h.maxhp*.4&&Math.random()<dt*15)
      G.parts.push({x:h.x+rnd(-16,10),y:h.y+rnd(-6,6),vx:-h.vx*.15+rnd(-15,15),vy:rnd(-40,-10),
        life:rnd(.5,.9),c:'#555',s:rnd(3,6),g:-.15,wind:1});
    if(h.side===1&&!enginePowered(h)&&!h.rearming&&h.y>=GROUND-16){
      msg('FORCED LANDING — HELICOPTER LOST','#ffb84d');hurtHeli(h,h.maxhp);
      continue;
    }
    // balloon cables (only if balloon alive and cable intact)
    for(const b of G.bunkers){
      if(b.owner===h.side||b.balloonDead||b.cableBroken)continue;
      if(h.cableCd<=0&&Math.abs(h.x-b.x)<16&&h.y>BALLOON_Y-24&&h.y<GROUND-26){
        hurtHeli(h,65,{x:b.x,y:h.y});h.cableCd=1.2;
        h.vy=-240;h.vx=(h.x<b.x?-1:1)*300;
        SFX.cable();msg(h.side>0?'CABLE STRIKE!':'ENEMY HIT YOUR CABLE!',h.side>0?'#ff5548':'#4db2ff');
      }
    }
  }

  // cable proximity hazard alert for player
  const p=G.helis[0];
  let nearCable=false;
  if(p&&!p.dead){
    for(const b of G.bunkers){
      if(b.owner!==1&&!b.balloonDead&&!b.cableBroken){
        if(Math.abs(p.x-b.x)<160&&p.y>BALLOON_Y-30&&p.y<GROUND-25){
          nearCable=true;break;
        }
      }
    }
  }
  if(nearCable){
    G.cableWarning=Math.min(1,G.cableWarning+dt*3.5);
    if(Math.floor(G.anim*3)!==Math.floor((G.anim-dt)*3)){
      tone(880,660,.06,'sawtooth',.035);
    }
  }else{
    G.cableWarning=Math.max(0,G.cableWarning-dt*2.5);
  }

  // master caution audio alert when hull is critical
  if(p&&!p.dead&&(p.hp<p.maxhp*.25||p.fuel<LOW_FUEL)){
    G.cautionTimer=(G.cautionTimer||0)+dt;
    if(G.cautionTimer>=1.0){
      G.cautionTimer=0;
      SFX.caution();
    }
  }else{G.cautionTimer=0.8;}

  updateUnits(dt);
  updateProjectiles(dt);
  updateCapture(dt);
  updateTutorial();
  const threat=vanThreat();
  const level=threat?threat.level:0;
  if(level>G.vanAlertLevel)SFX.alarm();
  G.vanAlertLevel=level;

  // balloon respawns
  for(const b of G.bunkers){
    if(b.balloonDead){
      b.balloonRespawn-=dt;
      if(b.balloonRespawn<=0){
        b.balloonDead=false;b.cableBroken=false;b.balloonHp=b.balloonMax;b.cableHp=30;
      }
    }
  }
  // flares
  for(let i=G.flares.length-1;i>=0;i--){
    const f=G.flares[i];
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=90*dt;f.vx*=Math.exp(-1.2*dt);
    f.life-=dt;
    if(Math.random()<.4)G.parts.push({x:f.x,y:f.y,vx:rnd(-10,10),vy:rnd(-10,10),life:.3,c:'#ffd070',s:2,add:true});
    if(f.life<=0||f.y>GROUND-4)G.flares.splice(i,1);
  }
  // decals fade
  for(let i=G.decals.length-1;i>=0;i--){
    G.decals[i].life-=dt;
    if(G.decals[i].life<=0)G.decals.splice(i,1);
  }
  G.flash=Math.max(0,G.flash-dt*1.4);

  for(let i=G.wrecks.length-1;i>=0;i--){
    const w=G.wrecks[i];w.life-=dt;w.smokeT-=dt;
    if(w.life<=0){G.wrecks.splice(i,1);continue;}
    if(w.life>55&&w.smokeT<=0){
      w.smokeT=.18;
      G.parts.push({x:w.x+rnd(-10,10),y:GROUND-8,vx:rnd(-4,4),vy:-22,
        life:2,c:'#484741',s:3,g:-.02,grow:6,wind:1});
    }
  }
  // Keep cosmetic work bounded on phones, without changing projectile simulation.
  if(TOUCH.active&&G.parts.length>180)G.parts.splice(0,G.parts.length-180);
  // particles
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];p.life-=dt;
    p.x+=(p.vx+(p.wind||0)*windAt(G.time))*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*380*dt;
    if(p.grow)p.s+=p.grow*dt;
    if(p.life<=0)G.parts.splice(i,1);
  }
  // messages
  for(let i=G.msgs.length-1;i>=0;i--){
    G.msgs[i].age+=dt;
    if(G.msgs[i].age>3.2)G.msgs.splice(i,1);
  }
  for(const b of G.bunkers)b.capPulse=Math.max(0,b.capPulse-dt);

  // camera
  G.scanTimer=Math.max(0,G.scanTimer-dt);
  if(p&&G.scanTimer<=0){
    G.camX+=((p.x-W/2)-G.camX)*Math.min(1,3.2*dt);
    G.camX=clamp(G.camX,0,WORLD-W);
  }

  // win / lose
  for(const u of G.units){
    if(u.type!=='VAN')continue;
    if(u.side>0&&u.x>ENEMY_X-70)return endGame(true,'YOUR DEMO VAN REACHED ENEMY HQ!');
    if(u.side<0&&u.x<PLAYER_X+70)return endGame(false,'ENEMY DEMO VAN REACHED YOUR HQ!');
  }
  if(G.lives<=0&&G.helis[0].dead&&G.helis[0].respawn<=0)endGame(false,'ALL HELICOPTERS LOST');
}
function endGame(win,why){
  if(win){G.state='win';G.score+=500+SXP(G);}
  else{G.state='over';}
  SFX.boom(true);
  G.endMsg=why||'';
}
function SXP(g){return Math.max(0,600-Math.floor(g.time/2));}

// ---------- player heli
function updatePlayerHeli(h,dt){
  const power=enginePowered(h)?1:0;
  const A=430*power,LIFT=560*power;
  if(keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight)G.scanTimer=0;
  if(keys.ArrowLeft||keys.KeyA){h.vx-=A*dt;h.dir=-1;}
  if(keys.ArrowRight||keys.KeyD){h.vx+=A*dt;h.dir=1;}
  if(keys.ArrowUp||keys.KeyW)h.vy-=LIFT*dt;
  if(keys.ArrowDown||keys.KeyS)h.vy+=430*dt;
  if(TOUCH.active){
    h.vx+=A*TOUCH.x*dt;
    if(Math.abs(TOUCH.x)>.12)h.dir=TOUCH.x<0?-1:1;
    // Counter gravity and damp drift when the stick is released; no lift without fuel.
    if(Math.abs(TOUCH.y)<.08)h.vy*=Math.exp(-3*dt);
    h.vy+=(TOUCH.y*(TOUCH.y<0?LIFT:430)-60*power)*dt;
    if(Math.abs(TOUCH.x)>.08||Math.abs(TOUCH.y)>.08)G.scanTimer=0;
  }
  if((keys.Space||TOUCH.fire)&&h.cdGun<=0){
    h.cdGun=GUN_CD;
    fireBullet(h.x+h.dir*32,h.y+3,h.dir,1,7,60);
    SFX.gun();
  }
}

// ---------- enemy heli AI
function updateEnemyHeli(h,dt){
  const p=G.helis[0];
  h.aiT-=dt;
  let engage=false,tx,ty;
  if(!p.dead&&Math.abs(p.x-h.x)<1350){
    engage=true;
    tx=p.x+(h.x<p.x?-230:230);
    ty=p.y-90;
  }else{
    // patrol near own frontmost unit
    let fx=ENEMY_X-500;
    for(const u of G.units)if(u.side<0)fx=Math.min(fx,u.x);
    tx=clamp(fx-300,ENEMY_X-2800,ENEMY_X-260);
    ty=250+Math.sin(G.anim*.6+h.seed)*70;
  }
  // avoid hostile balloons (player-owned bunkers) — only live ones
  for(const b of G.bunkers){
    if(b.owner===1&&!b.balloonDead&&Math.abs(h.x-b.x)<260)ty=Math.min(ty,168);
  }
  const dx=tx-h.x,dy=ty-h.y;
  h.vx+=clamp(dx*.9,-380,380)*dt;
  h.vy+=clamp(dy*1.6,-330,330)*dt;
  if(p&&!p.dead)h.dir=p.x<h.x?-1:1;
  if(!engage)h.dir=h.vx<0?-1:1;

  if(engage&&!p.dead){
    const adx=p.x-h.x,ady=p.y-h.y;
    if(Math.abs(adx)<720&&Math.abs(ady)<170&&h.cdGun<=0){
      h.cdGun=.16;
      fireBullet(h.x+h.dir*32,h.y+3,h.dir,-1,6,90);
      if(onScreen(h.x))SFX.gun();
    }
    // bombs over player columns
    if(h.cdBomb<=0&&ady<-120&&Math.abs(adx)<60){
      h.cdBomb=2.6;
      G.bombs.push({x:h.x,y:h.y+12,vx:h.vx*.85,vy:40,side:-1});
    }
    if(h.cdMis<=0&&Math.random()<.5&&Math.abs(adx)>300){
      h.cdMis=rnd(6,9);
      G.missiles.push(mkMissile(h.x,h.y,p,-1));SFX.missile();
    }
  }
}

// ---------- ground units
function updateUnits(dt){
  const sorted=[...G.units].sort((a,b)=>a.x-b.x);
  for(const u of sorted){
    const st=UT[u.type];
    u.cd-=dt;u.phase+=dt;u.flash=Math.max(0,u.flash-dt);
    const dir=u.side;
    // targets
    const gt=nearestGroundTarget(u.x,GROUND,u.side,st.rng);
    const et=nearestAirTarget(u.x,GROUND-UT[u.type].h,u.side,st.rng+200);
    let moved=false;
    if(u.type==='AA'){
      if(et&&et.side!==u.side){
        if(Math.abs(et.x-u.x)<st.rng&&u.cd<=0){
          u.cd=st.cd;
          G.missiles.push(mkMissile(u.x,GROUND-20,et,u.side));
          if(onScreen(u.x))SFX.missile();
        }
      }else moved=true;
    }else if(u.type==='VAN'){
      moved=true;
    }else{
      if(gt&&Math.abs(gt.x-u.x)<st.rng){
        if(u.cd<=0){
          u.cd=st.cd;
          if(u.type==='TANK'){
            const d=Math.sign(gt.x-u.x)||dir;
            G.shells.push({x:u.x+dir*26,y:GROUND-22,vx:d*520,vy:-90,life:1.6,side:u.side,dmg:st.dmg});
            if(onScreen(u.x)){SFX.gun();noise(.15,900,.1);}
          }else{
            fireBullet(u.x+dir*8,GROUND-13,gt.x>u.x?1:-1,u.side,st.dmg,50);
            if(onScreen(u.x))SFX.gun();
          }
        }
      }else moved=true;
    }
    if(G.tutorial&&G.tutorial.step<3)moved=false;
    if(moved){
      // spacing vs friend ahead
      let blocked=false;
      for(const o of sorted){
        if(o===u||o.side!==u.side)continue;
        const gap=(o.x-u.x)*dir;
        const need=(UT[o.type].w+st.w)/2+14;
        if(gap>0&&gap<need){blocked=true;break;}
      }
      if(!blocked){
        u.x=clamp(u.x+dir*st.spd*dt,60,WORLD-60);
        if(u.type!=='INF'&&terrainAt(u.x)==='dirt'){
          u.dustT=(u.dustT||0)-dt;
          if(u.dustT<=0){u.dustT=.18;G.parts.push({x:u.x-dir*st.w/2,y:GROUND-3,
            vx:-dir*12,vy:-8,life:.7,c:'#8c7b64',s:2,g:0,grow:4,wind:.5});}
        }
      }
    }
    // van win check handled in main update
  }
}

// ---------- projectiles
function updateProjectiles(dt){
  // bullets
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let hit=false;
    for(const u of G.units){
      if(u.side===b.side)continue;
      if(Math.abs(b.x-u.x)<UT[u.type].w/2+3&&b.y>GROUND-UT[u.type].h-8&&b.y<GROUND+4){hurtUnit(u,b.dmg);hit=true;break;}
    }
    if(!hit)for(const h of G.helis){
      if(h.dead||h.side===b.side)continue;
      if(Math.abs(b.x-h.x)<26&&Math.abs(b.y-h.y)<12){hurtHeli(h,b.dmg,{x:b.x-b.vx*.15,y:b.y-b.vy*.15});hit=true;break;}
    }
    if(!hit)hit=hitBalloonOrCable(b.x,b.y,b.side,b.dmg);
    if(hit||b.life<=0)G.bullets.splice(i,1);
  }
  // tank shells
  for(let i=G.shells.length-1;i>=0;i--){
    const s=G.shells[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=140*dt;s.life-=dt;
    let hit=false;
    for(const u of G.units){
      if(u.side===s.side)continue;
      if(Math.abs(s.x-u.x)<UT[u.type].w/2+6&&s.y>GROUND-UT[u.type].h-10&&s.y<GROUND+6){hit=true;break;}
    }
    for(const h of G.helis){
      if(hit)break;
      if(h.dead||h.side===s.side)continue;
      if(Math.abs(s.x-h.x)<28&&Math.abs(s.y-h.y)<14){hit=true;}
    }
    if(!hit)hit=hitBalloonOrCable(s.x,s.y,s.side,s.dmg);
    if(hit||s.y>GROUND-4||s.life<=0){
      explode(s.x,Math.min(s.y,GROUND-6),46,s.dmg,s.side);
      G.shells.splice(i,1);
    }
  }
  // bombs
  for(let i=G.bombs.length-1;i>=0;i--){
    const b=G.bombs[i];
    const landed=stepBomb(b,dt);
    let hit=false;
    for(const u of G.units){
      if(u.side===b.side)continue;
      if(Math.abs(b.x-u.x)<UT[u.type].w/2+8&&b.y>GROUND-UT[u.type].h-12&&b.y<GROUND+6){hit=true;break;}
    }
    if(!hit)hit=hitBalloonOrCable(b.x,b.y,b.side,55);
    if(hit||landed){
      if(G.tutorial&&b.side===1)G.tutorial.bombed=true;
      explode(b.x,Math.min(b.y,GROUND-8),78,55,b.side);
      G.bombs.splice(i,1);
    }
  }
  // missiles
  for(let i=G.missiles.length-1;i>=0;i--){
    const m=G.missiles[i];
    m.life-=dt;m.trail-=dt;
    // flare decoys: missiles chasing a helicopter retarget to nearby flares
    if(m.target&&m.target.side!==undefined&&!G.units.includes(m.target)&&!m.target.dead){
      for(const f of G.flares){
        if(Math.hypot(f.x-m.target.x,f.y-m.target.y)<400){m.target=f;break;}
      }
    }
    const t=m.target;
    const gone=!t||(t.dead)||(!G.units.includes(t)&&!G.helis.includes(t)&&!G.flares.includes(t));
    if(gone)m.target=null;
    if(m.target){
      const dx=m.target.x-m.x,dy=(m.target.y||GROUND-10)-m.y;
      const d=Math.hypot(dx,dy)||1;
      const sp=Math.min(560,300+m.life*40);
      m.vx+= ((dx/d)*sp-m.vx)*Math.min(1,4.5*dt);
      m.vy+= ((dy/d)*sp-m.vy)*Math.min(1,4.5*dt);
      if(d<30){
        explode(m.x,m.y,58,48,m.side);
        if(G.units.includes(m.target))hurtUnit(m.target,20);
        else if(G.helis.includes(m.target))hurtHeli(m.target,20,{x:m.x,y:m.y});
        G.missiles.splice(i,1);continue;
      }
    }else m.vy+=200*dt;
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(hitBalloonOrCable(m.x,m.y,m.side,48)){
      explode(m.x,m.y,50,0,m.side);
      G.missiles.splice(i,1);continue;
    }
    if(m.trail<=0){
      m.trail=.03;
      G.parts.push({x:m.x,y:m.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.35,c:'#aab',s:2.5,g:0});
    }
    if(m.life<=0||m.y>GROUND-4){
      explode(m.x,Math.min(m.y,GROUND-8),50,40,m.side);
      G.missiles.splice(i,1);
    }
  }
}

// ---------- capture
function updateCapture(dt){
  for(const b of G.bunkers){
    const near=G.units.filter(u=>u.type==='INF'&&Math.abs(u.x-b.x)<70);
    for(const side of [1,-1]){
      if(b.owner===side)continue;
      const cnt=near.filter(u=>u.side===side).length;
      if(cnt>=CAPTURE_N){
        b.owner=side;b.capPulse=1.2;
        b.balloonDead=false;b.cableBroken=false;b.balloonHp=b.balloonMax;b.cableHp=30;b.balloonRespawn=0;
        let removed=0;
        for(let i=G.units.length-1;i>=0&&removed<3;i--){
          const u=G.units[i];
          if(u.type==='INF'&&u.side===side&&Math.abs(u.x-b.x)<70){G.units.splice(i,1);removed++;}
        }
        if(side>0){
          msg('BUNKER CAPTURED — FRIENDLY BALLOON','#4db2ff');
          G.score+=150;
          if(G.stats)G.stats.bunkersCap++;
        }else{
          msg('BUNKER LOST TO ENEMY','#ff5548');
        }
        SFX.cap();
      }
    }
  }
}

// ---------- enemy commander
function aiDecide(){
  if(G.tutorial)return;
  const mine=G.units.filter(u=>u.side<0);
  const n=t=>mine.filter(u=>u.type===t).length;
  if(n('INF')<3)buy(-1,'INF');
  else if(!n('AA')&&Math.random()<.85)buy(-1,'AA');
  else if(n('TANK')<1+Math.floor(G.time/140))buy(-1,'TANK');
  else if(n('INF')<7)buy(-1,'INF');
  if(G.time>difficulty().vanTime&&!n('VAN')&&G.eFunds>=UT.VAN.cost){
    const escorts=n('TANK')+n('AA');
    if(escorts>=2||Math.random()<.22){
      buy(-1,'VAN');
      G.bannerAlert={
        title:'⚠️ CRITICAL ALERT: ENEMY DEMO VAN INBOUND ⚠️',
        sub:'INTERCEPT BEFORE IT REACHES YOUR HOME BASE!',
        timer:8,level:'danger'
      };
      msg('⚠️ ENEMY VAN INBOUND — STOP IT!','#ff5548');
      SFX.alarm();
    }
  }
}

// ============================================================ RENDER
function onScreen(x){return x>G.camX-80&&x<G.camX+W+80;}

function render(){
  cx.save();
  if(G.shake>.3)cx.translate(rnd(-G.shake,G.shake),rnd(-G.shake,G.shake));
  drawSky();
  drawBackdrop();
  drawHills();
  drawGround();
  drawDecals();
  drawWrecks();
  drawBases();
  for(const b of G.bunkers)drawBunker(b);
  for(const u of G.units)drawUnit(u);
  for(const h of G.helis)if(!h.dead)drawHeli(h);
  drawProjectiles();
  drawBombPredictor();
  if(G.tutorial){
    const target=G.tutorial.step===0?500:G.tutorial.step===3?G.bunkers[0].x:null;
    if(target!==null){cx.strokeStyle='#9ad9be';cx.lineWidth=2;cx.beginPath();
      cx.moveTo(target-G.camX-12,GROUND-180);cx.lineTo(target-G.camX,GROUND-165);cx.lineTo(target-G.camX+12,GROUND-180);cx.stroke();}
  }
  drawParts();
  cx.restore();
  drawVignette();
  if(G.flash>0){
    cx.fillStyle='rgba(255,240,214,'+G.flash+')';
    cx.fillRect(0,0,W,H);
  }
  if(TOUCH.active&&TOUCH.render){G.buttons=[];TOUCH.render();}
  else{drawHUD();drawOverlays();}
  drawDamageEdges();
}

function drawDamageEdges(){
  if(G.state!=='play'||G.paused)return;
  cx.save();
  for(const [edge,time] of Object.entries(G.damageEdges))if(time>0){
    cx.fillStyle='rgba(255,110,65,'+(time/.65*.75)+')';
    if(edge==='left')cx.fillRect(0,H*.28,5,H*.44);
    if(edge==='right')cx.fillRect(W-5,H*.28,5,H*.44);
    if(edge==='top')cx.fillRect(W*.3,0,W*.4,5);
    if(edge==='bottom')cx.fillRect(W*.3,H-5,W*.4,5);
  }
  cx.restore();
}

function drawSky(){
  const g=cx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#0d1030');g.addColorStop(.55,'#33224e');
  g.addColorStop(.82,'#7e3b47');g.addColorStop(1,'#c96a45');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
  cx.fillStyle='#fff';
  for(let i=0;i<40;i++){
    const sx=hash(i)*W,sy=hash(i+99)*220;
    cx.globalAlpha=.12+.3*Math.abs(Math.sin(G.anim+i));
    cx.fillRect(sx,sy,2,2);
  }
  cx.globalAlpha=1;
}
function drawBackdrop(){
  const img=SPR.backdrop;
  if(!img.complete||!img.width)return;
  const bw=W*1.35,bh=bw*img.height/img.width;
  const yOff=GROUND-bh+26,par=.12;
  const k0=Math.floor(G.camX*par/bw);
  for(let k=k0;k<=k0+2;k++){
    const x=k*bw-G.camX*par;
    if(x>W||x+bw<0)continue;
    const mir=k%2===1;
    cx.save();
    cx.translate(x+(mir?bw:0),yOff);
    cx.scale(mir?-1:1,1);
    cx.drawImage(img,0,0,bw,bh);
    cx.restore();
  }
  // atmospheric blend: night sky above, haze at horizon
  const g=cx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,'rgba(13,16,48,.88)');g.addColorStop(.45,'rgba(40,28,66,.35)');
  g.addColorStop(1,'rgba(126,59,71,0)');
  cx.fillStyle=g;cx.fillRect(0,0,W,GROUND);
}
function drawHills(){
  hillLayer(G.camX*.3,486,60,700,'rgba(22,18,40,.85)');
}
function hillLayer(off,base,amp,step,col){
  cx.fillStyle=col;
  cx.beginPath();cx.moveTo(0,H);
  for(let sx=0;sx<=W;sx+=16){
    const wx=(sx+off);
    const y=base-amp*(.6*Math.sin(wx/step)+.4*Math.sin(wx/(step*.37)+2));
    cx.lineTo(sx,y);
  }
  cx.lineTo(W,H);cx.closePath();cx.fill();
}
function drawGround(){
  const g=cx.createLinearGradient(0,GROUND,0,H);
  g.addColorStop(0,'#4d4030');g.addColorStop(.14,'#332a1e');g.addColorStop(1,'#14100c');
  cx.fillStyle=g;cx.fillRect(0,GROUND,W,H-GROUND);
  cx.fillStyle='#6b5a40';cx.fillRect(0,GROUND,W,3);
  // dirt road with wheel ruts
  cx.fillStyle='rgba(90,74,52,.55)';cx.fillRect(0,GROUND+10,W,26);
  cx.fillStyle='rgba(40,32,22,.5)';
  cx.fillRect(0,GROUND+16,W,3);cx.fillRect(0,GROUND+27,W,3);
  for(let wx=Math.floor(G.camX/320)*320;wx<G.camX+W;wx+=320){
    if(terrainAt(wx)==='grass'){
      cx.fillStyle='rgba(75,87,43,.5)';cx.fillRect(wx-G.camX,GROUND,320,10);
      cx.fillStyle='rgba(52,65,31,.2)';cx.fillRect(wx-G.camX,GROUND+37,320,12);
    }
  }
  // texture: stones / tufts (world anchored)
  const start=Math.floor(G.camX/48)*48;
  for(let wx=start;wx<G.camX+W+48;wx+=48){
    const h1=hash(wx),h2=hash(wx*1.7);
    cx.fillStyle=h2>.5?'rgba(20,16,11,.7)':'rgba(120,100,70,.35)';
    cx.fillRect(wx-G.camX,GROUND+44+h1*48,20+h1*26,3);
    if(terrainAt(wx)==='grass'){ // grass responds to wind and nearby rotor wash
      cx.strokeStyle='rgba(74,84,48,.8)';cx.lineWidth=1.5;
      const tx=wx-G.camX+20,ty=GROUND+6;
      let bend=Math.sin(G.time*2+wx*.1)*windAt(G.time)*.07;
      for(const h of G.helis)if(!h.dead&&h.fuel>0&&h.y>GROUND-110&&Math.abs(h.x-wx)<100)
        bend+=Math.sign(wx-h.x)*(1-Math.abs(wx-h.x)/100)*9;
      cx.beginPath();
      cx.moveTo(tx,ty);cx.lineTo(tx-3+bend,ty-7);
      cx.moveTo(tx,ty);cx.lineTo(tx+1+bend,ty-9);
      cx.moveTo(tx,ty);cx.lineTo(tx+4+bend,ty-6);
      cx.stroke();
    }
  }
}
function drawBase(side){
  const bx=(side>0?PLAYER_X:ENEMY_X)-G.camX;
  if(bx<-320||bx>W+320)return;
  const col=side>0?'#4db2ff':'#ff5548';
  drawSprite('hq',side,bx,GROUND-6,300,false,0,true);
  // landing pad
  const px0=bx+62;
  const g=cx.createLinearGradient(0,GROUND-8,0,GROUND);
  g.addColorStop(0,'#3a3f55');g.addColorStop(1,'#22263a');
  cx.fillStyle=g;cx.fillRect(px0,GROUND-8,150,8);
  cx.strokeStyle=col;cx.lineWidth=3;
  cx.strokeRect(px0+30,GROUND-36,90,26);
  cx.font='bold 20px monospace';cx.fillStyle=col;cx.textAlign='center';
  cx.fillText('H',px0+75,GROUND-17);
  // team flag on HQ
  drawFlag(bx-120,GROUND-40,side);
  // beacon
  cx.fillStyle=Math.sin(G.anim*4)>0?col:'#331';
  cx.beginPath();cx.arc(bx+130,GROUND-6-300*335/600-8,4,0,7);cx.fill();
}
function drawDecals(){
  for(const d of G.decals){
    const x=d.x-G.camX;
    if(x<-160||x>W+160)continue;
    cx.fillStyle='rgba(8,6,4,'+Math.min(.5,d.life/14*.5)+')';
    cx.beginPath();cx.ellipse(x,d.y,d.r,d.r*.2,0,0,7);cx.fill();
  }
}
function drawWrecks(){
  cx.save();
  for(const w of G.wrecks){
    const x=w.x-G.camX;if(x<-80||x>W+80)continue;
    cx.globalAlpha=Math.min(.75,w.life/10);cx.filter='grayscale(1) brightness(.35)';
    drawSprite(UNIT_SPR[w.type],w.side,x,GROUND+3,UT[w.type].w,w.side!==SPR_CFG[UNIT_SPR[w.type]].face,-.1,true);
  }
  cx.restore();
}
function drawBombPredictor(){
  const p=G.helis[0];
  if(!G.bombAiming||G.state!=='play'||G.paused||p.dead)return;
  const b=bombFromHeli(p),t=bombGroundTime(b),impact=bombPosition(b,t);
  const ready=p.cdBomb<=0&&p.bombs>=1;
  cx.save();cx.strokeStyle=ready?'rgba(255,217,122,.65)':'rgba(160,170,180,.45)';cx.lineWidth=1;
  cx.setLineDash([3,7]);cx.beginPath();cx.moveTo(b.x-G.camX,b.y);
  for(let i=1;i<=24;i++){const pt=bombPosition(b,t*i/24);cx.lineTo(pt.x-G.camX,pt.y);}
  cx.stroke();cx.setLineDash([]);
  const x=impact.x-G.camX,y=GROUND-6;
  cx.beginPath();cx.ellipse(x,y,22,6,0,0,Math.PI*2);cx.stroke();
  cx.beginPath();cx.moveTo(x-30,y);cx.lineTo(x+30,y);cx.moveTo(x,y-10);cx.lineTo(x,y+5);cx.stroke();
  // Mobile timing lives on the BOMB control; keep the flight view clear.
  if(TOUCH.active){cx.restore();return;}
  // Keep the instruction above the ground HUD and within the viewport.
  const lx=clamp(x,180,W-180),ly=clamp(p.y-58,160,H-185);
  cx.fillStyle='rgba(9,14,24,.9)';cx.fillRect(lx-150,ly-15,300,36);
  cx.font='bold 11px monospace';cx.textAlign='center';cx.fillStyle=ready?'#ffd97a':'#a0aaba';
  cx.fillText(ready?(TOUCH.active?'RELEASE BOMB TO DROP':'RELEASE B TO DROP • ESC CANCEL'):'BOMB RACK RELOADING',lx,ly);
  cx.font='9px monospace';cx.fillStyle='#93a9bc';
  cx.fillText('GROUND ESTIMATE • '+t.toFixed(1)+'s • OBSTACLES MAY INTERCEPT',lx,ly+14);
  cx.restore();
}
function drawBases(){drawBase(1);drawBase(-1);}

function drawFlag(x,topY,owner){
  const col=owner===1?'#4db2ff':owner===-1?'#ff5548':'#888';
  cx.strokeStyle='#aaa';cx.lineWidth=2;
  cx.beginPath();cx.moveTo(x,topY);cx.lineTo(x,topY-34);cx.stroke();
  cx.fillStyle=col;
  const wav=Math.sin(G.time*5)*windAt(G.time)*.15;
  cx.beginPath();
  cx.moveTo(x,topY-34);cx.lineTo(x+18,topY-29+wav);cx.lineTo(x,topY-23);
  cx.closePath();cx.fill();
}
function drawBunker(b){
  const x=b.x-G.camX;
  if(x<-180||x>W+180)return;

  const topDomeY = GROUND - 41;
  if(b.owner===1){
    const px=forwardPadX(b)-G.camX,p=G.helis[0];
    const active=!p.dead&&p.service==='forward'&&Math.abs(p.x-forwardPadX(b))<65;
    cx.save();cx.fillStyle='#303b38';cx.fillRect(px-48,GROUND-5,96,5);
    cx.strokeStyle=active?'#9affb9':'#6da992';cx.lineWidth=2;
    cx.beginPath();cx.ellipse(px,GROUND-7,40,9,0,0,Math.PI*2);cx.stroke();
    cx.font='bold 13px monospace';cx.textAlign='center';cx.fillStyle='#a9d6c0';
    cx.fillText('H',px,GROUND-10);
    if(!active){
      cx.font='bold 9px monospace';cx.fillText('FORWARD BASE • HOVER LOW',px,GROUND-46);
      cx.font='9px monospace';cx.fillStyle='#8aab9b';cx.fillText('FUEL + REPAIR / NO AMMO',px,GROUND-33);
    }
    for(const d of [-1,1]){cx.fillStyle=active?'#9affb9':'#547f6a';cx.fillRect(px+d*44-2,GROUND-10,4,4);}
    cx.restore();
  }

  // Cables: telegraphing & hazard styling
  if(b.balloonDead){
    // frayed stub where the cable snapped
    cx.strokeStyle='rgba(120,120,140,.6)';cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(x,topDomeY);cx.lineTo(x+6,GROUND-25);cx.stroke();
  }else if(b.cableBroken){
    // severed cable dangling with sparks
    const by=balloonY(b);
    const sway=Math.sin(G.anim*3.5+b.x)*10;
    cx.strokeStyle='rgba(255,90,70,.85)';cx.lineWidth=1.6;
    cx.beginPath();cx.moveTo(x,by+26);cx.lineTo(x+sway,by+90);cx.stroke();
    cx.beginPath();cx.moveTo(x,topDomeY);cx.lineTo(x-sway*.4,GROUND-70);cx.stroke();
    if(cableIsUrgent(b)&&!G.paused&&Math.random()<.1){
      G.parts.push({x:b.x+sway,y:by+90,vx:rnd(-15,15),vy:rnd(10,35),life:.2,c:'#ffe9a0',s:1.5,add:true});
    }
  }else{
    const by=balloonY(b);
    const isEnemy=b.owner!==1;
    const urgent=cableIsUrgent(b);
    // Core tension wire
    cx.strokeStyle=isEnemy?'#f0f4fc':'#80c5ff';
    cx.lineWidth=1.8;
    cx.beginPath();cx.moveTo(x,by+26);cx.lineTo(x,topDomeY);cx.stroke();

    // Blinking hazard strobe nodes along the cable
    const cableH=topDomeY-(by+26);
    const numNodes=Math.floor(cableH/44);
    for(let n=1;n<=numNodes;n++){
      const ny=(by+26)+n*44;
      const blink=Math.sin(G.anim*7+n+b.x)>0;
      cx.fillStyle=isEnemy?(urgent?(blink?'#ff3322':'#881c14'):'#bf8277'):'#508fbb';
      cx.fillRect(x-2.5,ny-2,5,4);
    }
  }

  // dome
  drawSprite('bunker',b.owner,x,GROUND,110,false,0,true);
  if(b.capPulse>0){
    cx.strokeStyle='rgba(255,255,255,'+b.capPulse+')';cx.lineWidth=3;
    cx.beginPath();cx.arc(x,GROUND-4,58+(1.2-b.capPulse)*40,Math.PI,0);cx.stroke();
  }

  // balloon (or respawn hint)
  if(b.balloonDead){
    if(G.tutorial)return;
    cx.font='bold 9px monospace';cx.fillStyle='rgba(255,180,120,.9)';cx.textAlign='center';
    cx.fillText('BALLOON RESPAWN: '+Math.ceil(b.balloonRespawn)+'s',x,GROUND-58);
  }else{
    const by=balloonY(b);
    drawSprite('balloon',b.owner,x,by,120,false,0,false);
    // blinking light
    cx.save();cx.globalCompositeOperation='lighter';
    cx.fillStyle=Math.sin(G.anim*6+b.x)>0?'rgba(255,224,138,.9)':'rgba(80,70,30,.4)';
    cx.beginPath();cx.arc(x,by-38,2.5,0,7);cx.fill();
    cx.restore();
  }
  drawFlag(x-62,GROUND,b.owner);

  // Capture status pill
  if(b.owner!==1){
    const cnt=G.units.filter(u=>u.type==='INF'&&u.side===1&&Math.abs(u.x-b.x)<70).length;
    if(cnt>0){
      cx.save();
      const pw=54,ph=18,px=x-pw/2,py=GROUND-64;
      cx.fillStyle='rgba(6,10,24,.85)';cx.fillRect(px,py,pw,ph);
      cx.strokeStyle=cnt>=2?'#8dff8d':'#4db2ff';cx.lineWidth=1.2;cx.strokeRect(px,py,pw,ph);
      cx.font='bold 10px monospace';cx.fillStyle=cnt>=2?'#8dff8d':'#9fd0ff';cx.textAlign='center';
      cx.fillText('👤 '+cnt+'/'+CAPTURE_N,x,py+13);
      cx.restore();
    }
  }
}

function drawUnit(u){
  const x=u.x-G.camX;
  if(x<-140||x>W+140)return;
  const st=UT[u.type],name=UNIT_SPR[u.type],cfg=SPR_CFG[name];
  // contact shadow
  cx.fillStyle='rgba(0,0,0,.4)';
  cx.beginPath();cx.ellipse(x,GROUND-2,st.w*.5,5,0,0,7);cx.fill();
  const bob=u.type==='INF'?Math.abs(Math.sin(u.phase*9))*2:0;
  const rot=u.type==='INF'?Math.sin(u.phase*9)*.06:0;
  if(u.flash>0){cx.save();cx.filter='brightness(2.4)';}
  drawSprite(name,u.side,x,GROUND-bob,st.w,u.side!==cfg.face,rot,true);
  if(u.flash>0)cx.restore();
  // muzzle glow when firing
  if(u.flash>0&&u.type!=='VAN'){
    cx.save();cx.globalCompositeOperation='lighter';
    const gx=x+u.side*st.w*.55,gy=u.type==='TANK'?GROUND-24:GROUND-14;
    const gr=cx.createRadialGradient(gx,gy,1,gx,gy,u.type==='TANK'?26:14);
    gr.addColorStop(0,'rgba(255,220,140,.9)');gr.addColorStop(1,'rgba(255,140,40,0)');
    cx.fillStyle=gr;cx.fillRect(gx-30,gy-30,60,60);
    cx.restore();
  }
  // hp pip
  if(u.hp<u.maxhp){
    cx.fillStyle='#000a';cx.fillRect(x-12,GROUND-UT[u.type].h-16,24,3);
    cx.fillStyle=u.side===1?'#4db2ff':'#ff5548';
    cx.fillRect(x-12,GROUND-UT[u.type].h-16,24*(u.hp/u.maxhp),3);
  }
}

function drawHeli(h){
  const x=h.x-G.camX;
  if(x<-170||x>W+170)return;
  // soft ground shadow, shrinks with altitude
  const alt=GROUND-h.y;
  const sa=clamp(.4-alt/1100,.05,.4);
  const shadow=cx.createRadialGradient(x,GROUND-2,1,x,GROUND-2,66);
  shadow.addColorStop(0,'rgba(0,0,0,'+sa+')');shadow.addColorStop(1,'rgba(0,0,0,0)');
  cx.fillStyle=shadow;
  cx.beginPath();
  cx.ellipse(x,GROUND-2,66*clamp(1-alt/1600,.35,1),6,0,0,7);
  cx.fill();
  const tilt=clamp(h.vx*.0005,-.22,.22);
  drawSprite('heli',h.side,x,h.y,130,h.dir!==-1,tilt,false);
  // animated main rotor: sweeping blade + blur disc at the mast
  const flip=h.dir!==-1;
  const mx=x+(flip?9:-9),my=h.y-13;
  const ra=G.anim*26+h.seed*7;
  const sw=Math.cos(ra)*60,th=Math.sin(ra)*7;
  cx.save();
  cx.strokeStyle='rgba(228,235,246,.8)';cx.lineWidth=2.5;
  cx.beginPath();cx.moveTo(mx-sw,my-th);cx.lineTo(mx+sw,my+th);cx.stroke();
  cx.globalAlpha=.25;cx.lineWidth=5;
  cx.beginPath();cx.ellipse(mx,my,62,7,0,0,7);cx.stroke();
  cx.restore();
  // tail rotor
  const tx=x-h.dir*56,ty=h.y-6;
  const ta=G.anim*34+h.seed*3;
  cx.save();cx.strokeStyle='rgba(228,235,246,.6)';cx.lineWidth=2;
  cx.beginPath();
  cx.moveTo(tx,ty-Math.cos(ta)*9);cx.lineTo(tx+Math.sin(ta)*3,ty+Math.cos(ta)*9);
  cx.stroke();cx.restore();
  // cargo / rearm labels
  cx.textAlign='center';
  if(h.cargo>0&&!TOUCH.active){
    cx.fillStyle='#ffd97a';cx.font='bold 10px monospace';
    cx.fillText('▲'+h.cargo,x,h.y-44);
  }
  if(h.rearming&&!TOUCH.active){
    cx.fillStyle='#8dff8d';cx.font='bold 9px monospace';
    cx.fillText(h.service==='forward'?'FORWARD SERVICE':'HQ SERVICE',x,h.y-56);
  }
  // hp bar
  if(h.hp<h.maxhp){
    cx.fillStyle='#000a';cx.fillRect(x-24,h.y-38,48,4);
    cx.fillStyle=h.side===1?'#4db2ff':'#ff5548';
    cx.fillRect(x-24,h.y-38,48*(h.hp/h.maxhp),4);
  }
  // Navigation lamps and momentary muzzle illumination stay attached to the airframe.
  cx.save();
  cx.fillStyle=h.side===1?'#83ffbd':'#ff7364';
  cx.shadowColor=cx.fillStyle;cx.shadowBlur=7;
  cx.beginPath();cx.arc(x-h.dir*42,h.y+3,1.6,0,Math.PI*2);cx.fill();
  if(Math.sin(G.anim*5+h.seed)> .94){
    cx.fillStyle='#fff';cx.fillRect(mx-2,my-4,4,2);
  }
  if(h.cdGun>(h.side===1?GUN_CD:.16)-.035){
    const fx=x+h.dir*40,fy=h.y+3;
    const glow=cx.createRadialGradient(fx,fy,0,fx,fy,23);
    glow.addColorStop(0,'rgba(255,230,160,.6)');glow.addColorStop(1,'rgba(255,160,50,0)');
    cx.fillStyle=glow;cx.fillRect(fx-23,fy-23,46,46);
  }
  cx.restore();
  if(h.side===1&&!h.dead){
    const rx=x+h.dir*125,ry=h.y+3;
    const ready=1-clamp(h.cdGun/GUN_CD,0,1);
    cx.save();cx.strokeStyle='rgba(190,225,230,.55)';cx.lineWidth=1;
    cx.beginPath();cx.moveTo(rx-4,ry);cx.lineTo(rx+4,ry);
    cx.moveTo(rx,ry-3);cx.lineTo(rx,ry+3);cx.stroke();
    for(let i=0;i<4;i++){
      cx.fillStyle=i<Math.ceil(ready*4)?'rgba(130,221,211,.65)':'rgba(255,184,77,.25)';
      cx.fillRect(rx-8+i*5,ry+10,3,2);
    }
    const target=nearestAirTarget(h.x,h.y,1,1600)||nearestGroundTarget(h.x,h.y,1,1600);
    if(target&&h.mis>=1){
      const tx=target.x-G.camX,ty=target.y??GROUND-UT[target.type].h/2;
      cx.strokeStyle=h.cdMis<=0?'rgba(255,199,100,.8)':'rgba(255,199,100,.3)';
      cx.beginPath();
      for(const d of [-1,1]){
        cx.moveTo(tx+d*22,ty-8);cx.lineTo(tx+d*22,ty-16);cx.lineTo(tx+d*14,ty-16);
        cx.moveTo(tx+d*22,ty+8);cx.lineTo(tx+d*22,ty+16);cx.lineTo(tx+d*14,ty+16);
      }
      cx.stroke();cx.font='9px monospace';cx.fillStyle='#ffd190';cx.textAlign='center';
      if(!TOUCH.active)cx.fillText(h.cdMis<=0?'M • LOCK':'RELOADING',tx,ty-23);
    }
    if(h.y>=GROUND-130&&!TOUCH.active){
      const count=G.units.filter(u=>u.type==='INF'&&u.side===1&&Math.abs(u.x-h.x)<115).length;
      if(h.cargo||count){
        cx.font='bold 10px monospace';cx.textAlign='center';cx.fillStyle='#c6e8db';
        cx.fillText(h.cargo?'E • DROP '+h.cargo+' TROOPS':'E • PICK UP '+Math.min(4,count),x,h.y+39);
      }
    }
    cx.restore();
  }
}

function drawProjectiles(){
  cx.save();
  for(const b of G.bullets){
    const x=b.x-G.camX;
    cx.globalCompositeOperation='lighter';
    cx.fillStyle='rgba(255,170,60,.35)';cx.fillRect(x-7,b.y-2.5,14,5);
    cx.fillStyle='#fff6d0';cx.fillRect(x-4,b.y-1,9,2);
  }
  cx.globalCompositeOperation='lighter';
  for(const s of G.shells){
    const x=s.x-G.camX;
    cx.fillStyle='rgba(255,150,50,.3)';
    cx.beginPath();cx.arc(x,s.y,7,0,7);cx.fill();
    cx.fillStyle='#ffe9a0';
    cx.beginPath();cx.arc(x,s.y,3,0,7);cx.fill();
  }
  cx.globalCompositeOperation='source-over';
  for(const b of G.bombs){
    const x=b.x-G.camX;
    cx.fillStyle='#262a33';
    cx.beginPath();cx.ellipse(x,b.y,6,3.4,0,0,7);cx.fill();
    cx.fillStyle='#7d838f';cx.fillRect(x-1,b.y-6,2,4);
  }
  for(const m of G.missiles){
    const x=m.x-G.camX;
    const a=Math.atan2(m.vy,m.vx);
    cx.save();cx.translate(x,m.y);cx.rotate(a);
    cx.fillStyle='#e8ecf5';cx.fillRect(-8,-2,15,4);
    cx.fillStyle='#c23';cx.fillRect(-10,-2,3,4);
    cx.restore();
    // exhaust flame
    cx.globalCompositeOperation='lighter';
    const fx=x-Math.cos(a)*10,fy=y0(m)-Math.sin(a)*10;
    const gr=cx.createRadialGradient(fx,fy,1,fx,fy,12);
    gr.addColorStop(0,'rgba(255,230,160,.95)');gr.addColorStop(1,'rgba(255,110,30,0)');
    cx.fillStyle=gr;cx.fillRect(fx-14,fy-14,28,28);
    cx.globalCompositeOperation='source-over';
  }
  cx.restore();
}
function y0(m){return m.y;}
function drawParts(){
  cx.save();
  for(const p of G.parts){
    const x=p.x-G.camX;
    if(p.ring){
      cx.globalCompositeOperation='lighter';
      cx.globalAlpha=clamp(p.life*2.4,0,1)*.8;
      cx.strokeStyle=p.c;cx.lineWidth=2.5;
      cx.beginPath();cx.arc(x,p.y,p.r,0,7);cx.stroke();
      continue;
    }
    cx.globalCompositeOperation=p.add?'lighter':'source-over';
    cx.globalAlpha=clamp(p.life*2,0,1)*(p.add?.95:.55);
    cx.fillStyle=p.c;
    if(p.streak){
      cx.strokeStyle=p.c;cx.lineWidth=2;
      cx.beginPath();cx.moveTo(x,p.y);cx.lineTo(x-p.vx*.03,p.y-p.vy*.03);cx.stroke();
      continue;
    }
    const s=p.add?p.s*1.4:p.s;
    cx.beginPath();cx.arc(x,p.y,s,0,7);cx.fill();
  }
  cx.restore();
  cx.globalAlpha=1;
}
function drawVignette(){
  const g=cx.createRadialGradient(W/2,H/2,H*.5,W/2,H/2,H*1.08);

  cx.fillStyle=g;cx.fillRect(0,0,W,H);
}

// ---------- THREAT INDICATOR HELPER
function drawThreatIndicator(x,y,onRight,label,color){
  cx.save();
  const blink=Math.sin(G.anim*8)>0;
  cx.fillStyle=color;cx.strokeStyle='#fff';cx.lineWidth=1;
  const dir=onRight?-1:1;
  cx.beginPath();
  cx.moveTo(x+dir*12,y);cx.lineTo(x-dir*4,y-8);cx.lineTo(x-dir*4,y+8);cx.closePath();
  cx.fill();if(blink)cx.stroke();

  cx.font='bold 10px monospace';
  cx.fillStyle='rgba(10,14,24,.85)';
  const tw=cx.measureText(label).width;
  const lx=onRight?x-tw-18:x+18;
  cx.fillRect(lx-4,y-9,tw+8,18);
  cx.strokeStyle=color;cx.strokeRect(lx-4,y-9,tw+8,18);
  cx.fillStyle=blink?'#fff':color;cx.textAlign='left';
  cx.fillText(label,lx,y+4);
  cx.restore();
}
