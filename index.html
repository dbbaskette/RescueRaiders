      cx.fillStyle=blink?'#8dff8d':'#4db2ff';
      cx.font='bold 11px monospace';cx.textAlign='left';
      cx.fillText(p.service==='forward'?'FORWARD: FUEL / HULL TO 75%':'HQ SERVICE: FUEL / HULL / AMMO',ox+10,oy+16);
    }else{
      cx.fillStyle='#8ba3cb';cx.font='bold 11px monospace';cx.textAlign='left';
      cx.fillText('ORDNANCE & COUNTERMEASURES',ox+10,oy+16);
    }

    drawKeycap('SPACE',ox+10,oy+24,54,16,keys.Space);
    cx.font='11px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='left';
    cx.fillText('30mm GUN',ox+70,oy+36);
    cx.font='bold 11px monospace';
    cx.fillStyle=p.cdGun<=0?'#8dff8d':'#ffb84d';
    cx.fillText(p.cdGun<=0?'READY':'COOLING',ox+150,oy+36);

    drawKeycap('B',ox+10,oy+43,24,16,keys.KeyB);
    cx.font='11px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='left';
    cx.fillText('HOLD B',ox+40,oy+55);
    for(let b=0;b<8;b++){
      const bx=ox+90+b*14,by=oy+52;
      const has=b<Math.floor(p.bombs);
      cx.fillStyle=has?'#ffd97a':'#2a354c';
      cx.beginPath();cx.arc(bx,by,has?4:3,0,7);cx.fill();
    }
    cx.font='bold 11px monospace';cx.fillStyle=p.bombs>0?'#ffd97a':'#ff5548';cx.textAlign='right';
    cx.fillText(Math.floor(p.bombs)+'/8',ox+ow-10,oy+56);

    drawKeycap('M',ox+10,oy+62,24,16,keys.KeyM);
    cx.font='11px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='left';
    cx.fillText('MISSILE',ox+40,oy+74);
    for(let m=0;m<4;m++){
      const mx=ox+92+m*18,my=oy+71;
      const has=m<Math.floor(p.mis);
      cx.fillStyle=has?'#ff5548':'#2a354c';
      cx.beginPath();cx.moveTo(mx,my-5);cx.lineTo(mx+4,my+4);cx.lineTo(mx-4,my+4);cx.closePath();cx.fill();
    }
    cx.font='bold 11px monospace';cx.fillStyle=p.mis>0?'#ff7766':'#ff5548';cx.textAlign='right';
    cx.fillText(Math.floor(p.mis)+'/4',ox+ow-10,oy+75);

    drawKeycap('C',ox+10,oy+81,24,16,keys.KeyC);
    cx.font='11px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='left';
    cx.fillText('FLARES',ox+40,oy+93);
    for(let f=0;f<3;f++){
      const fx=ox+94+f*20,fy=oy+90;
      const has=f<Math.floor(p.flares);
      cx.fillStyle=has?'#4db2ff':'#2a354c';
      cx.fillRect(fx-4,fy-4,8,8);
    }
    cx.font='bold 11px monospace';cx.fillStyle=p.flares>0?'#4db2ff':'#ff5548';cx.textAlign='right';
    cx.fillText(Math.floor(p.flares)+'/3',ox+ow-10,oy+94);
    cx.restore();
  }

  // 3. BOTTOM-CENTER UNIT REINFORCEMENT DOCK
  {
    const dockX=328,dockY=H-76,dockW=620,dockH=64;
    cx.save();
    const g=cx.createLinearGradient(dockX,dockY,dockX,dockY+dockH);
    g.addColorStop(0,'rgba(9,14,28,.92)');g.addColorStop(1,'rgba(14,22,42,.92)');
    cx.fillStyle=g;cx.fillRect(dockX,dockY,dockW,dockH);
    cx.strokeStyle='rgba(77,178,255,.35)';cx.lineWidth=1.5;
    cx.strokeRect(dockX,dockY,dockW,dockH);

    cx.font='bold 10px monospace';cx.fillStyle='#8ba3cb';cx.textAlign='left';
    cx.fillText('TACTICAL REINFORCEMENT DOCK (PRESS 1-5 OR CLICK TO DEPLOY)',dockX+12,dockY-6);

    const cards=[
      {key:'1',type:'INF',name:'INFANTRY',cost:20,sub:'Bunker Cap'},
      {key:'2',type:'TANK',name:'BATTLE TANK',cost:120,sub:'Heavy Shells'},
      {key:'3',type:'AA',name:'AA TRUCK',cost:160,sub:'Anti-Air'},
      {key:'4',type:'VAN',name:'DEMO VAN',cost:250,sub:'Win Objective'},
      {key:'5',type:'ENG',name:'ENGINEER',cost:40,sub:'Repair / Capture'},
    ];
    const cardW=116,cardH=50,cardGap=7;
    cards.forEach((c,i)=>{
      const cx0=dockX+7+i*(cardW+cardGap),cy0=dockY+7;
      const isVan=c.type==='VAN';
      const vanActive=isVan&&G.units.some(u=>u.side===1&&u.type==='VAN');
      const canAfford=G.funds>=c.cost&&!vanActive;
      const hover=regBtn('buy_'+c.type,cx0,cy0,cardW,cardH,()=>buy(1,c.type));

      cx.fillStyle=hover&&canAfford?'#1a2a46':hover?'#22181c':vanActive?'#211e14':canAfford?'#101726':'#0e111a';
      cx.fillRect(cx0,cy0,cardW,cardH);
      cx.strokeStyle=hover&&canAfford?'#4db2ff':vanActive?'#ffb84d':canAfford?'#2e4162':'#222a3a';
      cx.lineWidth=hover?2:1;
      cx.strokeRect(cx0,cy0,cardW,cardH);

      drawKeycap(c.key,cx0+6,cy0+6,20,18,hover);

      // Stylized unit silhouette badge
      const iconBoxX=cx0+5,iconBoxY=cy0+26,iconBoxW=36,iconBoxH=20;
      cx.fillStyle=canAfford?'rgba(77,178,255,0.14)':'rgba(255,255,255,0.04)';
      cx.fillRect(iconBoxX,iconBoxY,iconBoxW,iconBoxH);
      cx.strokeStyle=canAfford?'rgba(77,178,255,0.4)':'rgba(255,255,255,0.1)';
      cx.strokeRect(iconBoxX,iconBoxY,iconBoxW,iconBoxH);
      const icCol=vanActive?'#ffb84d':canAfford?'#8dff8d':'#63708a';
      cx.fillStyle=icCol;cx.strokeStyle=icCol;cx.lineWidth=1.2;
      const midX=iconBoxX+iconBoxW/2,midY=iconBoxY+iconBoxH/2;
      cx.save();cx.translate(midX,midY);cx.scale(1.4,1.15);cx.translate(-midX,-midY);
      if(c.type==='INF'||c.type==='ENG'){
        cx.beginPath();cx.arc(midX,midY-4,2.5,0,Math.PI*2);cx.fill();
        cx.fillRect(midX-3,midY-1,6,6);
        cx.fillRect(midX-3.5,midY+5,2.5,4);
        cx.fillRect(midX+1,midY+5,2.5,4);
        cx.fillRect(midX+2,midY-3,4.5,2);
        if(c.type==='ENG'){cx.fillStyle='#ffe09a';cx.fillRect(midX-4,midY-7,8,2);}
      }else if(c.type==='TANK'){
        cx.fillRect(midX-7,midY+2,14,4);
        cx.fillRect(midX-5,midY-2,10,4);
        cx.fillRect(midX-2,midY-4,5,3);
        cx.fillRect(midX+1,midY-3,7,2);
      }else if(c.type==='AA'){
        cx.fillRect(midX-7,midY+2,14,4);
        cx.fillRect(midX-4,midY-1,7,3);
        cx.beginPath();
        cx.moveTo(midX,midY);cx.lineTo(midX+6,midY-6);
        cx.moveTo(midX-2,midY);cx.lineTo(midX+4,midY-6);
        cx.stroke();
      }else if(c.type==='VAN'){
        cx.fillRect(midX-7,midY-2,14,7);
        cx.fillRect(midX-6,midY-5,8,3);
        cx.fillStyle='#101726';cx.fillRect(midX+1,midY-4,3,2);
        cx.fillStyle=icCol;
        cx.beginPath();cx.arc(midX-4,midY+5,2,0,Math.PI*2);cx.arc(midX+4,midY+5,2,0,Math.PI*2);cx.fill();
        const bOn=Math.sin(G.anim*10)>0;
        cx.fillStyle=bOn?'#ff4444':'#ffd97a';
        cx.fillRect(midX-3,midY-7,3,2);
      }

      cx.restore();
      cx.font='bold 10px monospace';cx.textAlign='left';
      cx.fillStyle=vanActive?'#ffb84d':canAfford?'#e4ebf5':'#5a6478';
      cx.fillText(c.name,cx0+32,cy0+19);

      cx.font='bold 10px monospace';
      if(vanActive){
        cx.fillStyle='#ffd97a';
        cx.fillText('ACTIVE',cx0+48,cy0+38);
      }else if(canAfford){
        cx.fillStyle='#8dff8d';
        cx.fillText('$'+c.cost,cx0+48,cy0+38);
        cx.font='9px monospace';cx.fillStyle='#8ba3cb';

      }else{
        cx.fillStyle='#ff5548';
        cx.fillText('$'+c.cost+' (-$'+(c.cost-G.funds)+')',cx0+48,cy0+38);
      }
    });
    cx.restore();
  }

  // 4. TOP-RIGHT TACTICAL RADAR
  {
    const rw=360,rh=64,rx=W-rw-16,ry=12;
    cx.save();
    cx.fillStyle='rgba(8,12,24,.9)';cx.fillRect(rx,ry,rw,rh);
    cx.strokeStyle='rgba(77,178,255,.4)';cx.lineWidth=1.5;cx.strokeRect(rx,ry,rw,rh);

    cx.strokeStyle='rgba(77,178,255,.12)';cx.lineWidth=1;
    for(let s=1;s<=5;s++){
      const gx=rx+(s/6)*rw;
      cx.beginPath();cx.moveTo(gx,ry);cx.lineTo(gx,ry+rh);cx.stroke();
    }
    cx.font='bold 9px monospace';
    cx.fillStyle='#4db2ff';cx.textAlign='left';cx.fillText('BLUE HQ',rx+4,ry+rh-4);
    cx.fillStyle='#ff5548';cx.textAlign='right';cx.fillText('RED HQ',rx+rw-4,ry+rh-4);

    if(radarJammed()){cx.fillStyle='#ffd070';cx.textAlign='center';cx.fillText('JAMMED',rx+rw/2,ry+12);}
    const mx=x=>rx+(x/WORLD)*rw;

    for(const t of G.turrets){cx.fillStyle=t.side===1?'#72d7c0':t.side===-1?'#f48277':'#8b959e';cx.fillRect(mx(t.x)-2,ry+rh-7,4,5);}
    for(const b of G.bunkers){
      const bx=mx(b.x);
      const bCol=b.owner===1?'#4db2ff':b.owner===-1?'#ff5548':'#888888';
      cx.fillStyle=bCol;cx.strokeStyle=bCol;
      cx.beginPath();cx.arc(bx,ry+rh-7,4,Math.PI,0);cx.fill();
      cx.fillRect(bx-4,ry+rh-7,8,3);
      if(b.owner===1){
        cx.fillStyle='#9affb9';cx.fillRect(bx+6,ry+rh-10,6,2);cx.fillRect(bx+8,ry+rh-12,2,6);
      }
      if(!b.balloonDead&&!b.cableBroken){
        cx.lineWidth=1;
        cx.beginPath();cx.moveTo(bx,ry+rh-11);cx.lineTo(bx,ry+14);cx.stroke();
        cx.beginPath();cx.arc(bx,ry+12,3.5,0,Math.PI*2);cx.fill();
      }
    }

    for(const u of G.units){
      if(radarJammed()&&u.side!==1)continue;
      const ux=mx(u.x);
      const uCol=u.side===1?'#4db2ff':'#ff5548';
      const uy=ry+rh-13;
      if(u.type==='VAN'){
        const pulse=Math.sin(G.anim*12)>0;
        cx.fillStyle=u.side===1?'#4db2ff':'#ff3333';
        cx.strokeStyle=pulse?'#ffffff':'#ffb84d';cx.lineWidth=1.5;
        cx.beginPath();
        cx.moveTo(ux+u.side*6,uy);cx.lineTo(ux-u.side*4,uy-6);cx.lineTo(ux-u.side,uy);cx.lineTo(ux-u.side*4,uy+6);
        cx.closePath();cx.fill();cx.stroke();
        cx.fillStyle=pulse?'#ffffff':'#ffd97a';
        cx.beginPath();cx.arc(ux,uy,1.8,0,Math.PI*2);cx.fill();
      }else if(u.type==='TANK'){
        cx.fillStyle=uCol;
        cx.fillRect(ux-4,uy-1,8,4);
        cx.fillRect(ux-2,uy-3,5,3);
        cx.fillRect(ux+1,uy-2,4,1.5);
      }else if(u.type==='AA'){
        cx.fillStyle=uCol;cx.strokeStyle=uCol;cx.lineWidth=1.2;
        cx.fillRect(ux-3.5,uy+1,7,3);
        cx.beginPath();
        cx.moveTo(ux,uy-5);cx.lineTo(ux+4,uy+1);cx.lineTo(ux-4,uy+1);
        cx.closePath();cx.fill();
        cx.beginPath();cx.moveTo(ux,uy);cx.lineTo(ux+3,uy-6);cx.stroke();
      }else{
        cx.fillStyle=uCol;
        cx.beginPath();cx.arc(ux,uy+1,1.5,0,7);cx.fill();
      }
    }

    for(const h of G.helis){
      if(h.dead||(radarJammed()&&h.side!==1))continue;
      const hx=mx(h.x),hy=ry+clamp(h.y/GROUND*(rh-14),8,rh-9);
      const hCol=h.side===1?'#4db2ff':'#ff5548';
      cx.strokeStyle=hCol;cx.lineWidth=1.2;
      cx.beginPath();cx.arc(hx,hy,4.5,0,Math.PI*2);cx.stroke();
      cx.fillStyle=h.side===1?'#ffffff':'#ffd070';
      cx.beginPath();cx.arc(hx,hy,2,0,Math.PI*2);cx.fill();
      // Crosshair ticks distinguish aircraft from ground objective chevrons
      cx.strokeStyle=h.side===1?'#ffffff':hCol;cx.lineWidth=1.5;
      cx.beginPath();
      cx.moveTo(hx-7,hy);cx.lineTo(hx-3,hy);cx.moveTo(hx+3,hy);cx.lineTo(hx+7,hy);
      cx.moveTo(hx,hy-7);cx.lineTo(hx,hy-3);cx.moveTo(hx,hy+3);cx.lineTo(hx,hy+7);
      cx.stroke();
    }

    const camW=(W/WORLD)*rw;
    const camL=rx+(G.camX/WORLD)*rw;
    cx.strokeStyle='rgba(255,255,255,.5)';cx.lineWidth=1;
    cx.strokeRect(camL,ry+1,camW,rh-2);

    cx.font='9px monospace';cx.fillStyle='rgba(160,190,230,.7)';cx.textAlign='center';
    cx.fillText((G.scanTimer>0?'SCANNING • MOVE TO RETURN':'RADAR • CLICK TO SCAN'),rx+rw/2,ry-4);
    cx.restore();
  }

  // 5. AUDIO TOGGLE BUTTON
  {
    const abw=126,abh=24,abx=W-abw-16,aby=82;
    const isHover=regBtn('audio_btn',abx,aby,abw,abh,()=>toggleAudio());
    cx.save();
    cx.fillStyle=isHover?'#253550':'#101726';
    cx.strokeStyle=isHover?'#70b0ff':'#2e4162';
    cx.lineWidth=1;cx.beginPath();cx.roundRect(abx,aby,abw,abh,3);cx.fill();cx.stroke();
    cx.font='bold 10px monospace';cx.fillStyle=AUDIO_MUTED?'#ff8877':'#8dff8d';cx.textAlign='center';
    cx.fillText(AUDIO_MUTED?'🔇 SOUND: MUTED':'🔊 SOUND: ON',abx+abw/2,aby+abh/2+3);
    cx.restore();
  }

  // 6. PRIORITY STRATEGIC ALERT BANNER
  if(G.bannerAlert&&G.bannerAlert.timer>0){
    const bw=620,bh=46,bx=W/2-bw/2,by=14;
    cx.save();
    const g=cx.createLinearGradient(bx,by,bx,by+bh);
    g.addColorStop(0,'rgba(140,20,20,.95)');g.addColorStop(1,'rgba(70,10,10,.95)');
    cx.fillStyle=g;cx.fillRect(bx,by,bw,bh);
    cx.strokeStyle='#ff4444';cx.lineWidth=2;cx.strokeRect(bx,by,bw,bh);

    const numSt=5;
    for(let s=0;s<numSt;s++){
      const sx0=bx+s*12+((G.anim*30)%12);
      cx.fillStyle='rgba(255,200,50,.35)';
      cx.beginPath();cx.moveTo(sx0,by);cx.lineTo(sx0+6,by);cx.lineTo(sx0-2,by+bh);cx.lineTo(sx0-8,by+bh);cx.fill();
      const sx1=bx+bw-60+s*12+((G.anim*30)%12);
      cx.beginPath();cx.moveTo(sx1,by);cx.lineTo(sx1+6,by);cx.lineTo(sx1-2,by+bh);cx.lineTo(sx1-8,by+bh);cx.fill();
    }

    const blink=Math.sin(G.anim*10)>0;
    cx.font='bold 14px monospace';cx.fillStyle=blink?'#fff':'#ffd97a';cx.textAlign='center';
    cx.fillText(G.bannerAlert.title,W/2,by+20);
    cx.font='bold 11px monospace';cx.fillStyle='#ffc0b8';
    cx.fillText(G.bannerAlert.sub,W/2,by+36);
    cx.restore();
  }

  // 6b. MASTER CAUTION SYSTEM (CRITICAL HULL INTEGRITY)
  if(p&&!p.dead&&(p.hp<p.maxhp*.25||p.fuel<LOW_FUEL)){
    const blink=Math.sin(G.anim*10)>0;
    const cw=350,ch=42,cx0=W/2-cw/2,cy0=H/2-124;
    cx.save();
    const hullCritical=p.hp<p.maxhp*.25;
    cx.fillStyle=hullCritical?(blink?'rgba(180,20,20,.92)':'rgba(60,10,10,.88)'):(blink?'rgba(115,72,12,.92)':'rgba(48,32,12,.88)');
    cx.fillRect(cx0,cy0,cw,ch);
    cx.strokeStyle=hullCritical&&blink?'#ff4d4d':'#ffaa33';cx.lineWidth=2;
    cx.strokeRect(cx0,cy0,cw,ch);
    // Corner caution brackets
    cx.fillStyle='#ffdd55';
    cx.fillRect(cx0,cy0,8,3);cx.fillRect(cx0,cy0,3,8);
    cx.fillRect(cx0+cw-8,cy0,8,3);cx.fillRect(cx0+cw-3,cy0,3,8);
    cx.fillRect(cx0,cy0+ch-3,8,3);cx.fillRect(cx0,cy0+ch-8,3,8);
    cx.fillRect(cx0+cw-8,cy0+ch-3,8,3);cx.fillRect(cx0+cw-3,cy0+ch-8,3,8);

    cx.font='bold 12px monospace';cx.textAlign='center';
    cx.fillStyle=blink?'#ffffff':'#ffcc44';
    const hpLeft=Math.max(0,Math.round((p.hp/p.maxhp)*100));
    cx.fillText(p.hp<p.maxhp*.25?'MASTER CAUTION • HULL '+hpLeft+'%':p.fuel<=0?(p.reserve>0?'RESERVE '+Math.ceil(p.reserve)+'s • LAND NOW':'ENGINE OUT • LAND'):'MASTER CAUTION • LOW FUEL',W/2,cy0+17);
    cx.font='10px monospace';cx.fillText('LAND AT HQ OR A FRIENDLY FORWARD PAD',W/2,cy0+32);
    // cockpit pulsing perimeter vignette
    cx.fillStyle=blink?'rgba(255,20,20,0.09)':'rgba(255,20,20,0.03)';
    cx.fillRect(0,0,5,H);cx.fillRect(W-5,0,5,H);
    cx.restore();
  }

  // 7. CABLE HAZARD PROXIMITY WARNING
  if(G.cableWarning>0.05){
    const blink=Math.sin(G.anim*12)>0;
    cx.save();
    cx.globalAlpha=clamp(G.cableWarning,0,1);
    cx.fillStyle='rgba(255,40,20,.12)';
    cx.fillRect(W/2-180,H/2-70,360,40);
    cx.strokeStyle=blink?'#ff3322':'#ffaa33';cx.lineWidth=2;
    cx.strokeRect(W/2-180,H/2-70,360,40);
    cx.font='bold 15px monospace';cx.fillStyle=blink?'#ffffff':'#ffcc44';cx.textAlign='center';
    cx.fillText('⚠️ WARNING: BARRAGE CABLE HAZARD ⚠️',W/2,H/2-44);
    cx.restore();
  }

  // 8. OFF-SCREEN THREAT DIRECTIONAL POINTERS
  {
    const eVans=G.units.filter(u=>u.side<0&&u.type==='VAN');
    for(const v of eVans){
      const vx=v.x-G.camX;
      if(vx<-20||vx>W+20){
        const onRight=vx>W/2;
        const arrowX=onRight?W-30:30;
        const arrowY=GROUND-36;
        const dist=Math.abs(Math.round(v.x-PLAYER_X));
        drawThreatIndicator(arrowX,arrowY,onRight,'VAN ~'+formatETA(Math.max(0,(v.x-PLAYER_X-70)/UT.VAN.spd))+' TO HQ','#ff4444');
      }
    }
    const eHeli=G.helis[1];
    if(eHeli&&!eHeli.dead){
      const hx=eHeli.x-G.camX;
      if(hx<-40||hx>W+40){
        const onRight=hx>W/2;
        const arrowX=onRight?W-30:30;
        const arrowY=clamp(eHeli.y,120,GROUND-60);
        drawThreatIndicator(arrowX,arrowY,onRight,'ENEMY CHOPPER','#ff7755');
      }
    }
  }

  const threat=vanThreat();
  if(threat){
    cx.fillStyle=threat.level?'#ffb16f':'#b5cbd0';cx.textAlign='right';cx.font='bold 12px monospace';
    cx.fillText('HQ BREACH ~'+formatETA(threat.seconds)+(threat.level?' • INTERCEPT NOW':''),W-18,125);
  }
  if(G.tutorial){
    cx.fillStyle='#b5e4d3';cx.font='bold 12px monospace';cx.textAlign='center';
    cx.fillText(tutorialHint(),W/2,G.tutorial.advanced?122:92);
  }
  // 9. COMBAT MESSAGE LOG
  cx.textAlign='center';
  G.msgs.filter(m=>m.kind!=='routine').forEach((m,i)=>{
    cx.save();
    cx.globalAlpha=m.age>2.4?1-(m.age-2.4)/.8:1;
    const msgY=116+i*24;
    cx.font='bold 13px monospace';
    const tw=cx.measureText(m.text).width;
    cx.fillStyle='rgba(6,10,20,.85)';
    cx.fillRect(W/2-tw/2-10,msgY-13,tw+20,18);
    cx.strokeStyle='rgba(80,110,160,.4)';cx.lineWidth=1;
    cx.strokeRect(W/2-tw/2-10,msgY-13,tw+20,18);
    cx.fillStyle=m.color;
    cx.fillText(m.text,W/2,msgY);
    cx.restore();
  });

  return canvasHover;
}

function dim(){cx.fillStyle='rgba(4,6,14,.78)';cx.fillRect(0,0,W,H);}

function drawOverlays(){
  cx.textAlign='center';

  function keycap(txt,x,y,w,h){
    cx.save();
    cx.fillStyle='#1c2638';cx.strokeStyle='#5a78aa';cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect(x,y,w,h,4);cx.fill();cx.stroke();
    cx.fillStyle='#ffffff';cx.font='bold 11px monospace';cx.textAlign='center';
    cx.fillText(txt,x+w/2,y+h/2+4);
    cx.restore();
  }

  // 1. MAIN MENU
  if(G.state==='menu'){
    dim();
    const mw=900,mh=560,mx=W/2-mw/2,my=H/2-mh/2;
    cx.save();
    const g=cx.createLinearGradient(mx,my,mx,my+mh);
    g.addColorStop(0,'rgba(10,16,32,.95)');g.addColorStop(1,'rgba(6,10,22,.95)');
    cx.fillStyle=g;cx.fillRect(mx,my,mw,mh);
    cx.strokeStyle='rgba(77,178,255,.45)';cx.lineWidth=2;cx.strokeRect(mx,my,mw,mh);

    cx.font='bold 58px monospace';
    cx.fillStyle='#ff5548';cx.fillText('RESCUE RAIDERS',W/2+3,my+68);
    cx.fillStyle='#4db2ff';cx.fillText('RESCUE RAIDERS',W/2,my+65);
    cx.font='bold 14px monospace';cx.fillStyle='#ffd97a';
    cx.fillText('★ ARMOR ALLEY TACTICAL COMBAT TRIBUTE ★',W/2,my+96);

    const colW=400,colH=310,c1x=mx+36,c2x=mx+mw-colW-36,cy=my+120;
    cx.fillStyle='rgba(16,24,44,.7)';cx.fillRect(c1x,cy,colW,colH);
    cx.strokeStyle='rgba(60,88,135,.4)';cx.strokeRect(c1x,cy,colW,colH);

    cx.font='bold 13px monospace';cx.fillStyle='#4db2ff';cx.textAlign='left';
    cx.fillText('FLIGHT CONTROLS & WEAPON SYSTEMS',c1x+16,cy+26);

    const fControls=[
      {k:'W A S D',alt:'ARROWS',desc:'Flight Pitch, Altitude & Direction'},
      {k:'SPACE',desc:'M230 30mm Minigun (Armor Piercing)'},
      {k:'B',desc:'Hold: bomb predictor / Release: drop / Esc: cancel'},
      {k:'M',desc:'AIM Heat-Seeking Missiles (Air / Vehicles)'},
      {k:'C',desc:'Thermal Flare Decoy (Diverts Missiles)'},
      {k:'E',desc:'Land to board; E: unload; Q/F: select/drop'},
    ];
    fControls.forEach((item,i)=>{
      const ry=cy+44+i*42;
      keycap(item.k,c1x+16,ry,item.k.length>4?68:32,22);
      if(item.alt){
        cx.font='10px monospace';cx.fillStyle='#657a9e';cx.fillText('/',c1x+90,ry+15);
        keycap(item.alt,c1x+100,ry,60,22);
      }
      cx.font='11px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='left';
      cx.fillText(item.desc,c1x+16+(item.alt?168:item.k.length>4?80:44),ry+15);
    });

    cx.fillStyle='rgba(16,24,44,.7)';cx.fillRect(c2x,cy,colW,colH);
    cx.strokeStyle='rgba(60,88,135,.4)';cx.strokeRect(c2x,cy,colW,colH);

    cx.font='bold 13px monospace';cx.fillStyle='#ffd97a';cx.textAlign='left';
    cx.fillText('COMMAND DOCK & MISSION RULES',c2x+16,cy+26);

    const cControls=[
      {k:'1',desc:'Deploy Infantry ($20) — Captures Bunkers'},
      {k:'2',desc:'Deploy Battle Tank ($120) — Heavy Firepower'},

      {k:'4',desc:'Deploy Demo Van ($250) — Win Escort Unit'},
      {k:'5',desc:'Deploy Engineer ($40) — Capture & Repair'},
    ];
    cControls.forEach((item,i)=>{
      const ry=cy+44+i*34;
      keycap(item.k,c2x+16,ry,26,22);
      cx.font='11px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='left';
      cx.fillText(item.desc,c2x+50,ry+15);
    });

    cx.fillStyle='rgba(10,14,24,.8)';cx.fillRect(c2x+16,cy+218,colW-32,76);
    cx.strokeStyle='rgba(255,200,80,.25)';cx.strokeRect(c2x+16,cy+218,colW-32,76);
    cx.font='bold 10px monospace';cx.fillStyle='#8dff8d';
    cx.fillText('• OBJECTIVE: Escort your Demo Van to the enemy HQ.',c2x+24,cy+236);
    cx.fillStyle='#ffb84d';
    cx.fillText('• CABLES: Enemy balloon cables shred your chopper.',c2x+24,cy+254);
    cx.fillStyle='#4db2ff';
    cx.fillText('• BUNKERS: Deliver 3 infantry to secure friendly balloon.',c2x+24,cy+272);

    cx.font='10px monospace';cx.textAlign='center';cx.fillStyle='#9ebbb3';
    cx.fillText('DIFFICULTY: '+DIFFICULTIES[SETTINGS.difficulty].name+' • Starting funds $'+DIFFICULTIES[SETTINGS.difficulty].funds,W/2,my+mh-122);
    const choices=[['recruit','1 RECRUIT'],['normal','2 NORMAL'],['veteran','3 VETERAN'],['tutorial','T TRAINING']];
    choices.forEach(([id,label],i)=>{
      const x=W/2-270+i*138,y=my+mh-112,w=130,h=26;
      G.buttons.push({id:'mode_'+id,x,y,w,h,onClick:()=>{if(id==='tutorial')startTutorial();else setDifficulty(id);}});
      cx.fillStyle=SETTINGS.difficulty===id?'#294e43':'#121f2b';cx.fillRect(x,y,w,h);
      cx.strokeStyle='#577c75';cx.strokeRect(x,y,w,h);cx.fillStyle='#cae7da';cx.font='bold 11px monospace';cx.textAlign='center';cx.fillText(label,x+w/2,y+17);
    });
    const btnW=340,btnH=52,btnX=W/2-btnW/2,btnY=my+mh-76;
    const isHover=G.buttons.some(b=>b.id==='start_btn'&&mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h);
    G.buttons.push({id:'start_btn',x:btnX,y:btnY,w:btnW,h:btnH,onClick:()=>{newGame();G.state='play';SFX.blip();}});
    cx.fillStyle=isHover?'#225533':'#143520';
    cx.strokeStyle=isHover?'#77ff88':'#44bb55';cx.lineWidth=isHover?2.5:1.5;
    cx.beginPath();cx.roundRect(btnX,btnY,btnW,btnH,6);cx.fill();cx.stroke();
    cx.font='bold 19px monospace';cx.fillStyle=isHover?'#ffffff':'#8dff8d';cx.textAlign='center';
    cx.fillText('▶ SCRAMBLE CHOPPER (ENTER)',W/2,btnY+32);

    const abw=130,abh=30,abx=mx+36,aby=my+mh-65;
    const audHover=G.buttons.some(b=>b.id==='menu_audio'&&mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h);
    G.buttons.push({id:'menu_audio',x:abx,y:aby,w:abw,h:abh,onClick:()=>toggleAudio()});
    cx.fillStyle=audHover?'#253550':'#101726';
    cx.strokeStyle=audHover?'#70b0ff':'#2e4162';
    cx.beginPath();cx.roundRect(abx,aby,abw,abh,4);cx.fill();cx.stroke();
    cx.font='bold 11px monospace';cx.fillStyle=AUDIO_MUTED?'#ff8877':'#8dff8d';cx.textAlign='center';
    cx.fillText(AUDIO_MUTED?'🔇 SOUND: OFF':'🔊 SOUND: ON',abx+abw/2,aby+abh/2+4);

    cx.restore();
  }

  // 2. PAUSE SCREEN
  if(G.paused){
    dim();
    const pw=560,ph=360,px=W/2-pw/2,py=H/2-ph/2;
    cx.save();
    const g=cx.createLinearGradient(px,py,px,py+ph);
    g.addColorStop(0,'rgba(10,16,32,.95)');g.addColorStop(1,'rgba(6,10,22,.95)');
    cx.fillStyle=g;cx.fillRect(px,py,pw,ph);
    cx.strokeStyle='#4db2ff';cx.lineWidth=2;cx.strokeRect(px,py,pw,ph);

    cx.font='bold 34px monospace';cx.fillStyle='#ffffff';cx.textAlign='center';
    cx.fillText('MISSION PAUSED',W/2,py+46);
    cx.font='12px monospace';cx.fillStyle='#8ba3cb';
    cx.fillText('TACTICAL CONTROLS REFERENCE',W/2,py+72);

    cx.fillStyle='rgba(16,24,44,.7)';cx.fillRect(px+24,py+88,pw-48,150);
    cx.strokeStyle='rgba(60,88,135,.4)';cx.strokeRect(px+24,py+88,pw-48,150);
    const pCheats=[
      'WASD / Arrows: Pitch & Altitude',
      'SPACE: Minigun   B: Bomb   M: Missile   C: Flares',
      'E: Board low / Drop troops low / Parachute one troop aloft',
      '1-5: Deploy Infantry / Tank / AA / Van / Engineer',
      'Q: Select cargo · F: Drop selected · Z/X/V: Orders'
    ];
    pCheats.forEach((t,i)=>{
      cx.font='11px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='center';
      cx.fillText(t,W/2,py+114+i*24);
    });

    const rBtnX=px+40,rBtnY=py+ph-64,rBtnW=140,rBtnH=40;
    const rHover=mouse.x>=rBtnX&&mouse.x<=rBtnX+rBtnW&&mouse.y>=rBtnY&&mouse.y<=rBtnY+rBtnH;
    G.buttons.push({id:'pause_resume',x:rBtnX,y:rBtnY,w:rBtnW,h:rBtnH,onClick:()=>{G.paused=false;}});
    cx.fillStyle=rHover?'#225533':'#143520';cx.strokeStyle=rHover?'#77ff88':'#44bb55';cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect(rBtnX,rBtnY,rBtnW,rBtnH,4);cx.fill();cx.stroke();
    cx.font='bold 12px monospace';cx.fillStyle='#8dff8d';cx.textAlign='center';
    cx.fillText('▶ RESUME (P)',rBtnX+rBtnW/2,rBtnY+24);

    const reBtnX=px+pw/2-70,reBtnY=py+ph-64,reBtnW=140,reBtnH=40;
    const reHover=mouse.x>=reBtnX&&mouse.x<=reBtnX+reBtnW&&mouse.y>=reBtnY&&mouse.y<=reBtnY+reBtnH;
    G.buttons.push({id:'pause_restart',x:reBtnX,y:reBtnY,w:reBtnW,h:reBtnH,onClick:()=>{restartMission();SFX.blip();}});
    cx.fillStyle=reHover?'#442222':'#2a1616';cx.strokeStyle=reHover?'#ff7766':'#aa4444';cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect(reBtnX,reBtnY,reBtnW,reBtnH,4);cx.fill();cx.stroke();
    cx.font='bold 12px monospace';cx.fillStyle='#ff8877';cx.textAlign='center';
    cx.fillText('↺ RESTART',reBtnX+reBtnW/2,reBtnY+24);

    const aBtnX=px+pw-180,aBtnY=py+ph-64,aBtnW=140,aBtnH=40;
    const aHover=mouse.x>=aBtnX&&mouse.x<=aBtnX+aBtnW&&mouse.y>=aBtnY&&mouse.y<=aBtnY+aBtnH;
    G.buttons.push({id:'pause_audio',x:aBtnX,y:aBtnY,w:aBtnW,h:aBtnH,onClick:()=>toggleAudio()});
    cx.fillStyle=aHover?'#253550':'#101726';cx.strokeStyle=aHover?'#70b0ff':'#2e4162';cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect(aBtnX,aBtnY,aBtnW,aBtnH,4);cx.fill();cx.stroke();
    cx.font='bold 12px monospace';cx.fillStyle=AUDIO_MUTED?'#ff8877':'#8dff8d';cx.textAlign='center';
    cx.fillText(AUDIO_MUTED?'🔇 SOUND: OFF':'🔊 SOUND: ON',aBtnX+aBtnW/2,aBtnY+24);

    cx.restore();
  }

  // 3. POST-BATTLE DEBRIEFING SCREEN
  if(G.state==='over'||G.state==='win'){
    dim();
    const win=G.state==='win';
    const dw=720,dh=500,dx=W/2-dw/2,dy=H/2-dh/2;
    cx.save();
    const g=cx.createLinearGradient(dx,dy,dx,dy+dh);
    g.addColorStop(0,win?'rgba(10,26,20,.96)':'rgba(28,12,14,.96)');
    g.addColorStop(1,'rgba(6,10,22,.96)');
    cx.fillStyle=g;cx.fillRect(dx,dy,dw,dh);
    cx.strokeStyle=win?'#4dff88':'#ff5548';cx.lineWidth=2;
    cx.strokeRect(dx,dy,dw,dh);

    cx.font='bold 46px monospace';
    cx.fillStyle=win?'#8dff8d':'#ff5548';cx.textAlign='center';
    cx.fillText(win?'MISSION ACCOMPLISHED':'MISSION FAILED',W/2,dy+54);

    cx.font='14px monospace';cx.fillStyle='#cdd6ea';
    cx.fillText(G.endMsg||(win?'Enemy HQ Completely Obliterated!':'Tactical Objectives Lost.'),W/2,dy+84);

    let stars='⭐⭐⭐';
    let rank='ACE FLIGHT COMMANDER';
    if(!win){stars='⭐';rank='HONORABLE SERVICE SPECIALIST';}
    else if(G.time>180||(G.stats&&G.stats.helisLost>0)){stars='⭐⭐';rank='VETERAN SQUADRON LEADER';}

    cx.font='bold 22px monospace';cx.fillStyle='#ffd97a';
    cx.fillText(stars+' '+rank+' '+stars,W/2,dy+124);

    const gridX=dx+40,gridY=dy+150,gridW=dw-80,cardW=(gridW-20)/2,cardH=68;
    const statsList=[
      {title:'HOSTILE CASUALTIES',val:(G.stats?G.stats.kills:G.kills)+' KILLS',sub:'Ground & Armor eliminated'},
      {title:'REINFORCEMENTS DEPLOYED',val:(G.stats?(G.stats.deployed.ENG+G.stats.deployed.INF+G.stats.deployed.TANK+G.stats.deployed.AA+G.stats.deployed.VAN):0)+' UNITS',sub:'Infantry & Armor deployed'},
      {title:'BUNKERS SECURED',val:(G.stats?G.stats.bunkersCap:0)+' CAPTURED',sub:'Airspace defense balloons'},
      {title:'FLIGHT TIME & SCORE',val:Math.floor(G.time)+'s  |  '+G.score+' PTS',sub:'Combat duration & score'},
    ];

    statsList.forEach((st,i)=>{
      const row=Math.floor(i/2),col=i%2;
      const sx=gridX+col*(cardW+20),sy=gridY+row*(cardH+12);
      cx.fillStyle='rgba(14,20,36,.8)';cx.fillRect(sx,sy,cardW,cardH);
      cx.strokeStyle='rgba(60,88,135,.4)';cx.strokeRect(sx,sy,cardW,cardH);

      cx.font='bold 10px monospace';cx.fillStyle='#8ba3cb';cx.textAlign='left';
      cx.fillText(st.title,sx+14,sy+20);
      cx.font='bold 16px monospace';cx.fillStyle='#ffd97a';
      cx.fillText(st.val,sx+14,sy+42);
      cx.font='9px monospace';cx.fillStyle='#7e94b8';
      cx.fillText(st.sub,sx+14,sy+58);
    });

    const fBtnW=220,fBtnH=48,fBtnX=W/2-fBtnW-15,fBtnY=dy+dh-76;
    const fHover=mouse.x>=fBtnX&&mouse.x<=fBtnX+fBtnW&&mouse.y>=fBtnY&&mouse.y<=fBtnY+fBtnH;
    G.buttons.push({id:'debrief_fly_again',x:fBtnX,y:fBtnY,w:fBtnW,h:fBtnH,onClick:()=>{nextSortie();SFX.blip();}});
    cx.fillStyle=fHover?'#225533':'#143520';cx.strokeStyle=fHover?'#77ff88':'#44bb55';cx.lineWidth=2;
    cx.beginPath();cx.roundRect(fBtnX,fBtnY,fBtnW,fBtnH,6);cx.fill();cx.stroke();
    cx.font='bold 15px monospace';cx.fillStyle='#8dff8d';cx.textAlign='center';
    cx.fillText(sortieLabel()+' (Enter)',fBtnX+fBtnW/2,fBtnY+29);

    const mBtnW=220,mBtnH=48,mBtnX=W/2+15,mBtnY=dy+dh-76;
    const mHover=mouse.x>=mBtnX&&mouse.x<=mBtnX+mBtnW&&mouse.y>=mBtnY&&mouse.y<=mBtnY+fBtnH;
    G.buttons.push({id:'debrief_menu',x:mBtnX,y:mBtnY,w:mBtnW,h:fBtnH,onClick:()=>{newGame();G.state='menu';SFX.blip();}});
    cx.fillStyle=mHover?'#253550':'#101726';cx.strokeStyle=mHover?'#70b0ff':'#2e4162';cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect(mBtnX,mBtnY,mBtnW,fBtnH,6);cx.fill();cx.stroke();
    cx.font='bold 15px monospace';cx.fillStyle='#cdd6ea';cx.textAlign='center';
    cx.fillText('🏠 MAIN MENU',mBtnX+mBtnW/2,mBtnY+29);

    cx.restore();
  }
}

function handleCanvasClick(mx,my){
  for(let i=G.buttons.length-1;i>=0;i--){
    const b=G.buttons[i];
    if(mx>=b.x&&mx<=b.x+b.w&&my>=b.y&&my<=b.y+b.h){
      if(b.onClick){b.onClick();return;}
    }
  }
  if(G.state==='play'){
    const rw=360,rh=64,rx=W-rw-16,ry=12;
    if(mx>=rx&&mx<=rx+rw&&my>=ry&&my<=ry+rh){
      const tx=(mx-rx)/rw*WORLD;
      G.camX=clamp(tx-W/2,0,WORLD-W);
      G.scanTimer=2.5;
      SFX.blip();
      return;
    }
  }
}

// ============================================================ MAIN LOOP
newGame();
if(location.search.indexOf('autostart')>=0){
  G.state='play';G.time=1;
  spawnUnit(1,'TANK');spawnUnit(1,'AA');spawnUnit(1,'VAN');spawnUnit(1,'INF');spawnUnit(1,'INF');
  spawnUnit(-1,'TANK');spawnUnit(-1,'INF');
  const p=G.helis[0];p.x=520;p.y=380;
  const e=G.helis[1];e.x=900;e.y=300;
  G.bunkers[0].owner=1;
}
let last=performance.now();
function frame(t){
  requestAnimationFrame(frame);
  let dt=Math.min((t-last)/1000,.033);
  last=t;
  G.anim+=dt;
  if(!ASSETS_OK){
    cx.fillStyle='#05060d';cx.fillRect(0,0,W,H);
    cx.fillStyle='#8dff8d';cx.font='bold 22px monospace';cx.textAlign='center';
    cx.fillText('LOADING ASSETS '+ASSET_GOT+'/'+ASSET_NEED+('.'.repeat(1+Math.floor(G.anim*2)%3)),W/2,H/2);
    if(ASSET_FAIL.length){
      cx.fillStyle='#ff5548';cx.font='14px monospace';
      cx.fillText('FAILED: '+ASSET_FAIL.join(', '),W/2,H/2+40);
    }
    if(TOUCH.active&&TOUCH.render)TOUCH.render();
    return;
  }
  if(G.replay){G.replay.time+=dt*G.replay.speed;if(G.replay.time>replayDuration()+.6)stopReplay();}
  if(G.state==='play'&&!G.paused&&!G.replay){
    if(G.time>0)aiTick(dt);
    update(dt);
  }
  updateRotorAudio();
  render();
}
function aiTick(dt){
  if(G.tutorial)return;
  G.aiAccum+=dt;
  if(G.aiAccum>=difficulty().interval){G.aiAccum-=difficulty().interval;aiDecide();}
}
requestAnimationFrame(frame);
</script>
