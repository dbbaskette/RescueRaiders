<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090e1c">
<link rel="stylesheet" href="mobile.css">
<title>RESCUE RAIDERS — Armor Alley Tribute</title>
<style>
  html,body{margin:0;padding:0;background:#05060d;height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,-apple-system,monospace}
  body{display:flex;align-items:center;justify-content:center}
  canvas{
    width:min(100vw,calc(100vh*16/9));
    height:min(calc(100vw*9/16),100vh);

    user-select:none;
    -webkit-user-select:none;
  }

<body>
<canvas id="game" width="1280" height="720"></canvas>
<script>
'use strict';
// ============================================================ CONSTANTS
const cv=document.getElementById('game'),cx=cv.getContext('2d');
const W=1280,H=720,WORLD=9000,GROUND=622,BALLOON_Y=235;
const PLAYER_X=150,ENEMY_X=WORLD-150;
const BUNKER_XS=[1850,3550,5250,6950];
const CAPTURE_N=3;
const GUN_CD=.11, FUEL_BURN=.28, LOW_FUEL=20;
const BOMB_GRAVITY=480,BOMB_DRAG=.4,FORWARD_HP=.75,RESERVE_SECONDS=20;
const DIFFICULTIES={
  recruit:{name:'Recruit',funds:450,damage:.7,interval:6,income:18,vanTime:100},
  normal:{name:'Normal',funds:300,damage:1,interval:4,income:22,vanTime:70},
  veteran:{name:'Veteran',funds:220,damage:1.2,interval:3,income:27,vanTime:50}
};
const SETTINGS={difficulty:'normal'};

const UT={
  ENG :{hp:28, spd:42, rng:180, dmg:4, cd:.8, w:10,h:20,cost:40},
  TURRET:{h:30,w:38},BUNKER:{h:32,w:100},
  INF :{hp:22, spd:44, rng:250, dmg:6,  cd:.55, w:10,h:20, cost:20 },
  TANK:{hp:130,spd:30, rng:430, dmg:32, cd:2.3, w:58,h:21, cost:120},
  AA  :{hp:64, spd:26, rng:900, dmg:46, cd:3.6, w:48,h:28, cost:160},
  VAN :{hp:70, spd:76, rng:0,   dmg:0,  cd:0,   w:42,h:21, cost:250},
};

// ============================================================ UTILS
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const hash=n=>{const s=Math.sin(n*127.1)*43758.5453;return s-Math.floor(s);};

// ============================================================ ASSETS
const SPR={},UNIT_SPR={ENG:'soldier',INF:'soldier',TANK:'tank',AA:'aa',VAN:'van'};
const SPR_CFG={
  heli:{w:130,face:-1},tank:{w:95,face:1},aa:{w:110,face:-1},van:{w:100,face:1},
  soldier:{w:30,face:1},balloon:{w:120,face:1},bunker:{w:110,face:1},hq:{w:300,face:1}
};
let ASSETS_OK=false,ASSET_FAIL=[],ASSET_GOT=0,ASSET_NEED=0;
(function loadAssets(){
  let need=1,got=0;
  const done=()=>{ASSET_GOT=++got;if(got>=need)ASSETS_OK=true;};
  const watch=(img,name)=>{
    ASSET_NEED++;
    img.onload=done;
    img.onerror=()=>{ASSET_FAIL.push(name);done();};
  };
  for(const n in SPR_CFG){
    SPR[n]={img:new Image(),red:new Image()};need+=2;
    watch(SPR[n].img,n);watch(SPR[n].red,n+'_r');
    SPR[n].img.src='assets/'+n+'.png';
    SPR[n].red.src='assets/'+n+'_r.png';
  }
  SPR.backdrop=new Image();watch(SPR.backdrop,'backdrop');
  SPR.backdrop.src='assets/backdrop.jpg';
})();
function sprImg(name,side){
  const s=SPR[name];
  if(!s)return null;
  if(side<0&&s.red&&s.red.complete&&s.red.naturalWidth>0)return s.red;
  if(s.img&&s.img.complete&&s.img.naturalWidth>0)return s.img;
  return (side<0&&s.red)?s.red:s.img;
}
const SPRITE_MATERIALS=new Map();
function materialSprite(img,name,side,w,effect=''){
  if(typeof document.createElement!=='function')return img;
  const key=name+':'+side+':'+w+':'+effect;
  if(SPRITE_MATERIALS.has(key))return SPRITE_MATERIALS.get(key);
  const surface=document.createElement('canvas');
  surface.width=Math.ceil(w*2);surface.height=Math.ceil(surface.width*img.height/img.width);
  const ctx=surface.getContext('2d');
  ctx.filter=side<0?'saturate(.48) brightness(.9)':'saturate(.78) brightness(.98)';
  if(effect==='hit')ctx.filter+=' brightness(2.4)';
  if(effect==='wreck')ctx.filter+=' grayscale(1) brightness(.35)';
  ctx.drawImage(img,0,0,surface.width,surface.height);
  if(SPRITE_MATERIALS.size>=64)SPRITE_MATERIALS.delete(SPRITE_MATERIALS.keys().next().value);
  SPRITE_MATERIALS.set(key,surface);return surface;
}
function drawSprite(name,side,px,py,w,flip,rot,bottom,effect=''){
  const img=sprImg(name,side);
  if(!img||!img.complete||!img.width)return;
  const h=w*img.height/img.width;
  cx.save();cx.translate(px,py);
  if(rot)cx.rotate(rot);
  if(flip)cx.scale(-1,1);
  cx.drawImage(materialSprite(img,name,side,w,effect),-w/2,bottom?-h:-h/2,w,h);
  cx.restore();
}

// ============================================================ AUDIO
let AC=null,NOISE=null,AUDIO_MUTED=false;
const ROTOR_AUDIO=[];let AUDIO_BUS=null;
function ac(){
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    NOISE=AC.createBuffer(1,AC.sampleRate*1,AC.sampleRate);
    const d=NOISE.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  if(AC.state==='suspended'&&typeof AC.startRendering!=='function')AC.resume();
  return AC;
}
function toggleAudio(){
  AUDIO_MUTED=!AUDIO_MUTED;saveProgress();
  syncAudioBus();
  if(!AUDIO_MUTED)SFX.blip();
}
function soundPerspective(x){
  if(x===undefined)return {gain:1,pan:0,cutoff:8000};
  const distance=Math.abs(x-(G.camX+W/2));
  return {gain:1/(1+(distance/520)**2),pan:clamp((x-G.camX-W/2)/(W*.6),-1,1),cutoff:8000/(1+distance/900)};
}
function audioBus(a){
  if(!AUDIO_BUS){
    const input=a.createDynamicsCompressor(),output=a.createGain();
    input.threshold.value=-16;input.knee.value=18;input.ratio.value=5;input.attack.value=.003;input.release.value=.18;
    input.connect(output).connect(a.destination);AUDIO_BUS={input,output};syncAudioBus();
  }
  return AUDIO_BUS.input;
}
function syncAudioBus(){
  if(!AUDIO_BUS)return;
  const quiet=AUDIO_MUTED||document.hidden||G?.paused||!!G?.replay;
  AUDIO_BUS.output.gain.cancelScheduledValues(AC.currentTime);
  AUDIO_BUS.output.gain.setValueAtTime(quiet?0:.8,AC.currentTime);
}
function audioRoute(a,x){
  const mix=soundPerspective(x),pan=a.createStereoPanner();pan.pan.value=mix.pan;
  pan.connect(audioBus(a));return {pan,mix};
}
function tone(f0,f1,dur,type,vol,x){
  if(AUDIO_MUTED)return;
  try{
    const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type;o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    const route=audioRoute(a,x);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*route.mix.gain,t+.003);
    g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g).connect(route.pan);o.onended=()=>{o.disconnect();g.disconnect();route.pan.disconnect();};o.start(t);o.stop(t+dur);
  }catch(e){}
}
function noise(dur,f,vol,x){
  if(AUDIO_MUTED)return;
  try{
    const a=ac(),s=a.createBufferSource(),g=a.createGain(),fl=a.createBiquadFilter(),t=a.currentTime;
    s.buffer=NOISE;s.loop=true;fl.type='lowpass';const route=audioRoute(a,x);fl.frequency.value=Math.min(f,route.mix.cutoff);
    g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol*route.mix.gain,t+.003);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    s.connect(fl).connect(g).connect(route.pan);s.onended=()=>{s.disconnect();fl.disconnect();g.disconnect();route.pan.disconnect();};s.start(t);s.stop(t+dur);
  }catch(e){}
}
const SFX={
  gun(x,kind='heli'){const rifle=kind==='rifle';noise(rifle?.1:.065,rifle?5200:3200,rifle?.07:.045,x);tone(rifle?180:100,45,.09,'triangle',.045,x);},
  cannon(x){noise(.16,2600,.16,x);noise(.65,420,.12,x);tone(85,24,.5,'sine',.2,x);},
  chute(x){noise(.45,1700,.045,x);},
  boom(big,x){noise(.08,4200,big?.14:.08,x);noise(big?1.1:.55,big?650:1000,big?.22:.12,x);tone(big?65:100,22,big?.85:.4,'sine',big?.2:.1,x);},
  missile(x){noise(.7,2200,.09,x);tone(160,65,.3,'triangle',.025,x);},
  blip(){tone(600,900,.09,'square',.08);},
  cash(){tone(900,1400,.07,'square',.06);setTimeout(()=>tone(1200,1600,.07,'square',.06),70);},
  deny(){tone(200,90,.15,'square',.09);},
  cable(){noise(.5,3000,.25);tone(800,100,.4,'sawtooth',.15);},
  alarm(){for(let i=0;i<3;i++){setTimeout(()=>tone(750,750,.14,'square',.12),i*300);setTimeout(()=>tone(520,520,.14,'square',.12),i*300+150);}},
  caution(){tone(920,540,.09,'sawtooth',.08);setTimeout(()=>tone(920,540,.09,'sawtooth',.08),120);},
  cap(){[440,550,660,880].forEach((f,i)=>setTimeout(()=>tone(f,f,.1,'square',.08),i*90));},
};

// Two reusable rotor beds; amplitude modulation supplies blade pulses without per-frame voices.
function updateRotorAudio(){
  if(!AC)return;
  syncAudioBus();
  const active=!AUDIO_MUTED&&G.state==='play'&&!G.paused&&!document.hidden;
  if(active&&ROTOR_AUDIO.length===0){
    try{
      for(let i=0;i<2;i++){
        const source=AC.createBufferSource(),filter=AC.createBiquadFilter(),pulse=AC.createOscillator(),depth=AC.createGain(),amp=AC.createGain(),level=AC.createGain(),pan=AC.createStereoPanner();
        source.buffer=NOISE;source.loop=true;filter.type='lowpass';filter.frequency.value=280;
        amp.gain.value=.65;depth.gain.value=.35;pulse.type='sine';pulse.frequency.value=18;level.gain.value=0;
        pulse.connect(depth).connect(amp.gain);source.connect(filter).connect(amp).connect(level).connect(pan).connect(audioBus(AC));
        source.start();pulse.start();ROTOR_AUDIO.push({source,filter,pulse,level,pan});
      }
    }catch(e){return;}
  }
  ROTOR_AUDIO.forEach((rig,i)=>{
    const h=G.helis[i],rpm=h?.rotorSpeed??1,mix=soundPerspective(h?.x);
    const gain=active&&h&&!h.dead?.085*mix.gain*rpm:0,t=AC.currentTime;
    rig.level.gain.setTargetAtTime(gain,t,.06);
    rig.pan.pan.setTargetAtTime(mix.pan,t,.08);
    rig.pulse.frequency.setTargetAtTime(8+rpm*13,t,.1);
    rig.filter.frequency.setTargetAtTime(180+rpm*350,t,.1);
  });
}

// ============================================================ STATE
let G=null;
function newGame(){
  if(typeof TOUCH!=='undefined'&&TOUCH.reset)TOUCH.reset();
  G={
    state:'menu',paused:false,time:0,anim:0,
    funds:DIFFICULTIES[SETTINGS.difficulty].funds,eFunds:300,ecoT:0,aiT:4,
    difficulty:SETTINGS.difficulty,aiAccum:0,tutorial:null,damageEdges:{left:0,right:0,top:0,bottom:0},vanAlertLevel:0,
    lives:3,score:0,kills:0,
    helis:[mkHeli(1),mkHeli(-1)],
    units:[],bullets:[],shells:[],bombs:[],missiles:[],flares:[],decals:[],
    turrets:[1300,2900,4550,6100,7700].map(x=>({x,y:GROUND-22,type:'TURRET',side:0,hp:0,maxhp:100,cd:0})),paratroopers:[],canopies:[],
    parts:[],msgs:[],wrecks:[],bombAiming:false,
    bunkers:BUNKER_XS.map(x=>({
      x,y:GROUND-20,type:'BUNKER',owner:-1,side:-1,hp:90,maxhp:90,garrison:3,cd:2,capPulse:0,
      balloonHp:40,balloonMax:40,balloonDead:false,balloonRespawn:0,
      cableHp:30,cableBroken:false
    })),
    camX:0,shake:0,flash:0,endMsg:'',
    stats:{deployed:{ENG:0,INF:0,TANK:0,AA:0,VAN:0},kills:0,bunkersCap:0,helisLost:0,cablesSevered:0},
    cableWarning:0,
    cautionTimer:0,scanTimer:0,
    bannerAlert:null,
    spawnPings:[],
    buttons:[]
  };
  if(typeof initExperience==='function')initExperience(G);
}
function mkHeli(side){
  return{side,x:side>0?PLAYER_X+140:ENEMY_X-140,y:300,vx:0,vy:0,dir:side,
    hp:100,maxhp:100,dead:false,respawn:0,
    cdGun:0,cdBomb:0,cdMis:0,cableCd:0,
    bombs:8,mis:4,flares:3,cargo:0,cargoUnits:[],seed:Math.random()*10,
    aiT:0,fuel:100,reserve:RESERVE_SECONDS,washTimer:0,pitch:0,rotorPhase:0,rotorSpeed:1};
}

function enginePowered(h){return h.fuel>0||h.reserve>0;}
function difficulty(){return DIFFICULTIES[G.difficulty];}
function vanThreat(){
  let best=null;
  for(const van of G.units)if(van.side<0&&van.type==='VAN'){
    const seconds=Math.max(0,(van.x-(PLAYER_X+70))/UT.VAN.spd);
    if(!best||seconds<best.seconds)best={van,seconds,level:seconds<=15?2:seconds<=30?1:0};
  }
  return best;
}
function formatETA(seconds){const t=Math.ceil(seconds);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0');}
function startTutorial(){
  newGame();G.turrets=[];G.state='play';G.tutorial={step:0,bombed:false};G.difficulty='recruit';
  G.helis[1].dead=true;G.helis[1].respawn=1e9;
  G.bunkers=[{x:1100,owner:0,capPulse:0,balloonHp:40,balloonMax:40,balloonDead:true,
    balloonRespawn:1e9,cableHp:30,cableBroken:true}];
}
function restartMission(){if(G.tutorial?.advanced)startAcademy();else if(G.tutorial)startTutorial();else if(G.campaign!==null)startCampaign(G.campaign);else{newGame();G.state='play';}}
function tutorialHint(){
  if(!G.tutorial)return '';
  if(G.tutorial.advanced)return academyHint();
  return [
    TOUCH.active?'1/4 · Fly right to the training marker':'1/4 · Fly right past 500m using WASD / arrows',
    TOUCH.active?'2/4 · Hold BOMB, release to hit the ground':'2/4 · Hold B to aim, release to hit the ground',
    TOUCH.active?'3/4 · Hover low near troops; tap Board':'3/4 · Hover low near troops; press E to board',
    TOUCH.active?'4/4 · Drop troops at the marked bunker':'4/4 · Fly to the marked bunker; hover low and press E'
  ][G.tutorial.step];
}
function updateTutorial(){
  const t=G.tutorial,p=G.helis[0];if(!t||p.dead)return;
  if(t.advanced){updateAcademy();return;}
  if(t.step===0&&p.x>=500){t.step=1;t.bombed=false;SFX.blip();}
  else if(t.step===1&&t.bombed){
    t.step=2;
    for(let i=0;i<3;i++){const u=spawnUnit(1,'INF');u.x=clamp(p.x+(i-1)*20,60,WORLD-60);}
    SFX.blip();
  }else if(t.step===2&&p.cargo>=3){t.step=3;SFX.blip();}
  else if(t.step===3&&G.bunkers[0].owner===1)endGame(true,'TRAINING COMPLETE — READY FOR A COMBAT SORTIE');
}
function cableIsUrgent(b){
  const p=G.helis[0];return b.owner!==1&&!p.dead&&Math.abs(p.x-b.x)<200&&p.y>BALLOON_Y-30;
}

// ============================================================ INPUT & MOUSE
const TOUCH={active:false,x:0,y:0,fire:false,render:null,reset:null};
const keys={};
const mouse={x:-1,y:-1,down:false};
function getCanvasPos(e){
  const r=cv.getBoundingClientRect();
  return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};
}
cv.addEventListener('mousemove',e=>{const p=getCanvasPos(e);mouse.x=p.x;mouse.y=p.y;});
cv.addEventListener('mouseleave',()=>{mouse.x=-1;mouse.y=-1;mouse.down=false;});
cv.addEventListener('mousedown',e=>{ac();mouse.down=true;});
cv.addEventListener('mouseup',e=>{mouse.down=false;});
cv.addEventListener('click',e=>{ac();const p=getCanvasPos(e);handleCanvasClick(p.x,p.y);});

addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code)||(e.code==='Tab'&&G.state==='play'&&!G.paused&&!TOUCH.active))e.preventDefault();
  if(!keys[e.code])onKey(e.code);
  keys[e.code]=true;
});
addEventListener('keyup',e=>onKeyUp(e.code));
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')G.paused=true;syncAudioBus();});
addEventListener('blur',()=>{
  for(const key in keys)keys[key]=false;
  mouse.down=false;
  if(TOUCH.reset)TOUCH.reset();
  if(G){G.bombAiming=false;if(G.state==='play')G.paused=true;}
  syncAudioBus();
});

function onKey(code){
  ac();
  if(G.replay){if(code==='Escape'||code==='KeyR')stopReplay();if(code==='Space')toggleReplaySpeed();if(code==='KeyF')toggleReplayFocus();return;}
  if(G.state==='menu'&&code==='KeyU'){resumeCampaign();return;}
  if(G.state==='menu'&&code==='KeyY'){startAcademy();return;}
  if(G.state==='menu'&&code==='KeyC'){startCampaign();return;}
  if(['win','over'].includes(G.state)&&code==='KeyR'){startReplay();return;}
  if(G.state==='menu'&&code==='KeyT'){startTutorial();return;}
  if(G.state==='menu'&&['Digit1','Digit2','Digit3'].includes(code)){setDifficulty(['recruit','normal','veteran'][Number(code.slice(-1))-1]);return;}
  if(code==='Enter'){
    if(G.state==='menu'||G.state==='over'||G.state==='win'){nextSortie();SFX.blip();}
    return;
  }
  if(code==='KeyP'&&G.state==='play'){if(TOUCH.reset)TOUCH.reset();G.paused=!G.paused;G.bombAiming=false;return;}
  if(G.state!=='play'||G.paused)return;
  const p=G.helis[0];
  if(code==='Tab'&&!TOUCH.active)cycleGroup();
  if(code==='KeyJ')bailout();
  if(code==='KeyZ')setOrder('advance');
  if(code==='KeyX')setOrder('hold');
  if(code==='KeyV')setOrder('rally');
  if(code==='KeyQ')cycleCargo();
  if(code==='KeyF'&&p.cargo)troopTransfer(p,true);
  if(code==='Digit1')buy(1,'INF');
  if(code==='Digit2')buy(1,'TANK');
  if(code==='Digit3')buy(1,'AA');
  if(code==='Digit4')buy(1,'VAN');
  if(code==='Digit5')buy(1,'ENG');
  if(p&&!p.dead&&code==='KeyE')troopTransfer(p);
  if(p&&!p.dead&&code==='KeyC'){
    if(p.flares>=1){
      p.flares--;
      for(let i=0;i<3;i++)
        G.flares.push({x:p.x,y:p.y+8,vx:-p.dir*rnd(130,230)+rnd(-40,40),vy:rnd(30,110),life:2.2});
      noise(.5,3000,.12);tone(1400,400,.3,'sawtooth',.05);
      msg('FLARES DEPLOYED!','#ffd97a','routine');
    }else SFX.deny();
  }
  if(code==='Escape'){G.bombAiming=false;return;}
  if(p&&!p.dead&&code==='KeyB'){
    G.bombAiming=p.bombs>=1;
    if(!G.bombAiming)SFX.deny();
  }
  if(p&&!p.dead&&code==='KeyM'&&p.cdMis<=0){
    const t=nearestAirTarget(p.x,p.y,1,1600)||nearestGroundTarget(p.x,p.y,1,1600);
    if(p.mis>=1&&t){p.mis--;p.cdMis=1.1;
      G.missiles.push(mkMissile(p.x+p.dir*20,p.y,t,1));SFX.missile(p.x);
    }else SFX.deny();
  }
}

function onKeyUp(code){
  keys[code]=false;
  if(code!=='KeyB')return;
  const armed=G.bombAiming;G.bombAiming=false;
  const p=G.helis[0];
  if(!armed||G.state!=='play'||G.paused||!p||p.dead)return;
  if(p.cdBomb>0||p.bombs<1){SFX.deny();return;}
  p.bombs--;p.cdBomb=.7;G.bombs.push(bombFromHeli(p));SFX.blip();
}
function bombFromHeli(h){
  return {x:h.x,y:h.y+12,vx:h.vx*.85+h.dir*40,vy:h.vy+40,side:h.side,wind:windAt(G.time)};
}
// Closed-form ballistic motion is shared by live bombs and the ground estimate.
function bombGroundTime(b){
  const height=Math.max(0,GROUND-6-b.y);
  return height===0?0:(-b.vy+Math.sqrt(b.vy*b.vy+2*BOMB_GRAVITY*height))/BOMB_GRAVITY;
}
function bombPosition(b,t){
  return {x:b.x+(b.wind||0)*t+(b.vx-(b.wind||0))*(1-Math.exp(-BOMB_DRAG*t))/BOMB_DRAG,
    y:b.y+b.vy*t+.5*BOMB_GRAVITY*t*t};
}
function stepBomb(b,dt){
  const t=Math.min(dt,bombGroundTime(b)),pos=bombPosition(b,t);
  b.x=pos.x;b.y=pos.y;b.vy+=BOMB_GRAVITY*t;b.vx=(b.wind||0)+(b.vx-(b.wind||0))*Math.exp(-BOMB_DRAG*t);
  return t<dt||b.y>=GROUND-6-.001;
}
function forwardPadX(b){return b.x+110;}
function serviceAt(h){
  if(h.dead||h.y<=GROUND-72)return null;
  const bx=h.side>0?PLAYER_X:ENEMY_X;
  if(Math.abs(h.x-bx)<230)return {kind:'hq',x:bx};
  if(Math.abs(h.vx)>60||Math.abs(h.vy)>45)return null;
  const b=G.bunkers.find(b=>b.owner===h.side&&Math.abs(h.x-forwardPadX(b))<65);
  return b?{kind:'forward',x:forwardPadX(b)}:null;
}
function terrainAt(x){
  // Explicit world-anchored patches drive both ground rendering and effects.
  return hash(Math.floor(clamp(x,0,WORLD)/320)+71)>.48?'grass':'dirt';
}
function windAt(time){return environmentWind(time);}
function emitGroundWash(x,strength){
  const grass=terrainAt(x)==='grass',wet=G.environment?.weather==='rain';
  for(const dir of [-1,1])G.parts.push({x:x+dir*rnd(12,38),y:GROUND-rnd(2,9),
    vx:dir*rnd(50,120)*strength,vy:rnd(-24,-8),life:rnd(.35,.65),
    c:wet?'#a2b6b8':grass?'#8a9160':'#998975',s:wet?rnd(.7,1.5):grass?rnd(1,2):rnd(2,5),g:grass?.2:-.03,
    grow:wet||grass?0:8,wind:grass?.8:.6,streak:wet||grass});
}

// ============================================================ SPAWNING / ECONOMY
function buy(side,type){
  if(G.tutorial){if(side===1)msg('TRAINING: USE THE PROVIDED TROOPS','#ffd97a');return;}
  const st=UT[type],f=side>0?'funds':'eFunds';
  if(type==='VAN'&&G.units.some(u=>u.side===side&&u.type==='VAN')){
    if(side>0){SFX.deny();msg('DEMO VAN ALREADY ACTIVE (1 MAX)','#ffb84d');}
    return;
  }
  if(G[f]<st.cost){
    if(side>0){SFX.deny();msg('INSUFFICIENT FUNDS ($'+(st.cost-G[f])+' NEEDED)','#ffb84d');}
    return;
  }
  G[f]-=st.cost;
  if(side>0){
    SFX.cash();
    G.stats.deployed[type]++;
    G.spawnPings.push({type,time:2.5,x:PLAYER_X+40});
    msg(type+' DEPLOYED FROM HQ','#8dff8d','routine');
  }
  spawnUnit(side,type);
}
function spawnUnit(side,type){
  const st=UT[type];
  let x=side>0?PLAYER_X+40:ENEMY_X-40,dir=side;
  let guard=0;
  while(guard++<80&&G.units.some(u=>u.side===side&&Math.abs(u.x-x)<st.w+18))x+=side*(st.w+18);
  x=clamp(x,70,WORLD-70);
  const u={type,side,x,dir,hp:st.hp,maxhp:st.hp,cd:rnd(.2,.8),phase:Math.random()*6,flash:0,aiReleased:side===1||type==='ENG'};
  G.units.push(u);
  return u;
}
function boardTroop(p,u){
  if(p.cargo>=4||!G.units.includes(u))return false;
  if(!p.cargoUnits)p.cargoUnits=[];
  p.cargoUnits.push({type:u.type,hp:u.hp,rescue:!!u.rescue,pilot:!!u.pilot});p.cargo++;
  G.units.splice(G.units.indexOf(u),1);return true;
}
function autoBoardTroops(p,dt){
  if(p.y<GROUND-70)p.boardingInhibit=false;
  const landed=!p.dead&&p.y>=GROUND-28&&Math.abs(p.vx)<18&&Math.abs(p.vy)<12;
  if(!landed||p.boardingInhibit||p.cargo>=4){p.boardingTimer=0;return;}
  const near=G.units.filter(u=>['INF','ENG'].includes(u.type)&&u.side===p.side&&
    !(u.landing>0)&&Math.abs(u.x-p.x)<65&&(p.x-u.x)*u.side>=-15)
    .sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));
  if(!near.length){p.boardingTimer=0;return;}
  p.boardingTimer=(p.boardingTimer||0)+dt;
  while(p.boardingTimer>=.35&&near.length&&p.cargo<4){
    p.boardingTimer-=.35;boardTroop(p,near.shift());
  }
}
function troopTransfer(p,single=false){
  if(p.cargo>0){
    const air=p.y<GROUND-130, count=air||single?1:p.cargo;
    p.cargoUnits=cargoManifest(p);
    if(!air){p.boardingInhibit=true;p.boardingTimer=0;}
    for(let i=0;i<count;i++){
      const saved=p.cargoUnits.splice(clamp(G.selectedCargo,0,p.cargoUnits.length-1),1)[0],type=saved?saved.type:'INF';
      const u=spawnUnit(p.side,type);u.x=clamp(p.x+(i-(count-1)/2)*14,60,WORLD-60);
      if(saved){u.hp=saved.hp;u.rescue=!!saved.rescue;u.pilot=!!saved.pilot;}
      if(air){if(G.tutorial?.advanced&&type==='ENG')G.academyEvents.engineerDrop=true;G.units.splice(G.units.indexOf(u),1);u.y=p.y+20;u.vx=p.vx*.5;u.vy=Math.max(70,p.vy*.3);u.chuteAge=0;G.paratroopers.push(u);SFX.chute(p.x);}
    }
    p.cargo-=count;selectCargo(Math.min(G.selectedCargo,p.cargo-1));SFX.blip();
  }else{
    if(p.y<GROUND-130){SFX.deny();return;}
    const near=G.units.filter(u=>['INF','ENG'].includes(u.type)&&u.side===p.side&&Math.abs(u.x-p.x)<115)
      .sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x)).slice(0,4);
    if(!near.length){SFX.deny();return;}
    near.forEach(u=>boardTroop(p,u));SFX.blip();
  }
}
function radarJammed(side=1){
  const h=G.helis.find(h=>h.side===side);
  return !!h&&!h.dead&&G.units.some(u=>u.type==='VAN'&&u.side!==side&&Math.abs(u.x-h.x)<1100);
}
function emplacements(){return [...G.turrets,...G.bunkers.filter(b=>b.garrison>0)];}
function hurtEmplacement(t,d){
  impactEffect(t.x,t.y,'armor');
  t.hp=Math.max(0,t.hp-d);
  if(t.type==='BUNKER')t.garrison=Math.ceil(t.hp/30);
  if(t.hp===0){t.side=0;if(t.type==='BUNKER'){t.owner=0;t.balloonDead=true;t.cableBroken=true;}}
}
function hitEmplacement(x,y,side,d){
  const t=emplacements().find(t=>t.hp>0&&t.side!==side&&Math.abs(t.x-x)<UT[t.type].w/2&&Math.abs(y-t.y)<24);
  if(t){hurtEmplacement(t,d);return true;}return false;
}
function engineerWork(u,dt){
  const t=G.turrets.find(t=>Math.abs(t.x-u.x)<65&&(t.side!==u.side||t.hp<t.maxhp));
  if(t){
    if(t.side!==u.side){
      if(G.units.some(o=>o.side!==u.side&&Math.abs(o.x-t.x)<90)){u.work=0;return false;}
      u.work=(u.work||0)+dt;
      if(u.work>=3){t.side=u.side;t.hp=Math.max(30,t.hp);u.work=0;}
    }else t.hp=Math.min(t.maxhp,t.hp+20*dt);
    return true;
  }
  const b=G.bunkers.find(b=>b.owner===u.side&&b.garrison>0&&b.hp<90&&Math.abs(b.x-u.x)<65);
  if(b){b.hp=Math.min(90,b.hp+12*dt);b.garrison=Math.ceil(b.hp/30);return true;}
  u.work=0;return false;
}
function updateEmplacements(dt){
  for(const t of emplacements()){
    if(t.hp<=0||!t.side)continue;t.cd-=dt;
    const target=(t.type==='TURRET'?nearestAirTarget(t.x,t.y,t.side,650):null)||
      G.units.filter(u=>u.side!==t.side&&(t.type==='TURRET'||u.type!=='TANK'))
        .find(u=>Math.abs(u.x-t.x)<420);
    if(target)t.aim=Math.atan2((target.y||GROUND-10)-t.y,target.x-t.x);
    if(target&&t.cd<=0){
      t.cd=t.type==='TURRET'?.65:1.1;SFX.gun(t.x,'rifle');
      const dx=target.x-t.x,dy=(target.y||GROUND-10)-t.y,d=Math.hypot(dx,dy)||1;
      G.bullets.push({x:t.x,y:t.y,vx:dx/d*760,vy:dy/d*760,life:1,side:t.side,dmg:8});
    }
  }
  for(const u of [...G.paratroopers]){
    stepParatrooper(u,dt);
    if(u.y>=GROUND){
      G.canopies.push({x:u.x-u.vx*.2,side:u.side,life:7});if(G.canopies.length>24)G.canopies.shift();
      delete u.y;u.landing=.55;G.paratroopers.splice(G.paratroopers.indexOf(u),1);G.units.push(u);
    }
  }
  for(const c of G.canopies)c.life-=dt;G.canopies=G.canopies.filter(c=>c.life>0);
}
function parachuteInflation(age){return clamp((age-.25)/.75,0,1);}
function stepParatrooper(u,dt){
  // Small bounded integration steps keep canopy inflation and drag stable at different frame rates.
  for(let left=dt;left>1e-8;){
    const d=Math.min(left,1/120);left-=d;u.chuteAge=(u.chuteAge||0)+d;
    const inflation=parachuteInflation(u.chuteAge),drag=.2+inflation*4.2;
    u.vx=(u.vx||0)+(windAt(G.time)-(u.vx||0))*(1-Math.exp(-1.4*d));
    u.vy=((u.vy||0)+260*d)*Math.exp(-drag*d);
    u.x=clamp(u.x+u.vx*d,60,WORLD-60);u.y=Math.min(GROUND,u.y+u.vy*d);
    if(u.y>=GROUND)break;
  }

}
function drawEmplacements(){
  for(const t of G.turrets){
    const x=t.x-G.camX;if(!onScreen(t.x))continue;
    cx.fillStyle=t.hp>0?'#66716a':'#494b48';
    groundShadow(t.x,4,48);
    cx.fillRect(x-20,GROUND-10,40,10);cx.fillRect(x-12,GROUND-25,24,15);
    cx.fillStyle='#929381';cx.fillRect(x-12,GROUND-25,24,2);
    cx.fillStyle='#313931';cx.fillRect(x-8,GROUND-19,16,8);
    cx.fillStyle='#a5a58d';for(const dx of [-9,9])cx.fillRect(x+dx,GROUND-20,1,2);
    cx.fillStyle=t.hp>0?'#74786b':'#494b48';
    cx.save();cx.translate(x,GROUND-24);cx.rotate(t.hp>0?(t.aim??(t.side===-1?-2.6:-.55)):.35);cx.fillRect(0,-3,t.hp>0?30:17,6);cx.restore();
    if(t.hp<=0){cx.fillStyle='#494c43';cx.fillRect(x+17,GROUND-4,13,3);cx.fillRect(x-25,GROUND-3,7,3);}
    cx.fillStyle='#101820';cx.fillRect(x-20,GROUND-39,40,4);
    cx.fillStyle=t.side===1?'#72d7c0':t.side===-1?'#f48277':'#8b959e';cx.fillRect(x-20,GROUND-39,40*t.hp/t.maxhp,4);
  }
  for(const b of G.bunkers){
    const x=b.x-G.camX;if(!onScreen(b.x))continue;
    for(let i=0;i<3;i++){cx.fillStyle=i<(b.garrison||0)?(b.owner===1?'#72d7c0':'#f48277'):'#39434a';cx.fillRect(x-12+i*9,GROUND-48,6,4);}
    if(b.garrison){cx.fillStyle='#222b30';cx.fillRect(x-38,GROUND-23,76,5);}
  }
  for(const c of G.canopies){
    const x=c.x-G.camX;if(!onScreen(c.x))continue;
    cx.save();cx.globalAlpha=Math.min(1,c.life/2)*.6;cx.fillStyle='#777b60';
    const collapse=clamp((c.life-5.8)/1.2,0,1);
    cx.beginPath();cx.ellipse(x,GROUND+2,24,3+collapse*12,0,Math.PI,Math.PI*2);cx.closePath();cx.fill();
    cx.strokeStyle='#a1a18a';cx.lineWidth=.6;for(let i=-2;i<=2;i++){cx.beginPath();cx.moveTo(x+i*7,GROUND);cx.lineTo(x+i*9+3,GROUND+4);cx.stroke();}cx.restore();
  }
  for(const u of G.paratroopers)drawParatrooper(u);
}
function drawParatrooper(u){
  if(!onScreen(u.x))return;
  groundShadow(u.x,GROUND-u.y,24);
  const age=u.chuteAge??1,inflation=parachuteInflation(age);
  const sway=Math.sin(age*2.5+u.phase)*.065*inflation;
  const canopyX=-clamp(((u.vx||0)-windAt(G.time))*.09,-8,8);
  cx.save();cx.translate(u.x-G.camX,u.y);
  if(inflation>.02){
    const radius=27*Math.sqrt(inflation),top=-27-22*inflation,depth=17*inflation;
    const cloth=cx.createLinearGradient(-radius,top-depth,radius,top+5);
    cloth.addColorStop(0,'#b0ad90');cloth.addColorStop(.4,'#929575');cloth.addColorStop(1,'#4e5c46');
    cx.save();cx.translate(canopyX,0);cx.fillStyle=cloth;
    cx.beginPath();cx.moveTo(-radius,top);
    cx.bezierCurveTo(-radius,top-depth*1.1,radius,top-depth*1.1,radius,top);
    for(let i=2;i>=-3;i--){const x=i*radius/3;cx.quadraticCurveTo(x+radius/6,top+4,x,top+1);}
    cx.closePath();cx.fill();
    cx.lineWidth=.65;cx.strokeStyle='rgba(43,55,39,.45)';
    for(let i=-2;i<=2;i++){const x=i*radius/3;cx.beginPath();cx.moveTo(x*.3,top-depth*.79);cx.bezierCurveTo(x*.65,top-depth*.7,x,top-depth*.4,x,top+1);cx.stroke();}
    // Small apex vent and a reinforced skirt define a fabric canopy, not an umbrella.
    cx.fillStyle='#58654d';cx.beginPath();cx.ellipse(0,top-depth*.8,3,1,0,0,7);cx.fill();cx.restore();
    cx.strokeStyle='rgba(217,205,169,.8)';cx.lineWidth=.6;
    for(let i=-3;i<=3;i++){cx.beginPath();cx.moveTo(canopyX+i*radius/3,top+1);cx.lineTo(i<0?-4:4,-20);cx.stroke();}
  }else{
    // Deployment bag trails above the falling passenger before the canopy catches air.
    cx.strokeStyle='#a6a18c';cx.lineWidth=.7;cx.beginPath();cx.moveTo(1,-19);cx.lineTo(-4,-27-age*30);cx.stroke();
    cx.fillStyle='#687353';cx.fillRect(-7,-31-age*30,6,4);
  }
  cx.save();cx.translate(0,-17);cx.rotate(sway);
  // Suspended body: helmet, pack, shoulder risers, raised arms and bent knees.
  cx.fillStyle='#414e3a';cx.fillRect(-5,3,9,9);
  cx.fillStyle=u.side===1?'#7e8765':'#82725b';cx.fillRect(-3,2,6,9);
  cx.fillStyle='#b6a087';cx.fillRect(-2,-1,4,4);
  cx.fillStyle='#46553e';cx.beginPath();cx.ellipse(0,-2,3.3,2.6,0,Math.PI,Math.PI*2);cx.fill();
  cx.strokeStyle='#687654';cx.lineWidth=2.3;cx.lineCap='round';
  cx.beginPath();cx.moveTo(-3,4);cx.lineTo(-6,1);cx.lineTo(-5,-3);cx.moveTo(3,4);cx.lineTo(6,1);cx.lineTo(5,-3);
  cx.moveTo(-2,10);cx.lineTo(-4,14);cx.lineTo(-1,17);cx.moveTo(2,10);cx.lineTo(5,13);cx.lineTo(4,17);cx.stroke();
  cx.strokeStyle='#252b25';cx.lineWidth=2;cx.beginPath();cx.moveTo(-1,17);cx.lineTo(2,17);cx.moveTo(4,17);cx.lineTo(7,17);cx.stroke();
  cx.strokeStyle='#beb496';cx.lineWidth=.8;cx.beginPath();cx.moveTo(-3,2);cx.lineTo(2,10);cx.moveTo(3,2);cx.lineTo(-2,10);cx.moveTo(-4,8);cx.lineTo(4,8);cx.stroke();
  cx.strokeStyle='#2b322d';cx.lineWidth=1.5;cx.beginPath();cx.moveTo(4,5);cx.lineTo(6,13);cx.stroke();
  cx.restore();cx.restore();
}
function msg(text,color,kind='event'){G.msgs.unshift({text,color:color||'#fff',age:0,kind});if(G.msgs.length>4)G.msgs.pop();}

// ============================================================ COMBAT HELPERS
function mkMissile(x,y,target,side){
  return{x,y,vx:(side>0?1:-1)*160,vy:-60,side,target,life:6,trail:0};
}
function balloonY(b){return BALLOON_Y+Math.sin(G.anim*1.3+b.x)*5;}
function hitBalloon(x,y,side,dmg){
  for(const b of G.bunkers){
    if(b.balloonDead||b.owner===side)continue;
    const by=balloonY(b);
    if(Math.abs(x-b.x)<48&&Math.abs(y-by)<26){
      b.balloonHp-=dmg;
      G.parts.push({x,y,vx:rnd(-50,50),vy:rnd(-50,50),life:.3,c:'#ffb347',s:3,add:true});
      if(b.balloonHp<=0){
        b.balloonDead=true;b.balloonRespawn=35;b.cableBroken=true;
        explode(b.x,by,58,0,side);
        if(side>0){msg('ENEMY BALLOON DESTROYED!','#8dff8d');G.score+=75;}
        else msg('YOUR BALLOON WAS DESTROYED','#ff5548');
      }
      return true;
    }
  }
  return false;
}
function hitCable(x,y,side,dmg){
  for(const b of G.bunkers){
    if(b.balloonDead||b.cableBroken||b.owner===side)continue;
    const by=balloonY(b);
    if(Math.abs(x-b.x)<16&&y>by+20&&y<GROUND-40){
      b.cableHp-=dmg;
      G.parts.push({x,y,vx:rnd(-40,40),vy:rnd(-40,40),life:.25,c:'#ffe9a0',s:2,add:true,streak:true});
      if(b.cableHp<=0){
        b.cableBroken=true;
        explodeQuiet(b.x,y,22);
        SFX.cable();
        if(side>0){
          msg('ENEMY BARRAGE CABLE SEVERED!','#8dff8d');
          G.score+=40;
          if(G.stats)G.stats.cablesSevered=(G.stats.cablesSevered||0)+1;
        }else{
          msg('YOUR BARRAGE CABLE WAS SEVERED!','#ff5548');
        }
      }
      return true;
    }
  }
  return false;
}
function hitBalloonOrCable(x,y,side,dmg){
  return hitBalloon(x,y,side,dmg)||hitCable(x,y,side,dmg);
}
function nearestGroundTarget(x,y,side,maxD){
  let best=null,bd=maxD;
  for(const u of [...G.units,...emplacements().filter(t=>t.hp>0)])if(u.side!==side){
    const d=Math.hypot(u.x-x,(GROUND-UT[u.type].h/2)-y);if(d<bd){bd=d;best=u;}
  }
  return best;
}
function nearestAirTarget(x,y,side,maxD){
  let best=null,bd=maxD;
  for(const h of G.helis)if(!h.dead&&h.side!==side){
    const d=Math.hypot(h.x-x,h.y-y);if(d<bd){bd=d;best=h;}
  }
  return best;
}
function fireBullet(x,y,dir,side,dmg,spread){
  G.bullets.push({x,y,vx:dir*760+rnd(-spread,spread),vy:rnd(-14,14),life:1.2,side,dmg});
}
function explode(x,y,r,dmg,side){
  const big=r>60;
  if(dmg>0){SFX.boom(big,x);G.shake=Math.min(G.shake+(big?10:5),16);}
  G.flash=Math.max(G.flash,big?.2:.08);
  // white core flash
  G.parts.push({x,y,vx:0,vy:0,life:.16,c:'#fff',s:big?40:22,g:0,add:true,grow:big?260:150});
  // fireball blobs
  const nb=big?9:5;
  for(let i=0;i<nb;i++){
    G.parts.push({x:x+rnd(-r*.3,r*.3),y:y+rnd(-r*.25,r*.25),
      vx:rnd(-40,40),vy:rnd(-60,-10),life:rnd(.35,.6),c:i%2?'#ff8c2a':'#ffb347',
      s:rnd(6,13),g:-.1,add:true,grow:big?34:22});
  }
  // sparks
  for(let i=0;i<(big?14:8);i++){
    G.parts.push({x,y,vx:rnd(-1,1)*r*6,vy:rnd(-1.1,-.1)*r*5,life:rnd(.3,.6),
      c:'#ffe9a0',s:2,g:1.6,add:true,streak:true});
  }
  // rising smoke
  for(let i=0;i<(big?10:5);i++){
    G.parts.push({x:x+rnd(-r/2,r/2),y:y+rnd(-6,6),vx:rnd(-25,25),vy:rnd(-75,-25),
      life:rnd(1,1.9),c:i%2?'#4a4a4a':'#5c5c5c',s:rnd(7,13),g:-.16,grow:13,wind:1});
  }
  // shockwave
  G.parts.push({x,y,ring:true,r:8,vr:big?460:280,life:.34,c:'#ffd8a0'});
  // ground scorch
  if(y>GROUND-70){
    if(dmg>0)impactEffect(x,GROUND-5,'ground');
    G.decals.push({x,y:GROUND-1,r:r*1.15,life:60});
    if(G.decals.length>30)G.decals.shift();
  }
  if(dmg<=0)return;
  for(const u of [...G.paratroopers])if(u.side!==side&&Math.hypot(u.x-x,u.y-y)<r+12){
    u.hp-=dmg;if(u.hp<=0){downedParatrooper(u);G.paratroopers.splice(G.paratroopers.indexOf(u),1);}
  }
  for(const u of [...G.units]){
    if(u.side===side)continue;
    if(Math.abs(u.x-x)<r+UT[u.type].w/2&&Math.abs((GROUND-UT[u.type].h)-y)<r+30)
      hurtUnit(u,dmg);
  }
  for(const t of emplacements())if(t.hp>0&&t.side!==side&&Math.hypot(t.x-x,t.y-y)<r+30)hurtEmplacement(t,dmg);
  for(const h of G.helis){
    if(h.dead||h.side===side)continue;
    if(Math.hypot(h.x-x,h.y-y)<r+22)hurtHeli(h,dmg*.8,{x,y});
  }
}
function hurtUnit(u,d){
  if(!['INF','ENG'].includes(u.type))impactEffect(u.x,GROUND-12,'armor');
  u.hp-=d;u.flash=.12;
  if(u.hp<=0){
    killUnit(u);
  }
}
function killUnit(u){
  const i=G.units.indexOf(u);if(i>=0)G.units.splice(i,1);
  if(u.side<0){G.kills++;if(G.stats)G.stats.kills++;G.score+=UT[u.type].cost;}
  if(u.side===1&&!['INF','ENG'].includes(u.type))G.stats.convoyLost++;
  if(['INF','ENG'].includes(u.type)){G.casualties.push({x:u.x,side:u.side,life:9});if(G.casualties.length>30)G.casualties.shift();}
  else explodeQuiet(u.x,GROUND-10,44);
  if(!['INF','ENG'].includes(u.type)){
    G.wrecks.push({x:u.x,type:u.type,side:u.side,life:75,smokeT:0});
    if(G.wrecks.length>24)G.wrecks.shift();
  }
}
function explodeQuiet(x,y,r){
  for(let i=0;i<12;i++)
    G.parts.push({x,y,vx:rnd(-r*3,r*3),vy:rnd(-r*3,0),life:rnd(.25,.6),
      c:i%2?'#ffb347':'#ff5533',s:rnd(2,5),g:.6,add:i%2===0});
  for(let i=0;i<5;i++)
    G.parts.push({x:x+rnd(-8,8),y,vx:rnd(-25,25),vy:rnd(-60,-15),life:rnd(.6,1.1),c:'#555',s:rnd(4,8),g:-.12,wind:1});
  G.parts.push({x,y,ring:true,r:6,vr:240,life:.26,c:'#ffd8a0'});
}
function hurtHeli(h,d,source){
  if(h.dead)return;
  if(h.side===1&&source){
    if(source.cause!=='Fuel exhaustion'&&source.cause!=='Hard landing')d*=difficulty().damage;
    const dx=source.x-h.x,dy=source.y-h.y;
    const edge=Math.abs(dx)>=Math.abs(dy)?(dx<0?'left':'right'):(dy<0?'top':'bottom');
    G.damageEdges[edge]=.65;
  }
  h.hp-=d;
  G.parts.push({x:h.x+rnd(-10,10),y:h.y,vx:rnd(-60,60),vy:rnd(-60,60),life:.3,c:'#ffd070',s:3,g:0});
  if(h.hp<=0){
    h.dead=true;h.respawn=h.side>0?3.5:7;
    if(h.side===1)G.bombAiming=false;
    SFX.boom(true,h.x);G.shake=14;
    for(let i=0;i<34;i++)
      G.parts.push({x:h.x,y:h.y,vx:rnd(-260,260),vy:rnd(-260,200),life:rnd(.4,1.1),
        c:['#ff5533','#ffb347','#ffd070'][i%3],s:rnd(2,6),g:.6,add:true});
    for(let i=0;i<12;i++)
      G.parts.push({x:h.x+rnd(-20,20),y:h.y,vx:rnd(-60,60),vy:rnd(-90,-20),life:rnd(.8,1.5),c:'#555',s:rnd(6,11),g:-.12});
    G.parts.push({x:h.x,y:h.y,vx:0,vy:0,life:.4,c:'#fff',s:48,g:0,add:true});
    G.parts.push({x:h.x,y:h.y,ring:true,r:10,vr:460,life:.35,c:'#ffd8a0'});
    if(h.side>0){
      G.stats.lastLoss=source?.cause||'Enemy fire / collision';
      G.lives--;
      if(G.stats)G.stats.helisLost++;
      if(G.lives>0)msg('HELICOPTER DOWN — '+G.lives+' REMAINING','#ff5548');
    }
  }
}

// ============================================================ UPDATE
function update(dt){
  G.time+=dt;
  for(const edge in G.damageEdges)G.damageEdges[edge]=Math.max(0,G.damageEdges[edge]-dt);
  // economy
  G.ecoT+=dt;
  if(G.ecoT>=3){
    G.ecoT-=3;
    G.funds+=25;
    G.eFunds+=Math.round(difficulty().income*(1+G.time/300));
    G.score+=2;
  }
  // shake decay
  G.shake*=Math.pow(.02,dt);

  // banner alert timer
  if(G.bannerAlert){
    G.bannerAlert.timer-=dt;
    if(G.bannerAlert.timer<=0)G.bannerAlert=null;
  }
  // spawn pings
  for(let i=G.spawnPings.length-1;i>=0;i--){
    G.spawnPings[i].time-=dt;
    if(G.spawnPings[i].time<=0)G.spawnPings.splice(i,1);
  }

  // helis
  for(const h of G.helis){
    h.cdGun-=dt;h.cdBomb-=dt;h.cdMis-=dt;h.cableCd-=dt;
    if(h.dead){
      h.respawn-=dt;
      if(h.respawn<=0){
        if(h.side>0&&G.lives<=0)continue;
        if(h.side===1&&G.tutorial){restartMission();return;}
        Object.assign(h,{dead:false,hp:h.maxhp,x:h.side>0?PLAYER_X+140:ENEMY_X-140,
          y:300,vx:0,vy:0,bombs:8,mis:4,flares:3,cargo:0,cargoUnits:[],boardingInhibit:false,boardingTimer:0,pitch:0,rotorPhase:0,rotorSpeed:1,fuel:100,reserve:RESERVE_SECONDS,rearming:false,service:null,cdGun:0,cdBomb:0,cdMis:0});
      }
      continue;
    }
    if(h.side>0)updatePlayerHeli(h,dt);
    else updateEnemyHeli(h,dt);
    // physics common
    applyWind(h,dt);
    h.vy+=60*dt;
    h.vx*=Math.exp(-2.1*dt);h.vy*=Math.exp(-1.6*dt);
    h.x=clamp(h.x+h.vx*dt,30,G.tutorial&&h.side===1?1500:WORLD-30);
    const wasAirborne=h.y<GROUND-23;
    h.y+=h.vy*dt;
    if(h.y>GROUND-22){if(wasAirborne)landingImpact(h,h.vy);h.y=GROUND-22;h.vy=0;h.vx*=.6;}
    h.settle=Math.max(0,(h.settle||0)-dt*2);
    if(h.dead)continue;
    if(h.y<54){h.y=54;h.vy=Math.max(h.vy,0);}
    // Friendly captured pads trade slower service and a hull cap for forward access.
    const service=serviceAt(h);
    h.service=service?service.kind:null;h.rearming=!!service;
    if(service){
      const forward=service.kind==='forward';
      h.fuel=Math.min(100,h.fuel+(forward?5:12)*dt);
      if(h.fuel>=20)h.reserve=RESERVE_SECONDS;
      const limit=h.maxhp*(forward?FORWARD_HP:1);
      if(h.hp<limit)h.hp=Math.min(limit,h.hp+(forward?4:14)*dt);
      if(!forward){
        h.bombs=Math.min(8,h.bombs+2.5*dt);
        h.mis=Math.min(4,h.mis+1.2*dt);
        h.flares=Math.min(3,h.flares+dt);
      }
    }else if(h.side===1){
      h.fuel=Math.max(0,h.fuel-FUEL_BURN*(1+Math.abs(h.vx)/430)*dt);
      if(h.fuel<=0)h.reserve=Math.max(0,h.reserve-dt);
    }
    if(h.side===1)autoBoardTroops(h,dt);
    updateAirframe(h,dt);
    h.washTimer-=dt;
    if(h.y>GROUND-110&&enginePowered(h)&&h.washTimer<=0){
      h.washTimer=.065;emitGroundWash(h.x,1-(GROUND-h.y)/130);
    }
    // Damage smoke is emitted by simulation, so pause does not accumulate particles.
    if(h.hp<h.maxhp*.4&&Math.random()<dt*15)
      G.parts.push({x:h.x+rnd(-16,10),y:h.y+rnd(-6,6),vx:-h.vx*.15+rnd(-15,15),vy:rnd(-40,-10),
        life:rnd(.5,.9),c:'#555',s:rnd(3,6),g:-.15,wind:1});
    if(h.side===1&&!enginePowered(h)&&!h.rearming&&h.y>=GROUND-22){
      msg('FORCED LANDING — HELICOPTER LOST','#ffb84d');hurtHeli(h,h.maxhp,{x:h.x,y:GROUND,cause:'Fuel exhaustion'});
      continue;
    }
    // balloon cables (only if balloon alive and cable intact)
    for(const b of G.bunkers){
      if(b.owner===h.side||b.balloonDead||b.cableBroken)continue;
      if(h.cableCd<=0&&heliCableHit(h,b)){
        hurtHeli(h,65,{x:b.x,y:h.y,cause:'Cable strike'});h.cableCd=1.2;
        h.vy=-240;h.vx=(h.x<b.x?-1:1)*300;
        SFX.cable();msg(h.side>0?'CABLE STRIKE!':'ENEMY HIT YOUR CABLE!',h.side>0?'#ff5548':'#4db2ff');
      }
    }
  }

  // cable proximity hazard alert for player
  const p=G.helis[0];
  let nearCable=false;
  if(p&&!p.dead){
    for(const b of G.bunkers){
      if(b.owner!==1&&!b.balloonDead&&!b.cableBroken){
        if(Math.abs(p.x-b.x)<160&&p.y>BALLOON_Y-30&&p.y<GROUND-25){
          nearCable=true;break;
        }
      }
    }
  }
  if(nearCable){
    G.cableWarning=Math.min(1,G.cableWarning+dt*3.5);
    if(Math.floor(G.anim*3)!==Math.floor((G.anim-dt)*3)){
      tone(880,660,.06,'sawtooth',.035);
    }
  }else{
    G.cableWarning=Math.max(0,G.cableWarning-dt*2.5);
  }

  // master caution audio alert when hull is critical
  if(p&&!p.dead&&(p.hp<p.maxhp*.25||p.fuel<LOW_FUEL)){
    G.cautionTimer=(G.cautionTimer||0)+dt;
    if(G.cautionTimer>=1.0){
      G.cautionTimer=0;
      SFX.caution();
    }
  }else{G.cautionTimer=0.8;}

  updateEmplacements(dt);
  updateUnits(dt);
  updateProjectiles(dt);
  updateCapture(dt);
  updateTutorial();
  const threat=vanThreat();
  const level=threat?threat.level:0;
  if(level>G.vanAlertLevel)SFX.alarm();
  G.vanAlertLevel=level;

  // balloon respawns
  for(const b of G.bunkers){
    if(b.balloonDead&&b.owner!==0){
      b.balloonRespawn-=dt;
      if(b.balloonRespawn<=0){
        b.balloonDead=false;b.cableBroken=false;b.balloonHp=b.balloonMax;b.cableHp=30;
      }
    }
  }
  // flares
  for(let i=G.flares.length-1;i>=0;i--){
    const f=G.flares[i];
    f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=90*dt;f.vx*=Math.exp(-1.2*dt);
    f.life-=dt;
    if(Math.random()<.4)G.parts.push({x:f.x,y:f.y,vx:rnd(-10,10),vy:rnd(-10,10),life:.3,c:'#ffd070',s:2,add:true});
    if(f.life<=0||f.y>GROUND-4)G.flares.splice(i,1);
  }
  // decals fade
  for(let i=G.decals.length-1;i>=0;i--){
    G.decals[i].life-=dt;
    if(G.decals[i].life<=0)G.decals.splice(i,1);
  }
  G.flash=Math.max(0,G.flash-dt*1.4);

  for(let i=G.wrecks.length-1;i>=0;i--){
    const w=G.wrecks[i];w.life-=dt;w.smokeT-=dt;
    if(w.life<=0){G.wrecks.splice(i,1);continue;}
    if(w.life>55&&w.smokeT<=0){
      w.smokeT=.18;
      G.parts.push({x:w.x+rnd(-10,10),y:GROUND-8,vx:rnd(-4,4),vy:-22,
        life:2,c:'#484741',s:3,g:-.02,grow:6,wind:1});
    }
  }
  // Keep cosmetic work bounded on phones, without changing projectile simulation.
  if(TOUCH.active&&G.parts.length>180)G.parts.splice(0,G.parts.length-180);
  // particles
  for(let i=G.parts.length-1;i>=0;i--){
    const p=G.parts[i];p.life-=dt;
    p.x+=(p.vx+(p.wind||0)*windAt(G.time))*dt;p.y+=p.vy*dt;p.vy+=(p.g||0)*380*dt;
    if(p.grow)p.s+=p.grow*dt;
    if(p.life<=0)G.parts.splice(i,1);
  }
  // messages
  for(let i=G.msgs.length-1;i>=0;i--){
    G.msgs[i].age+=dt;
    if(G.msgs[i].age>3.2)G.msgs.splice(i,1);
  }
  for(const b of G.bunkers)b.capPulse=Math.max(0,b.capPulse-dt);

  // camera
  G.scanTimer=Math.max(0,G.scanTimer-dt);
  if(p&&G.scanTimer<=0){
    updateCamera(p,dt);
  }

  updateAtmosphere(dt);
  updateOperations(dt);
  const particleLimit=TOUCH.active?180:700;if(G.parts.length>particleLimit)G.parts.splice(0,G.parts.length-particleLimit);
  updateMission();
  if(G.state!=='play'&&G.state!=='menu')return;
  recordReplay(dt);
  // win / lose
  for(const u of G.units){
    if(u.type!=='VAN')continue;
    if(u.side>0&&u.x>ENEMY_X-70)return endGame(true,'YOUR DEMO VAN REACHED ENEMY HQ!');
    if(u.side<0&&u.x<PLAYER_X+70)return endGame(false,'ENEMY DEMO VAN REACHED YOUR HQ!');
  }
  if(G.lives<=0&&G.helis[0].dead&&G.helis[0].respawn<=0)endGame(false,'ALL HELICOPTERS LOST');
}
function endGame(win,why){
  if(G.state==='win'||G.state==='over')return;
  recordReplay(0,true);
  if(win){G.state='win';G.score+=500+SXP(G);}
  else{G.state='over';}
  SFX.boom(true);
  G.endMsg=why||'';
  if(G.campaign!==null&&win)saveCheckpoint(Math.min(2,G.campaign+1),G.campaign===2);
}
function SXP(g){return Math.max(0,600-Math.floor(g.time/2));}

// ---------- player heli
function updatePlayerHeli(h,dt){
  const power=enginePowered(h)?1:0;
  const A=430*power,LIFT=560*power;
  if(keys.KeyW||keys.KeyA||keys.KeyS||keys.KeyD||keys.ArrowUp||keys.ArrowDown||keys.ArrowLeft||keys.ArrowRight)G.scanTimer=0;
  if(keys.ArrowLeft||keys.KeyA){h.vx-=A*dt;h.dir=-1;}
  if(keys.ArrowRight||keys.KeyD){h.vx+=A*dt;h.dir=1;}
  if(keys.ArrowUp||keys.KeyW)h.vy-=LIFT*dt;
  if(keys.ArrowDown||keys.KeyS)h.vy+=430*dt;
  if(TOUCH.active){
    h.vx+=A*TOUCH.x*dt;
    if(Math.abs(TOUCH.x)>.12)h.dir=TOUCH.x<0?-1:1;
    // Counter gravity and damp drift when the stick is released; no lift without fuel.
    if(Math.abs(TOUCH.y)<.08)h.vy*=Math.exp(-3*dt);
    h.vy+=(TOUCH.y*(TOUCH.y<0?LIFT:430)-60*power)*dt;
    if(Math.abs(TOUCH.x)>.08||Math.abs(TOUCH.y)>.08)G.scanTimer=0;
  }
  if((keys.Space||TOUCH.fire)&&h.cdGun<=0){
    h.cdGun=GUN_CD;
    fireBullet(h.x+h.dir*32,h.y+3,h.dir,1,7,60);
    SFX.gun(h.x);
  }
}

// ---------- enemy heli AI
function updateEnemyHeli(h,dt){
  const p=G.helis[0];
  h.aiT-=dt;
  let engage=false,tx,ty;
  if(!p.dead&&Math.abs(p.x-h.x)<1350){
    engage=true;
    tx=p.x+(h.x<p.x?-230:230);
    ty=p.y-90;
  }else{
    // patrol near own frontmost unit
    let fx=ENEMY_X-500;
    for(const u of G.units)if(u.side<0)fx=Math.min(fx,u.x);
    tx=clamp(fx-300,ENEMY_X-2800,ENEMY_X-260);
    ty=250+Math.sin(G.anim*.6+h.seed)*70;
  }
  // avoid hostile balloons (player-owned bunkers) — only live ones
  for(const b of G.bunkers){
    if(b.owner===1&&!b.balloonDead&&Math.abs(h.x-b.x)<260)ty=Math.min(ty,168);
  }
  const dx=tx-h.x,dy=ty-h.y;
  h.vx+=clamp(dx*.9,-380,380)*dt;
  h.vy+=clamp(dy*1.6,-330,330)*dt;
  if(p&&!p.dead)h.dir=p.x<h.x?-1:1;
  if(!engage)h.dir=h.vx<0?-1:1;

  if(engage&&!p.dead){
    const adx=p.x-h.x,ady=p.y-h.y;
    if(Math.abs(adx)<720&&Math.abs(ady)<170&&h.cdGun<=0){
      h.cdGun=.16;
      fireBullet(h.x+h.dir*32,h.y+3,h.dir,-1,6,90);
      SFX.gun(h.x);
    }
    // bombs over player columns
    if(h.cdBomb<=0&&ady<-120&&Math.abs(adx)<60){
      h.cdBomb=2.6;
      G.bombs.push({x:h.x,y:h.y+12,vx:h.vx*.85,vy:40,side:-1});
    }
    if(h.cdMis<=0&&Math.random()<.5&&Math.abs(adx)>300){
      h.cdMis=rnd(6,9);
      G.missiles.push(mkMissile(h.x,h.y,p,-1));SFX.missile(h.x);
    }
  }
}

// ---------- ground units
function updateUnits(dt){
  const sorted=[...G.units].sort((a,b)=>a.x-b.x);
  for(const u of sorted){
    const st=UT[u.type];
    const previousX=u.x;u.moving=false;
    u.cd-=dt;u.flash=Math.max(0,u.flash-dt);u.fireFlash=Math.max(0,(u.fireFlash||0)-dt);
    if(u.landing>0){u.landing=Math.max(0,u.landing-dt);continue;}
    const command=commandMovement(u),dir=command.dir;
    if(u.type==='ENG'&&engineerWork(u,dt))continue;
    // targets
    const gt=nearestGroundTarget(u.x,GROUND,u.side,st.rng);
    const et=nearestAirTarget(u.x,GROUND-UT[u.type].h,u.side,st.rng+200);
    let moved=false;
    if(u.type==='AA'){
      if(et&&et.side!==u.side){
        if(Math.abs(et.x-u.x)<st.rng&&u.cd<=0){
          u.cd=st.cd;u.fireFlash=.12;
          G.missiles.push(mkMissile(u.x,GROUND-20,et,u.side));
          SFX.missile(u.x);
        }
      }else moved=true;
    }else if(u.type==='VAN'){
      moved=true;
    }else{
      if(gt&&Math.abs(gt.x-u.x)<st.rng){
        u.aimDir=Math.sign(gt.x-u.x)||dir;
        if(u.cd<=0){
          u.cd=st.cd;u.fireFlash=.12;
          if(u.type==='TANK'){
            const d=Math.sign(gt.x-u.x)||dir;
            G.shells.push({x:u.x+d*26,y:GROUND-22,vx:d*520,vy:-90,life:1.6,side:u.side,dmg:st.dmg});
            SFX.cannon(u.x);
          }else{
            fireBullet(u.x+dir*8,GROUND-13,gt.x>u.x?1:-1,u.side,st.dmg,50);
            SFX.gun(u.x,'rifle');
          }
        }
      }else moved=true;
    }
    if(!command.move||G.tutorial&&!G.tutorial.advanced&&G.tutorial.step<3)moved=false;
    if(moved){
      // spacing vs friend ahead
      let blocked=false;
      for(const o of sorted){
        if(o===u||o.side!==u.side||canPass(u,o))continue;
        const gap=(o.x-u.x)*dir;
        const need=(UT[o.type].w+st.w)/2+14;
        if(gap>0&&gap<need){blocked=true;break;}
      }
      if(!blocked){
        u.x=clamp(u.x+dir*(command.speed??st.spd)*dt,60,WORLD-60);
        if(!['INF','ENG'].includes(u.type)&&terrainAt(u.x)==='dirt'&&G.environment?.weather!=='rain'){
          u.dustT=(u.dustT||0)-dt;
          if(u.dustT<=0){u.dustT=.18;G.parts.push({x:u.x-dir*st.w/2,y:GROUND-3,
            vx:-dir*12,vy:-8,life:.7,c:'#8c7b64',s:2,g:0,grow:4,wind:.5});}
        }
      }
    }
    u.moving=Math.abs(u.x-previousX)>.001;if(u.moving)u.moveDir=dir;u.phase+=Math.abs(u.x-previousX)*.16;
    // van win check handled in main update
  }
}

// ---------- projectiles
function updateProjectiles(dt){
  // bullets
  for(let i=G.bullets.length-1;i>=0;i--){
    const b=G.bullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    let hit=false;
    for(const u of G.units){
      if(u.side===b.side)continue;
      if(Math.abs(b.x-u.x)<UT[u.type].w/2+3&&b.y>GROUND-UT[u.type].h-8&&b.y<GROUND+4){hurtUnit(u,b.dmg);hit=true;break;}
    }
    if(!hit)for(const h of G.helis){
      if(h.dead||h.side===b.side)continue;
      if(heliBodyHit(h,b.x,b.y,1)){hurtHeli(h,b.dmg,{x:b.x-b.vx*.15,y:b.y-b.vy*.15});hit=true;break;}
    }
    if(!hit)for(const u of G.paratroopers){
      if(u.side!==b.side&&Math.abs(b.x-u.x)<10&&Math.abs(b.y-u.y)<18){
        u.hp-=b.dmg;if(u.hp<=0){downedParatrooper(u);G.paratroopers.splice(G.paratroopers.indexOf(u),1);}hit=true;break;
      }
    }
    if(!hit)hit=hitEmplacement(b.x,b.y,b.side,b.dmg);
    if(!hit)hit=hitBalloonOrCable(b.x,b.y,b.side,b.dmg);
    if(!hit&&b.y>=GROUND){impactEffect(b.x,GROUND,'ground');hit=true;}
    if(hit||b.life<=0)G.bullets.splice(i,1);
  }
  // tank shells
  for(let i=G.shells.length-1;i>=0;i--){
    const s=G.shells[i];
    s.x+=s.vx*dt;s.y+=s.vy*dt;s.vy+=140*dt;s.life-=dt;
    let hit=false;
    for(const u of G.units){
      if(u.side===s.side)continue;
      if(Math.abs(s.x-u.x)<UT[u.type].w/2+6&&s.y>GROUND-UT[u.type].h-10&&s.y<GROUND+6){hit=true;break;}
    }
    for(const h of G.helis){
      if(hit)break;
      if(h.dead||h.side===s.side)continue;
      if(heliBodyHit(h,s.x,s.y,3)){hit=true;}
    }
    if(!hit)hit=hitEmplacement(s.x,s.y,s.side,0);
    if(!hit)hit=hitBalloonOrCable(s.x,s.y,s.side,s.dmg);
    if(hit||s.y>GROUND-4||s.life<=0){
      explode(s.x,Math.min(s.y,GROUND-6),46,s.dmg,s.side);
      G.shells.splice(i,1);
    }
  }
  // bombs
  for(let i=G.bombs.length-1;i>=0;i--){
    const b=G.bombs[i];
    const landed=stepBomb(b,dt);
    let hit=false;
    for(const u of G.units){
      if(u.side===b.side)continue;
      if(Math.abs(b.x-u.x)<UT[u.type].w/2+8&&b.y>GROUND-UT[u.type].h-12&&b.y<GROUND+6){hit=true;break;}
    }
    if(!hit)hit=hitBalloonOrCable(b.x,b.y,b.side,55);
    if(hit||landed){
      if(G.tutorial&&b.side===1)G.tutorial.bombed=true;
      explode(b.x,Math.min(b.y,GROUND-8),78,55,b.side);
      G.bombs.splice(i,1);
    }
  }
  // missiles
  for(let i=G.missiles.length-1;i>=0;i--){
    const m=G.missiles[i];
    m.life-=dt;m.trail-=dt;
    // flare decoys: missiles chasing a helicopter retarget to nearby flares
    if(m.target&&m.target.side!==undefined&&!G.units.includes(m.target)&&!m.target.dead){
      for(const f of G.flares){
        if(Math.hypot(f.x-m.target.x,f.y-m.target.y)<400){m.target=f;break;}
      }
    }
    const t=m.target;
    const gone=!t||(t.dead)||(!G.units.includes(t)&&!G.helis.includes(t)&&!G.flares.includes(t)&&!emplacements().includes(t))||!!t&&t.hp===0;
    if(gone)m.target=null;
    if(m.target){
      const dx=m.target.x-m.x,dy=(m.target.y||GROUND-10)-m.y;
      const d=Math.hypot(dx,dy)||1;
      const sp=Math.min(560,300+m.life*40);
      m.vx+= ((dx/d)*sp-m.vx)*Math.min(1,4.5*dt);
      m.vy+= ((dy/d)*sp-m.vy)*Math.min(1,4.5*dt);
      if(d<30){
        explode(m.x,m.y,58,48,m.side);
        if(G.units.includes(m.target))hurtUnit(m.target,20);
        else if(G.helis.includes(m.target))hurtHeli(m.target,20,{x:m.x,y:m.y});
        G.missiles.splice(i,1);continue;
      }
    }else m.vy+=200*dt;
    m.x+=m.vx*dt;m.y+=m.vy*dt;
    if(hitBalloonOrCable(m.x,m.y,m.side,48)){
      explode(m.x,m.y,50,0,m.side);
      G.missiles.splice(i,1);continue;
    }
    if(m.trail<=0){
      m.trail=.03;
      G.parts.push({x:m.x,y:m.y,vx:rnd(-20,20),vy:rnd(-20,20),life:.35,c:'#aab',s:2.5,g:0});
    }
    if(m.life<=0||m.y>GROUND-4){
      explode(m.x,Math.min(m.y,GROUND-8),50,40,m.side);
      G.missiles.splice(i,1);
    }
  }
}

// ---------- capture
function updateCapture(dt){
  for(const b of G.bunkers){
    const near=G.units.filter(u=>u.type==='INF'&&!u.rescue&&!u.pilot&&Math.abs(u.x-b.x)<70);
    if(b.garrison>0&&b.garrison<3){
      const recruit=near.find(u=>u.side===b.owner);
      if(recruit){b.hp=Math.min(90,b.hp+30);b.garrison=Math.ceil(b.hp/30);G.units.splice(G.units.indexOf(recruit),1);near.splice(near.indexOf(recruit),1);}
    }
    for(const side of [1,-1]){
      if(b.owner===side)continue;
      const cnt=near.filter(u=>u.side===side).length;
      if(cnt>=CAPTURE_N){
        b.owner=side;b.side=side;b.garrison=3;b.hp=90;b.maxhp=90;b.type='BUNKER';b.y=GROUND-20;b.cd=1;b.capPulse=1.2;
        b.balloonDead=false;b.cableBroken=false;b.balloonHp=b.balloonMax;b.cableHp=30;b.balloonRespawn=0;
        let removed=0;
        for(let i=G.units.length-1;i>=0&&removed<3;i--){
          const u=G.units[i];
          if(u.type==='INF'&&u.side===side&&Math.abs(u.x-b.x)<70){G.units.splice(i,1);removed++;}
        }
        if(side>0){
          msg('BUNKER CAPTURED — FRIENDLY BALLOON','#4db2ff');
          G.score+=150;
          if(G.stats)G.stats.bunkersCap++;
        }else{
          msg('BUNKER LOST TO ENEMY','#ff5548');
        }
        SFX.cap();
      }
    }
  }
}

// ---------- enemy commander
function aiDecide(){
  if(G.tutorial)return;
  const mine=G.units.filter(u=>u.side<0);
  const n=t=>mine.filter(u=>u.type===t).length;
  if(!n('ENG')&&G.time>20&&G.turrets.some(t=>t.side!==-1||t.hp<100))buy(-1,'ENG');
  else if(n('INF')<3)buy(-1,'INF');
  else if(!n('AA')&&Math.random()<.85)buy(-1,'AA');
  else if(n('TANK')<1+Math.floor(G.time/140))buy(-1,'TANK');
  else if(n('INF')<7)buy(-1,'INF');
  if((G.campaign===null||G.campaign===2)&&G.time>difficulty().vanTime&&!n('VAN')&&G.eFunds>=UT.VAN.cost){
    const escorts=n('TANK')+n('AA');
    if(escorts>=2){
      buy(-1,'VAN');
      G.bannerAlert={
        title:'⚠️ CRITICAL ALERT: ENEMY DEMO VAN INBOUND ⚠️',
        sub:'INTERCEPT BEFORE IT REACHES YOUR HOME BASE!',
        timer:8,level:'danger'
      };
      msg('⚠️ ENEMY VAN INBOUND — STOP IT!','#ff5548');
      SFX.alarm();
    }
  }
}

// Visual motion is integrated in simulation, so pausing freezes the airframe.
function updateAirframe(h,dt){
  const target=clamp(h.vx*.0011,-.23,.23);
  h.pitch=(h.pitch||0)+(target-(h.pitch||0))*(1-Math.exp(-4*dt));
  const rpm=enginePowered(h)?1:(h.y<GROUND-23?.48:0);
  h.rotorSpeed=(h.rotorSpeed??1)+(rpm-(h.rotorSpeed??1))*(1-Math.exp(-1.8*dt));
  h.rotorPhase=((h.rotorPhase||0)+h.rotorSpeed*38*dt)%(Math.PI*2);
}
function shadowGeometry(alt,width){
  alt=Math.max(0,alt);
  return {offset:-alt*.42,radius:width*.5+alt*.075,opacity:.34*Math.exp(-alt/360),height:4+alt*.025};
}
function groundShadow(wx,alt,width){
  const sh=shadowGeometry(alt,width),x=wx-G.camX+sh.offset;
  cx.save();cx.translate(x,GROUND+2);cx.scale(1,sh.height/sh.radius);
  const g=cx.createRadialGradient(0,0,0,0,0,sh.radius);
  g.addColorStop(0,'rgba(12,15,17,'+sh.opacity+')');g.addColorStop(.4,'rgba(12,15,17,'+sh.opacity*.65+')');g.addColorStop(1,'rgba(12,15,17,0)');
  cx.fillStyle=g;cx.fillRect(-sh.radius,-sh.radius,sh.radius*2,sh.radius*2);cx.restore();
}
function drawSky(){
  const g=cx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,'#566674');g.addColorStop(.55,'#afa79b');g.addColorStop(1,'#dbb38b');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
}
function drawBackdrop(){
  const img=SPR.backdrop;
  if(!img.complete||!img.width)return;
  const bw=W*1.35,bh=bw*img.height/img.width;
  const yOff=GROUND-bh+26,par=.12;
  const k0=Math.floor(G.camX*par/bw);
  for(let k=k0;k<=k0+2;k++){
    const x=k*bw-G.camX*par;
    if(x>W||x+bw<0)continue;
    const mir=k%2===1;
    cx.save();
    cx.translate(x+(mir?bw:0),yOff);
    cx.scale(mir?-1:1,1);
    cx.drawImage(img,0,0,bw,bh);
    cx.restore();
  }
  // atmospheric blend: night sky above, haze at horizon
  const g=cx.createLinearGradient(0,0,0,GROUND);
  g.addColorStop(0,'rgba(64,79,88,.22)');g.addColorStop(.45,'rgba(190,178,156,.08)');
  g.addColorStop(1,'rgba(80,81,67,.12)');
  cx.fillStyle=g;cx.fillRect(0,0,W,GROUND);
}
function drawHills(){
  // A translucent middle-distance ridge preserves detail in the photographic terrain.
  hillLayer(G.camX*.3,578,24,700,'rgba(72,75,66,.24)');
  const mist=cx.createLinearGradient(0,400,0,GROUND);
  mist.addColorStop(0,'rgba(204,193,172,0)');mist.addColorStop(.42,'rgba(204,193,172,.07)');mist.addColorStop(1,'rgba(204,193,172,0)');
  cx.fillStyle=mist;cx.fillRect(0,400,W,GROUND-400);
}
function hillLayer(off,base,amp,step,col){
  cx.fillStyle=col;
  cx.beginPath();cx.moveTo(0,H);
  for(let sx=0;sx<=W;sx+=16){
    const wx=(sx+off);
    const y=base-amp*(.6*Math.sin(wx/step)+.4*Math.sin(wx/(step*.37)+2));
    cx.lineTo(sx,y);
  }
  cx.lineTo(W,H);cx.closePath();cx.fill();
}
// Static world-anchored terrain tiles avoid rebuilding hundreds of stone paths per frame.
// Keys include touch detail; the bounded cache is independent of weather and mission state.
const TERRAIN_TILES=new Map();
function terrainTile(index,step){
  const key=index+':'+step;if(TERRAIN_TILES.has(key))return TERRAIN_TILES.get(key);
  const tile=document.createElement('canvas');tile.width=512;tile.height=H-GROUND+8;
  const ctx=tile.getContext('2d'),top=8,g=ctx.createLinearGradient(0,top,0,tile.height);
  g.addColorStop(0,'#645f4c');g.addColorStop(.24,'#595043');g.addColorStop(1,'#2e3029');
  ctx.fillStyle=g;ctx.fillRect(0,top,512,H-GROUND);
  for(let wx=index*512;wx<(index+1)*512;wx+=step){
    const x=wx-index*512,n=hash(wx+73),grass=terrainAt(wx)==='grass';
    ctx.fillStyle=grass?'#555c3e':'#72634f';ctx.fillRect(x,top-2-n*3,step,5+n*4);
    for(const lane of [14,29]){
      ctx.fillStyle='rgba(32,29,24,'+(.12+n*.2)+')';ctx.fillRect(x,top+lane+Math.sin(wx*.015)*1.3,step+1,2+n*2);
      ctx.fillStyle='rgba(178,156,122,.12)';ctx.fillRect(x,top+lane+4,step,1);
    }
    for(let j=0;j<4;j++){
      const q=hash(wx*3+j*129),y=top+7+q*88,r=.5+hash(wx+j*83)*2;
      ctx.fillStyle=q>.55?'rgba(177,161,132,.3)':'rgba(22,25,20,.32)';
      ctx.beginPath();ctx.ellipse(x+j*step/4,y,r*1.7,r*.5,0,0,7);ctx.fill();
    }
  }
  if(TERRAIN_TILES.size>=40)TERRAIN_TILES.delete(TERRAIN_TILES.keys().next().value);
  TERRAIN_TILES.set(key,tile);return tile;
}
function drawGround(){
  const step=TOUCH.active?16:8,start=Math.floor(G.camX/step)*step;
  if(typeof document.createElement==='function'){
    for(let i=Math.floor(G.camX/512);i<=(G.camX+W)/512;i++)cx.drawImage(terrainTile(i,step),i*512-G.camX,GROUND-8);
  }else{cx.fillStyle='#595043';cx.fillRect(0,GROUND,W,H-GROUND);}
  for(let wx=start;wx<G.camX+W+step;wx+=step){
    if(terrainAt(wx)!=='grass')continue;
    const x=wx-G.camX,n=hash(wx+73);
    let bend=Math.sin(G.time*1.4+wx*.1)*windAt(G.time)*.05;
    for(const h of G.helis)if(!h.dead&&enginePowered(h)&&h.y>GROUND-110&&Math.abs(h.x-wx)<100)
      bend+=Math.sign(wx-h.x)*(1-Math.abs(wx-h.x)/100)*8;
    cx.strokeStyle=n>.5?'#797b50':'#434d35';cx.lineWidth=.8;
    cx.beginPath();cx.moveTo(x,GROUND+3);cx.lineTo(x-2+bend,GROUND-3-n*7);
    cx.moveTo(x+3,GROUND+3);cx.lineTo(x+5+bend,GROUND-n*9);cx.stroke();
  }
}

function drawBunker(b){
  const x=b.x-G.camX;
  if(x<-180||x>W+180)return;

  const topDomeY = GROUND - 41;
  if(b.owner===1){
    const px=forwardPadX(b)-G.camX,p=G.helis[0];
    const active=!p.dead&&p.service==='forward'&&Math.abs(p.x-forwardPadX(b))<65;
    cx.save();cx.fillStyle='#303b38';cx.fillRect(px-48,GROUND-5,96,5);
    cx.strokeStyle=active?'#9affb9':'#6da992';cx.lineWidth=2;
    cx.beginPath();cx.ellipse(px,GROUND-7,40,9,0,0,Math.PI*2);cx.stroke();
    cx.font='bold 13px monospace';cx.textAlign='center';cx.fillStyle='#a9d6c0';
    cx.fillText('H',px,GROUND-10);
    drawWindsock(forwardPadX(b)+55);
    if(!active&&Math.abs(G.helis[0].x-forwardPadX(b))<220&&G.helis[0].y>GROUND-150){
      cx.font='bold 9px monospace';cx.fillText('FORWARD BASE • HOVER LOW',px,GROUND-46);
      cx.font='9px monospace';cx.fillStyle='#8aab9b';cx.fillText('FUEL + REPAIR / NO AMMO',px,GROUND-33);
    }
    for(const d of [-1,1]){cx.fillStyle=active?'#9affb9':'#547f6a';cx.fillRect(px+d*44-2,GROUND-10,4,4);}
    cx.restore();
  }

  // Cables: telegraphing & hazard styling
  if(b.balloonDead){
    // frayed stub where the cable snapped
    cx.strokeStyle='rgba(120,120,140,.6)';cx.lineWidth=1.5;
    cx.beginPath();cx.moveTo(x,topDomeY);cx.lineTo(x+6,GROUND-25);cx.stroke();
  }else if(b.cableBroken){
    // severed cable dangling with sparks
    const by=balloonY(b);
    const sway=Math.sin(G.anim*3.5+b.x)*10;
    cx.strokeStyle='rgba(255,90,70,.85)';cx.lineWidth=1.6;
    cx.beginPath();cx.moveTo(x,by+26);cx.lineTo(x+sway,by+90);cx.stroke();
    cx.beginPath();cx.moveTo(x,topDomeY);cx.lineTo(x-sway*.4,GROUND-70);cx.stroke();
    if(cableIsUrgent(b)&&!G.paused&&Math.random()<.1){
      G.parts.push({x:b.x+sway,y:by+90,vx:rnd(-15,15),vy:rnd(10,35),life:.2,c:'#ffe9a0',s:1.5,add:true});
    }
  }else{
    const by=balloonY(b);

    cx.strokeStyle=isEnemy?'#b1aea3':'#809994';
    cx.lineWidth=1.8;
    cx.beginPath();cx.moveTo(x,by+26);cx.lineTo(x,topDomeY);cx.stroke();

    // Blinking hazard strobe nodes along the cable
    const cableH=topDomeY-(by+26);
    const numNodes=Math.floor(cableH/44);
    for(let n=1;n<=numNodes;n++){
      const ny=(by+26)+n*44;

      cx.fillStyle=isEnemy?(urgent?(blink?'#ff3322':'#881c14'):'#bf8277'):'#508fbb';
      cx.fillRect(x-2.5,ny-2,5,4);
    }
  }

  // dome
  groundShadow(b.x,4,110);
  drawSprite('bunker',b.owner,x,GROUND,110,false,0,true);
  if(b.capPulse>0){
    cx.strokeStyle='rgba(255,255,255,'+b.capPulse+')';cx.lineWidth=3;
    cx.beginPath();cx.arc(x,GROUND-4,58+(1.2-b.capPulse)*40,Math.PI,0);cx.stroke();
  }

  // balloon (or respawn hint)
  if(b.balloonDead){

function drawUnit(u){
  const x=u.x-G.camX;
  if(x<-140||x>W+140)return;
  const st=UT[u.type],name=UNIT_SPR[u.type],cfg=SPR_CFG[name];
  groundShadow(u.x,5,st.w*1.4);
  // contact shadow
  cx.fillStyle='rgba(0,0,0,.4)';
  cx.beginPath();cx.ellipse(x,GROUND-2,st.w*.5,5,0,0,7);cx.fill();
  const foot=['INF','ENG'].includes(u.type),stride=u.moving?Math.sin(u.phase):0;
  const bob=foot?Math.abs(stride)*1.1:(u.moving?Math.sin(u.phase*2)*.5:0);
  const rot=foot?stride*.035:(u.moving?Math.sin(u.phase)*.012:0);
  const recoil=(u.fireFlash||0)/.12*(u.type==='TANK'?2:0);
  const kneel=(u.landing||u.work)?2:0;
  drawSprite(name,u.side,x-u.side*recoil,GROUND-bob+kneel,st.w,(u.moving?(u.moveDir||u.side):(u.aimDir||u.side))!==cfg.face,rot,true,u.flash>0?'hit':'');
  drawTracks(u,x);
  // muzzle glow when firing
  if(u.fireFlash>0&&u.type!=='VAN'){
    cx.save();cx.globalCompositeOperation='lighter';
    const gx=x+(u.aimDir||u.side)*st.w*.55,gy=u.type==='TANK'?GROUND-24:GROUND-14;
    const gr=cx.createRadialGradient(gx,gy,1,gx,gy,u.type==='TANK'?26:14);
    gr.addColorStop(0,'rgba(255,220,140,.9)');gr.addColorStop(1,'rgba(255,140,40,0)');
    cx.fillStyle=gr;cx.fillRect(gx-30,gy-30,60,60);
    cx.restore();
  }
  if(foot&&u.moving){cx.strokeStyle='#3d4636';cx.lineWidth=2;cx.beginPath();cx.moveTo(x-2,GROUND-6);cx.lineTo(x-2+stride*3,GROUND);cx.moveTo(x+2,GROUND-6);cx.lineTo(x+2-stride*3,GROUND);cx.stroke();}
  if(u.type==='ENG'){cx.fillStyle='#a99a6c';cx.fillRect(x-u.side*5,GROUND-13,4,6);if(u.work){cx.fillRect(x-10,GROUND-30,20*Math.min(1,u.work/3),3);}}
  // hp pip
  if(u.hp<u.maxhp){
    cx.fillStyle='#000a';cx.fillRect(x-12,GROUND-UT[u.type].h-16,24,3);
    cx.fillStyle=u.side===1?'#4db2ff':'#ff5548';
    cx.fillRect(x-12,GROUND-UT[u.type].h-16,24*(u.hp/u.maxhp),3);
  }
}

function drawHeli(h){
  const x=h.x-G.camX;
  if(x<-170||x>W+170)return;
  groundShadow(h.x,GROUND-h.y,130);
  const tilt=h.pitch||0,phase=h.rotorPhase||0;
  drawSprite('heli',h.side,x,h.y+(h.settle||0)*2,130,h.dir!==-1,tilt,false);
  // All rotor geometry shares the airframe transform, including its mast and tail.
  const mx=x+(h.dir===1?9:-9),my=h.y-13;
  cx.save();cx.translate(x,h.y);cx.rotate(tilt);
  const mast=h.dir===1?9:-9;
  cx.fillStyle='rgba(170,177,168,'+(.07*(h.rotorSpeed??1))+')';
  cx.beginPath();cx.ellipse(mast,-13,62,5.5,0,0,Math.PI*2);cx.fill();
  for(let i=0;i<5;i++){
    const a=phase-i*.19,sw=Math.cos(a)*61,depth=Math.sin(a)*5;
    cx.strokeStyle='rgba(203,207,195,'+(.34-i*.055)+')';cx.lineWidth=1.4;
    cx.beginPath();cx.moveTo(mast-sw,-13-depth);cx.lineTo(mast+sw,-13+depth);cx.stroke();
  }
  cx.strokeStyle='rgba(187,192,177,.5)';cx.lineWidth=1.2;
  const tail=-h.dir*56;
  for(let i=0;i<2;i++){const a=phase*1.7+i*Math.PI/2;cx.beginPath();cx.moveTo(tail-Math.cos(a)*3,-6-Math.sin(a)*9);cx.lineTo(tail+Math.cos(a)*3,-6+Math.sin(a)*9);cx.stroke();}
  cx.restore();
  // cargo / rearm labels
  cx.textAlign='center';
  if(h.cargo>0&&!TOUCH.active&&keys.KeyE){
    cx.fillStyle='#ffd97a';cx.font='bold 10px monospace';
    cx.fillText('▲'+h.cargo,x,h.y-44);
  }
  if(h.rearming&&!TOUCH.active){
    cx.fillStyle='#8dff8d';cx.font='bold 9px monospace';
    cx.fillText(h.service==='forward'?'FORWARD SERVICE':'HQ SERVICE',x,h.y-56);
  }
  // hp bar
  if(h.hp<h.maxhp){
    cx.fillStyle='#000a';cx.fillRect(x-24,h.y-38,48,4);
    cx.fillStyle=h.side===1?'#4db2ff':'#ff5548';
    cx.fillRect(x-24,h.y-38,48*(h.hp/h.maxhp),4);
  }
  // Navigation lamps and momentary muzzle illumination stay attached to the airframe.
  cx.save();
  cx.fillStyle=h.side===1?'#83ffbd':'#ff7364';
  cx.shadowColor=cx.fillStyle;cx.shadowBlur=7;
  cx.beginPath();cx.arc(x-h.dir*42,h.y+3,1.6,0,Math.PI*2);cx.fill();
  if(Math.sin(G.anim*5+h.seed)> .94){
    cx.fillStyle='#fff';cx.fillRect(mx-2,my-4,4,2);
  }
  if(h.cdGun>(h.side===1?GUN_CD:.16)-.035){
    const fx=x+h.dir*40,fy=h.y+3;
    const glow=cx.createRadialGradient(fx,fy,0,fx,fy,23);
    glow.addColorStop(0,'rgba(255,230,160,.6)');glow.addColorStop(1,'rgba(255,160,50,0)');
    cx.fillStyle=glow;cx.fillRect(fx-23,fy-23,46,46);
  }
  cx.restore();
  if(h.side===1&&!h.dead){
    const rx=x+h.dir*125,ry=h.y+3;
    const ready=1-clamp(h.cdGun/GUN_CD,0,1);
    cx.save();cx.strokeStyle='rgba(190,225,230,.55)';cx.lineWidth=1;
    cx.beginPath();cx.moveTo(rx-4,ry);cx.lineTo(rx+4,ry);
    cx.moveTo(rx,ry-3);cx.lineTo(rx,ry+3);cx.stroke();
    for(let i=0;i<4;i++){
      cx.fillStyle=i<Math.ceil(ready*4)?'rgba(130,221,211,.65)':'rgba(255,184,77,.25)';
      cx.fillRect(rx-8+i*5,ry+10,3,2);
    }
    const target=nearestAirTarget(h.x,h.y,1,1600)||nearestGroundTarget(h.x,h.y,1,1600);
    if(target&&h.mis>=1&&!G.replayView&&(keys.KeyM||h.cdMis>.8)){
      const tx=target.x-G.camX,ty=target.y??GROUND-UT[target.type].h/2;
      cx.strokeStyle=h.cdMis<=0?'rgba(255,199,100,.8)':'rgba(255,199,100,.3)';
      cx.beginPath();
      for(const d of [-1,1]){
        cx.moveTo(tx+d*22,ty-8);cx.lineTo(tx+d*22,ty-16);cx.lineTo(tx+d*14,ty-16);
        cx.moveTo(tx+d*22,ty+8);cx.lineTo(tx+d*22,ty+16);cx.lineTo(tx+d*14,ty+16);
      }
      cx.stroke();cx.font='9px monospace';cx.fillStyle='#ffd190';cx.textAlign='center';
      if(!TOUCH.active)cx.fillText(h.cdMis<=0?'M • LOCK':'RELOADING',tx,ty-23);
    }
    if(h.y>=GROUND-130&&!TOUCH.active&&keys.KeyE){
      const count=G.units.filter(u=>['INF','ENG'].includes(u.type)&&u.side===1&&Math.abs(u.x-h.x)<115).length;
      if(h.cargo||count){
        cx.font='bold 10px monospace';cx.textAlign='center';cx.fillStyle='#c6e8db';
        cx.fillText(h.cargo?'E • DROP '+h.cargo+' TROOPS':'E • PICK UP '+Math.min(4,count),x,h.y+39);
      }
    }
    cx.restore();
  }
}

function drawProjectiles(){
  cx.save();
  for(const b of G.bullets){
    const x=b.x-G.camX;
    cx.globalCompositeOperation='lighter';
    cx.fillStyle='rgba(255,170,60,.35)';cx.fillRect(x-7,b.y-2.5,14,5);
    cx.strokeStyle='#fff0c4';cx.lineWidth=1.2;cx.beginPath();cx.moveTo(x,b.y);cx.lineTo(x-b.vx*.012,b.y-b.vy*.012);cx.stroke();
  }
  cx.globalCompositeOperation='lighter';
  for(const s of G.shells){
    const x=s.x-G.camX;
    cx.fillStyle='rgba(255,150,50,.3)';
    cx.beginPath();cx.arc(x,s.y,7,0,7);cx.fill();
    cx.fillStyle='#ffe9a0';
    cx.beginPath();cx.arc(x,s.y,3,0,7);cx.fill();
  }
  cx.globalCompositeOperation='source-over';
  for(const b of G.bombs){
    const x=b.x-G.camX;
    cx.save();cx.translate(x,b.y);cx.rotate(Math.atan2(b.vy,b.vx));
    cx.fillStyle='#353b36';cx.beginPath();cx.ellipse(0,0,7,3,0,0,7);cx.fill();
    cx.fillStyle='#92947f';cx.fillRect(-6,-4,2,8);cx.fillStyle='#b0ab83';cx.fillRect(1,-2,2,4);cx.restore();
  }
  for(const m of G.missiles){
    const x=m.x-G.camX;
    const a=Math.atan2(m.vy,m.vx);
    cx.save();cx.translate(x,m.y);cx.rotate(a);
    cx.fillStyle='#e8ecf5';cx.fillRect(-8,-2,15,4);
    cx.fillStyle='#c23';cx.fillRect(-10,-2,3,4);
    cx.restore();
    // exhaust flame
    cx.globalCompositeOperation='lighter';
    const fx=x-Math.cos(a)*10,fy=y0(m)-Math.sin(a)*10;
    const gr=cx.createRadialGradient(fx,fy,1,fx,fy,12);
    gr.addColorStop(0,'rgba(255,230,160,.95)');gr.addColorStop(1,'rgba(255,110,30,0)');
    cx.fillStyle=gr;cx.fillRect(fx-14,fy-14,28,28);
    cx.globalCompositeOperation='source-over';
  }
  cx.restore();
}
function y0(m){return m.y;}
function drawParts(){
  cx.save();
  for(const p of G.parts){
    const x=p.x-G.camX;
    if(x < -150||x > W+150)continue;
    if(p.ring){
      cx.globalCompositeOperation='lighter';
      cx.globalAlpha=clamp(p.life*2.4,0,1)*.8;
      cx.strokeStyle=p.c;cx.lineWidth=2.5;
      cx.beginPath();cx.arc(x,p.y,p.r,0,7);cx.stroke();
      continue;
    }
    cx.globalCompositeOperation=p.add?'lighter':'source-over';
    cx.globalAlpha=clamp(p.life*2,0,1)*(p.add?.95:.55);
    cx.fillStyle=p.c;
    if(p.streak){
      cx.strokeStyle=p.c;cx.lineWidth=2;
      cx.beginPath();cx.moveTo(x,p.y);cx.lineTo(x-p.vx*.03,p.y-p.vy*.03);cx.stroke();
      continue;
    }
    const s=p.add?p.s*1.4:p.s;
    if(s>3){
      const puff=cx.createRadialGradient(x-s*.15,p.y-s*.2,0,x,p.y,s);
      puff.addColorStop(0,p.c);puff.addColorStop(.35,p.c);puff.addColorStop(1,'transparent');cx.fillStyle=puff;
    }
    cx.beginPath();cx.arc(x,p.y,s,0,7);cx.fill();
  }
  cx.restore();
  cx.globalAlpha=1;
}
function drawVignette(){
  const g=cx.createRadialGradient(W/2,H/2,H*.5,W/2,H/2,H*1.08);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.28)');
  cx.fillStyle=g;cx.fillRect(0,0,W,H);
}

function drawThreatIndicator(x,y,onRight,label,color){
  cx.save();
  const blink=Math.sin(G.anim*8)>0;
  cx.fillStyle=color;cx.strokeStyle='#fff';cx.lineWidth=1;
  const dir=onRight?-1:1;
  cx.beginPath();
  cx.moveTo(x+dir*12,y);cx.lineTo(x-dir*4,y-8);cx.lineTo(x-dir*4,y+8);cx.closePath();
  cx.fill();if(blink)cx.stroke();

  cx.font='bold 10px monospace';
  cx.fillStyle='rgba(10,14,24,.85)';

  cx.strokeStyle=color;cx.strokeRect(lx-4,y-9,tw+8,18);
  cx.fillStyle=blink?'#fff':color;cx.textAlign='left';
  cx.fillText(label,lx,y+4);
  cx.restore();
}

// ---------- HUD
function drawHUD(){
  G.buttons=[];
  let canvasHover=false;
  const p=G.helis[0];

  function regBtn(id,x,y,w,h,onClick){
    const isHover=mouse.x>=x&&mouse.x<=x+w&&mouse.y>=y&&mouse.y<=y+h;
    if(isHover)canvasHover=true;
    G.buttons.push({id,x,y,w,h,onClick});
    return isHover;
  }

  function drawKeycap(key,x,y,w,h,active){
    cx.save();
    cx.fillStyle=active?'#2b4870':'#172033';
    cx.strokeStyle=active?'#70b0ff':'#3a4d70';
    cx.lineWidth=1.5;
    cx.beginPath();cx.roundRect(x,y,w,h,4);cx.fill();cx.stroke();
    cx.fillStyle=active?'#ffffff':'#a0b6dc';
    cx.font='bold 11px monospace';cx.textAlign='center';
    cx.fillText(key,x+w/2,y+h/2+4);
    cx.restore();

  // 1. TOP-LEFT COCKPIT DASHBOARD (Hull, Lives, Funds, Score, Cargo)

    cx.fillRect(dx-1,dy-1,5,2);cx.fillRect(dx-1,dy-1,2,5);
    cx.fillRect(dx+dw-4,dy-1,5,2);cx.fillRect(dx+dw-1,dy-1,2,5);
    cx.fillRect(dx-1,dy+dh-1,5,2);cx.fillRect(dx-1,dy+dh-4,2,5);
    cx.fillRect(dx+dw-4,dy+dh-1,5,2);cx.fillRect(dx+dw-1,dy+dh-4,2,5);

    // Row 1: Hull Integrity Bar + Heli Lives

    cx.fillText('HULL INTEGRITY',dx+10,dy+16);

      cx.fillStyle=hpCol;
    }
    cx.fillRect(bx+1,by+1,(bw-2)*hpPct,bh-2);

      cx.font='bold 9px monospace';cx.fillStyle='#ff5548';cx.textAlign='left';
      cx.fillText('CRITICAL!',bx+bw+8,by+9);
    }else{

    }
    cx.restore();
  }

  // 2. BOTTOM-LEFT WEAPON CLUSTER
  {
    const ox=14,oy=H-118,ow=306,oh=104;
